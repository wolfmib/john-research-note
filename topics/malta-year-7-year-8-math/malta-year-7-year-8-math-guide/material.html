<script type="application/json" id="material-data">{"slug":"malta-year-7-year-8-math-guide","title":"Guide — Malta Year 7 and Year 8 Math","heading":"Malta Year 7 and Year 8 Math","course":"Guide","intro":"\u003cp>Year 7 and Year 8 follow the same eight units, from number to probability; Year 8 returns to each unit and goes one step further. Labels such as 1-1 and 1-2 name the subtopics on these pages, not official syllabus codes. The outline follows Track 3.\u003c/p>\n\u003cp>\u003cstrong>Year 7 — foundations\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Unit 1 Number System:\u003c/strong> 1-1 place value and ordering · 1-2 factors, multiples, primes, LCM · 1-3 squares and cubes · 1-4 decimals, percentages, negative numbers\u003c/li>\n\u003cli>\u003cstrong>Unit 2 Numerical Calculations:\u003c/strong> 2-1 BIDMAS · 2-2 rounding · 2-3 fractions · 2-4 percentages of amounts · 2-5 money and direct proportion\u003c/li>\n\u003cli>\u003cstrong>Unit 3 Algebra:\u003c/strong> 3-1 sequences · 3-2 expressions and brackets · 3-3 substitution · 3-4 simple equations · 3-5 coordinates, straight-line graphs, function machines\u003c/li>\n\u003cli>\u003cstrong>Unit 4 Measurement:\u003c/strong> 4-1 angles · 4-2 metric units · 4-3 areas of rectangles, triangles and compound shapes · 4-4 volume of cubes and cuboids · 4-5 time\u003c/li>\n\u003cli>\u003cstrong>Unit 5 Euclidean Geometry:\u003c/strong> 5-1 angles on parallel lines · 5-2 triangles and quadrilaterals · 5-3 nets · 5-4 constructing triangles · 5-5 shapes on coordinates\u003c/li>\n\u003cli>\u003cstrong>Unit 6 Transformation Geometry:\u003c/strong> 6-1 lines of symmetry · 6-2 quadrilaterals by reflection symmetry\u003c/li>\n\u003cli>\u003cstrong>Unit 7 Statistics:\u003c/strong> 7-1 frequency tables · 7-2 bar charts and Carroll diagrams · 7-3 mean, median, mode, range\u003c/li>\n\u003cli>\u003cstrong>Unit 8 Probability:\u003c/strong> 8-1 the language of chance · 8-2 listing outcomes · 8-3 simple probability · 8-4 experimental and theoretical probability\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Year 8 — building on Year 7\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Unit 1 Number System:\u003c/strong> 1-1 powers · 1-2 LCM of three numbers · 1-3 square and cube roots · 1-4 recurring decimals and fractions\u003c/li>\n\u003cli>\u003cstrong>Unit 2 Numerical Calculations:\u003c/strong> 2-1 prime factorisation · 2-2 negative numbers · 2-3 mixed numbers · 2-4 percentage change · 2-5 currency, ratio, proportion, map scales\u003c/li>\n\u003cli>\u003cstrong>Unit 3 Algebra:\u003c/strong> 3-1 signed terms and brackets · 3-2 substitution and changing the subject · 3-3 unknowns on both sides · 3-4 straight lines \u003cspan class=\"katex\">\u003cspan class=\"katex-mathml\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmi>y\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>m\u003c/mi>\u003cmi>x\u003c/mi>\u003cmo>+\u003c/mo>\u003cmi>c\u003c/mi>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">y = mx + c\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/span>\u003cspan class=\"katex-html\" aria-hidden=\"true\">\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:0.625em;vertical-align:-0.1944em;\">\u003c/span>\u003cspan class=\"mord mathnormal\" style=\"margin-right:0.0359em;\">y\u003c/span>\u003cspan class=\"mspace\" style=\"margin-right:0.2778em;\">\u003c/span>\u003cspan class=\"mrel\">=\u003c/span>\u003cspan class=\"mspace\" style=\"margin-right:0.2778em;\">\u003c/span>\u003c/span>\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:0.6667em;vertical-align:-0.0833em;\">\u003c/span>\u003cspan class=\"mord mathnormal\">m\u003c/span>\u003cspan class=\"mord mathnormal\">x\u003c/span>\u003cspan class=\"mspace\" style=\"margin-right:0.2222em;\">\u003c/span>\u003cspan class=\"mbin\">+\u003c/span>\u003cspan class=\"mspace\" style=\"margin-right:0.2222em;\">\u003c/span>\u003c/span>\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:0.4306em;\">\u003c/span>\u003cspan class=\"mord mathnormal\">c\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/li>\n\u003cli>\u003cstrong>Unit 4 Measurement:\u003c/strong> 4-1 parallelograms and trapezia · 4-2 circumference and area of a circle · 4-3 compound areas · 4-4 surface area of cubes and cuboids\u003c/li>\n\u003cli>\u003cstrong>Unit 5 Euclidean Geometry:\u003c/strong> 5-1 exterior angles · 5-2 quadrilateral problems · 5-3 nets of prisms and pyramids · 5-4 parts of a circle · 5-5 compass constructions\u003c/li>\n\u003cli>\u003cstrong>Unit 6 Transformation Geometry:\u003c/strong> 6-1 reflections · 6-2 rotational symmetry · 6-3 rotations · 6-4 translations by vectors\u003c/li>\n\u003cli>\u003cstrong>Unit 7 Statistics:\u003c/strong> 7-1 pie charts · 7-2 choosing an average · 7-3 outliers and range\u003c/li>\n\u003cli>\u003cstrong>Unit 8 Probability:\u003c/strong> 8-1 probabilities that add up to 1 · 8-2 sample spaces for two events\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Where to start:\u003c/strong> Year 7 Units 1–3 (number, calculations, algebra) — every Year 8 unit builds on them.\u003c/p>\n\u003cp>Official syllabi: \u003ca href=\"https://curriculum.gov.mt/wp-content/uploads/2026/07/syllabus_maths_yr07_Track-3_Sept_2026.pdf\">Year 7 Track 3\u003c/a> · \u003ca href=\"https://curriculum.gov.mt/wp-content/uploads/2026/07/syllabus_maths_yr08_Track-3_Sept_2026.pdf\">Year 8 Track 3\u003c/a> · \u003ca href=\"https://curriculum.gov.mt/years-7-and-8-learning-outcomes-programmes-and-syllabi-2/\">all Years 7–8 syllabi\u003c/a>.\u003c/p>\n","figure":"","figureAlt":"Malta Year 7 and Year 8 Math","questions":[{"group":"Year 7 · Unit 1 — Number System","title":"LCM of two box sizes","prompt":"\u003cp>A café sells pastizzi in boxes of 6 and qassatat in boxes of 9. What is the smallest number of each that makes the two totals equal, and how many boxes is that?\u003c/p>\n","steps":["\u003cp>List the multiples of each box size until one \"0\" displaystyle=\"true\">\u003cmsup>\u003cmn>150\u003c/mn>\u003cmo>∘\u003c/mo>\u003c/msup>\u003c/mstyle>\u003c/mstyle>\u003c/mstyle>\u003c/menclose>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">\\frac{15}{36}\\times360^\\circ = \\boxed{150^\\circ}\n\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/span>\u003cspan class=\"katex-html\" aria-hidden=\"true\">\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:2.0074em;vertical-align:-0.686em;\">\u003c/span>\u003cspan class=\"mord\">\u003cspan class=\"mopen nulldelimiter\">\u003c/span>\u003cspan class=\"mfrac\">\u003cspan class=\"vlist-t vlist-t2\">\u003cspan class=\"vlist-r\">\u003cspan class=\"vlist\" style=\"height:1.3214em;\">\u003cspan style=\"top:-2.314em;\">\u003cspan class=\"pstrut\" style=\"height:3em;\">\u003c/span>\u003cspan class=\"mord\">\u003cspan class=\"mord\">36\u003c/span>\u003c/span>\u003c/span>\u003cspan style=\"top:-3.23em;\">\u003cspan class=\"pstrut\" style=\"height:3em;\">\u003c/span>\u003cspan class=\"frac-line\" style=\"border-bottom-width:0.04em;\">\u003c/span>\u003c/span>\u003cspan style=\"top:-3.677em;\">\u003cspan class=\"pstrut\" style=\"height:3em;\">\u003c/span>\u003cspan class=\"mord\">\u003cspan class=\"mord\">15\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003cspan class=\"vlist-s\">​\u003c/span>\u003c/span>\u003cspan class=\"vlist-r\">\u003cspan class=\"vlist\" style=\"height:0.686em;\">\u003cspan>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003cspan class=\"mclose nulldelimiter\">\u003c/span>\u003c/span>\u003cspan class=\"mspace\" style=\"margin-right:0.2222em;\">\u003c/span>\u003cspan class=\"mbin\">×\u003c/span>\u003cspan class=\"mspace\" style=\"margin-right:0.2222em;\">\u003c/span>\u003c/span>\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:0.7241em;\">\u003c/span>\u003cspan class=\"mord\">36\u003c/span>\u003cspan class=\"mord\">\u003cspan class=\"mord\">0\u003c/span>\u003cspan class=\"msupsub\">\u003csp \"height:0.34em;\">\u003cspan>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/p>\n"]},{"group":"Year 8 · Unit 8 — Probability","title":"Two events together","prompt":"\u003cp>A fair die is rolled and a fair coin is tossed. Find the probability of an even number and heads.\u003c/p>\n","steps":["\u003cp>The sample space has \u003cspan class=\"katex\">\u003cspan class=\"katex-mathml\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmn>6\u003c/mn>\u003cmo>×\u003c/mo>\u003cmn>2\u003c/mn>\u003cmo>=\u003c/mo>\u003cmn>12\u003c/mn>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">6\\times2 = 12\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/span>\u003cspan class=\"katex-html\" aria-hidden=\"true\">\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:0.7278em;vertical-align:-0.0833em;\">\u003c/span>\u003cspan class=\"mord\">6\u003c/span>\u003cspan class=\"mspace\" style=\"margin-right:0.2222em;\">\u003c/span>\u003cspan class=\"mbin\">×\u003c/span>\u003cspan class=\"mspace\" style=\"margin-right:0.2222em;\">\u003c/span>\u003c/span>\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:0.6444em;\">\u003c/span>\u003cspan class=\"mord\">2\u003c/span>\u003cspan class=\"mspace\" style=\"margin-right:0.2778em;\">\u003c/span>\u003cspan class=\"mrel\">=\u003c/span>\u003cspan class=\"mspace\" style=\"margin-right:0.2778em;\">\u003c/span>\u003c/span>\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:0.6444em;\">\u003c/span>\u003cspan class=\"mord\">12\u003c/span>\u003c/span>\u003c/span>\u003c/span> equally likely outcomes. The favourable ones are 2H, 4H and 6H:\u003c/p>\n\u003cp class=\"katex-block\">\u003cspan class=\"katex-display\">\u003cspan class=\"katex\">\u003cspan class=\"katex-mathml\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003csemantics>\u003cmrow>\u003cmi>P\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmn>3\u003c/mn>\u003cmn>12\u003c/mn>\u003c/mfrac>\u003cmo>=\u003c/mo>\u003cmenclose notation=\"box\">\u003cmstyle scriptlevel=\"0\" displaystyle=\"false\">\u003cmstyle scriptlevel=\"0\" displaystyle=\"false\">\u003cmstyle scriptlevel=\"0\" displaystyle=\"true\">\u003cmfrac>\u003cmn>1\u003c/mn>\u003cmn>4\u003c/mn>\u003c/mfrac>\u003c/mstyle>\u003c/mstyle>\u003c/mstyle>\u003c/menclose>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">P = \\frac{3}{12} = \\boxed{\\frac14}\n\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/span>\u003cspan class=\"katex-html\" aria-hidden=\"true\">\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:0.6833em;\">\u003c/span>\u003cspan class=\"mord mathnormal\" style=\"margin-right:0.1389em;\">P\u003c/span>\u003cspan class=\"mspace\" style=\"margin-right:0.2778em;\">\u003c/span>\u003cspan class=\"mrel\">=\u003c/span>\u003cspan class=\"mspace\" style=\"margin-right:0.2778em;\">\u003c/span>\u003c/span>\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:2.0074em;vertical-align:-0.686em;\">\u003c/span>\u003cspan class=\"mord\">\u003cspan class=\"mopen nulldelimiter\">\u003c/span>\u003cspan class=\"mfrac\">\u003cspan class=\"vlist-t vlist-t2\">\u003cspan class=\"vlist-r\">\u003cspan class=\"vlist\" style=\"height:1.3214em;\">\u003cspan style=\"top:-2.314em;\">\u003cspan class=\"pstrut\" style=\"height:3em;\">\u003c/span>\u003cspan class=\"mord\">\u003cspan class=\"mord\">12\u003c/span>\u003c/span>\u003c/span>\u003cspan style=\"top:-3.23em;\">\u003cspan class=\"pstrut\" style=\"height:3em;\">\u003c/span>\u003cspan class=\"frac-line\" style=\"border-bottom-width:0.04em;\">\u003c/span>\u003c/span>\u003cspan style=\"top:-3.677em;\">\u003cspan class=\"pstrut\" style=\"height:3em;\">\u003c/span>\u003cspan class=\"mord\">\u003cspan class=\"mord\">3\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003cspan class=\"vlist-s\">​\u003c/span>\u003c/span>\u003cspan class=\"vlist-r\">\u003cspan class=\"vlist\" style=\"height:0.686em;\">\u003cspan>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003cspan class=\"mclose nulldelimiter\">\u003c/span>\u003c/span>\u003cspan class=\"mspace\" style=\"margin-right:0.2778em;\">\u003c/span>\u003cspan class=\"mrel\">=\u003c/span>\u003cspan class=\"mspace\" style=\"margin-right:0.2778em;\">\u003c/span>\u003c/span>\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:2.6874em;vertical-align:-1.026em;\">\u003c/span>\u003cspan class=\"mord\">\u003cspan class=\"vlist-t vlist-t2\">\u003cspan class=\"vlist-r\">\u003cspan class=\"vlist\" style=\"height:1.6614em;\">\u003cspan style=\"top:-4.6874em;\">\u003cspan class=\"pstrut\" style=\"height:4.6874em;\">\u003c/span>\u003cspan class=\"boxpad\">\u003cspan class=\"mord\">\u003cspan class=\"mord\">\u003cspan class=\"mord\">\u003cspan class=\"mopen nulldelimiter\">\u003c/span>\u003cspan class=\"mfrac\">\u003cspan class=\"vlist-t vlist-t2\">\u003cspan class=\"vlist-r\">\u003cspan class=\"vlist\" style=\"height:1.3214em;\">\u003cspan style=\"top:-2.314em;\">\u003cspan class=\"pstrut\" style=\"height:3em;\">\u003c/span>\u003cspan class=\"mord\">\u003cspan class=\"mord\">4\u003c/span>\u003c/span>\u003c/span>\u003cspan style=\"top:-3.23em;\">\u003cspan class=\"pstrut\" style=\"height:3em;\">\u003c/span>\u003cspan class=\"frac-line\" style=\"border-bottom-width:0.04em;\">\u003c/span>\u003c/span>\u003cspan style=\"top:-3.677em;\">\u003cspan class=\"pstrut\" style=\"height:3em;\">\u003c/span>\u003cspan class=\"mord\">\u003cspan class=\"mord\">1\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003cspan class=\"vlist-s\">​\u003c/span>\u003c/span>\u003cspan class=\"vlist-r\">\u003cspan class=\"vlist\" style=\"height:0.686em;\">\u003cspan>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003cspan class=\"mclose nulldelimiter\">\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003cspan style=\"top:-3.6614em;\">\u003cspan class=\"pstrut\" style=\"height:4.6874em;\">\u003c/span>\u003cspan class=\"stretchy fbox\" style=\"height:2.6874em;border-style:solid;border-width:0.04em;\">\u003c/span>\u003c/span>\u003c/span>\u003cspan class=\"vlist-s\">​\u003c/span>\u003c/span>\u003cspan class=\"vlist-r\">\u003cspan class=\"vlist\" style=\"height:1.026em;\">\u003cspan>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/p>\n"]}]}</script>
<script>
(() => {
  'use strict';
  const D = JSON.parse(document.getElementById('material-data').textContent);
  const app = document.getElementById('app');
  const shown = D.questions.map(() => 0);     // steps revealed per question
  const reduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  // Fit display math to the phone: use the stacked version of a wide line, then shrink what still overflows.
  function fitMath(root) {
    (root || app).querySelectorAll('.mw').forEach(w => {
      w.classList.remove('stacked');
      const d = w.querySelector('.m-wide .katex-display');
      if (d && d.offsetParent && d.scrollWidth > d.clientWidth * 1.12) w.classList.add('stacked');
    });
    (root || app).querySelectorAll('.katex-display').forEach(d => {
      d.style.fontSize = '';
      if (!d.offsetParent) return;
      let s = 1;
      for (let k = 0; k < 5 && d.scrollWidth > d.clientWidth + 1 && s > 0.7; k++) {
        s = Math.max(0.7, s * (d.clientWidth / d.scrollWidth) * 0.97);
        d.style.fontSize = s + 'em';
      }
    });
  }

  function label(i) {
    const n = D.questions[i].steps.length, k = shown[i];
    if (k === 0) return 'Show working';
    if (k < n) return `Next step (${k + 1}/${n})`;
    return 'Hide working';
  }

  function update(i) {
    const card = document.getElementById('q' + i);
    card.querySelectorAll('.step').forEach((s, k) => { s.hidden = k >= shown[i]; });
    const b = card.querySelector('[data-act="step"]');
    b.textContent = label(i);
    b.classList.toggle('primary', shown[i] < D.questions[i].steps.length);
    b.classList.toggle('secondary', shown[i] === D.questions[i].steps.length);
    b.setAttribute('aria-expanded', String(shown[i] > 0));
    fitMath(card);
  }

  function allOpen() { return D.questions.every((q, i) => shown[i] === q.steps.length); }
  function updateAll() {
    D.questions.forEach((_, i) => update(i));
    document.querySelector('[data-act="all"]').textContent = allOpen() ? 'Hide all' : 'Show all';
  }

  app.innerHTML = `
    <div class="topbar"><div class="row">
      <a class="back" href="../index.html#material">‹ Material</a>
      <button class="btn ghost narrow showall" data-act="all">Show all</button>
    </div></div>
    <section class="card">
      <p class="eyebrow">${esc(D.course)}</p>
      <h1>${esc(D.heading)}</h1>
      ${D.intro ? `<div class="prose">${D.intro}</div>` : ''}
      ${D.figure ? `<figure class="figure"><img src="${esc(D.figure)}" alt="${esc(D.figureAlt)}"></figure>` : ''}
    </section>
    ${D.questions.map((q, i) => `${q.group && q.group !== (D.questions[i - 1] || {}).group ? `
    <h2 class="course">${esc(q.group)}</h2>` : ''}
    <section class="card mq" id="q${i}">
      <h2 class="qtitle"><span class="qnum" aria-hidden="true">${i + 1}</span><span>${esc(q.title)}</span></h2>
      <div class="prose">${q.prompt}</div>
      <div class="steps" id="steps${i}">${q.steps.map(s => `<div class="step prose" hidden>${s}</div>`).join('')}</div>
      <button class="btn primary reveal" data-act="step" data-i="${i}" aria-controls="steps${i}" aria-expanded="false">Show working</button>
    </section>`).join('')}
    <p class="foot"><a href="../index.html#material">All material</a>${D.link ? ` · <a href="${esc(D.link[1])}">${esc(D.link[0])}</a>` : ''}</p>`;

  document.addEventListener('click', e => {
    const b = e.target.closest('[data-act]');
    if (!b) return;
    if (b.dataset.act === 'step') {
      const i = +b.dataset.i, n = D.questions[i].steps.length;
      shown[i] = shown[i] < n ? shown[i] + 1 : 0;
      update(i);
      document.querySelector('[data-act="all"]').textContent = allOpen() ? 'Hide all' : 'Show all';
      if (shown[i] > 0) {
        const s = document.querySelectorAll(`#q${i} .step`)[shown[i] - 1];
        s.scrollIntoView({ behavior: reduced ? 'auto' : 'smooth', block: 'nearest' });
      }
    } else if (b.dataset.act === 'all') {
      const open = !allOpen();
      D.questions.forEach((q, i) => { shown[i] = open ? q.steps.length : 0; });
      updateAll();
    }
  });
  window.addEventListener('resize', () => fitMath(app));
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => fitMath(app));
  updateAll();
})();
</script>

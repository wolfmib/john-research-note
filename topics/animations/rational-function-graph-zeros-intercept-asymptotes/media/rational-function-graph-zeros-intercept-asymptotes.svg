<rect width="1000" height="640" class="bg"/>
<text class="tm title" x="50" y="44" font-size="24" font-weight="bold" ><tspan font-style="italic">Graphing</tspan> <tspan font-style="italic">a</tspan> <tspan font-style="italic">Rational</tspan> <tspan font-style="italic">Function</tspan> — <tspan font-style="italic">Zeros</tspan>, <tspan font-style="italic">Intercept</tspan>, <tspan font-style="italic">Asymptotes</tspan></text>
<line class="title axis" x1="50" y1="58" x2="950" y2="58"/>
<text class="ts s1" x="50" y="100" font-size="14" font-family="system-ui,sans-serif" >1. The function:</text>
<text class="cy s1" x="60" y="141" font-size="22" ><tspan font-style="italic">f</tspan>(<tspan font-style="italic">x</tspan>) =</text>
<text class="tm s1" x="209.5" y="126" font-size="22" text-anchor="middle" >(<tspan font-style="italic">x</tspan> − 2)(<tspan font-style="italic">x</tspan> + 1)</text>
<text class="tm s1" x="209.5" y="156" font-size="22" text-anchor="middle" ><tspan font-style="italic">x</tspan> − 3</text>
<line class="tm s1" x1="130" y1="134" x2="289" y2="134" stroke="#f0f4f8" stroke-width="1.6"/>
<text class="ts s2" x="50" y="188" font-size="14" font-family="system-ui,sans-serif" >2. Zeros — set the numerator to 0:</text>
<text class="tm s2" x="60" y="218" font-size="20" >(<tspan font-style="italic">x</tspan> − 2)(<tspan font-style="italic">x</tspan> + 1) = 0   ⇒   <tspan font-style="italic">x</tspan> = 2,   <tspan font-style="italic">x</tspan> = −1</text>
<text class="ye s2b" x="60" y="244" font-size="15" font-family="system-ui,sans-serif" >x-intercepts  (−1, 0)  and  (2, 0)</text>
<text class="ts s3" x="50" y="280" font-size="14" font-family="system-ui,sans-serif" >3. y-intercept — evaluate f(0):</text>
<text class="cy s3" x="60" y="316" font-size="22" ><tspan font-style="italic">f</tspan>(0) =</text>
<text class="tm s3" x="171.34375" y="301" font-size="20" text-anchor="middle" >(−2)(1)</text>
<text class="tm s3" x="171.34375" y="331" font-size="20" text-anchor="middle" >−3</text>
<line class="tm s3" x1="130" y1="309" x2="213" y2="309" stroke="#f0f4f8" stroke-width="1.6"/>
<text class="tm s3" x="222.6875" y="316" font-size="20" >=</text>
<text class="tm s3" x="257.6875" y="301" font-size="20" text-anchor="middle" >2</text>
<text class="tm s3" x="257.6875" y="331" font-size="20" text-anchor="middle" >3</text>
<line class="tm s3" x1="245" y1="309" x2="271" y2="309" stroke="#f0f4f8" stroke-width="1.6"/>
<text class="pu s3b" x="60" y="356" font-size="15" font-family="system-ui,sans-serif" >y-intercept  (0, 2/3)</text>
<text class="ts s4" x="50" y="388" font-size="14" font-family="system-ui,sans-serif" >4. Divide the numerator by the denominator (degree 2 ÷ degree 1):</text>
<text class="cy s4" x="60" y="424" font-size="22" ><tspan font-style="italic">f</tspan>(<tspan font-style="italic">x</tspan>) =</text>
<text class="tm s4" x="130" y="424" font-size="22" >(<tspan font-style="italic">x</tspan> + 2)</text>
<text class="tm s4" x="213.5" y="424" font-size="22" >+</text>
<text class="ye s4" x="270.21875" y="409" font-size="20" text-anchor="middle" >4</text>
<text class="ye s4" x="270.21875" y="439" font-size="20" text-anchor="middle" ><tspan font-style="italic">x</tspan> − 3</text>
<line class="ye s4" x1="238" y1="417" x2="303" y2="417" stroke="#facc15" stroke-width="1.6"/>
<text class="ts s4b" x="50" y="462" font-size="14" font-family="system-ui,sans-serif" >as x → ±∞ the remainder 4/(x − 3) → 0, so f(x) ≈ x + 2</text>
<text class="gr s4c" x="60" y="486" font-size="15" font-family="system-ui,sans-serif" >slant asymptote  y = x + 2</text>
<text class="ts s5" x="50" y="518" font-size="14" font-family="system-ui,sans-serif" >5. Denominator zero — no factor cancels it:</text>
<text class="tm s5" x="60" y="546" font-size="20" ><tspan font-style="italic">x</tspan> − 3 = 0   ⇒   <tspan font-style="italic">x</tspan> = 3</text>
<text class="rd s5b" x="60" y="570" font-size="15" font-family="system-ui,sans-serif" >vertical asymptote  x = 3</text>
<text class="ts s6" x="50" y="604" font-size="14" font-family="system-ui,sans-serif" >6. Draw f through the three points, hugging both asymptotes.</text>

.s1{opacity:0;animation:k_s1 30s linear forwards}@keyframes k_s1{0%{opacity:0}5.997%{opacity:0}7.333%{opacity:1}100%{opacity:1}}
.s2{opacity:0;animation:k_s2 30s linear forwards}@keyframes k_s2{0%{opacity:0}16.663%{opacity:0}18.000%{opacity:1}100%{opacity:1}}
.s2b{opacity:0;animation:k_s2b 30s linear forwards}@keyframes k_s2b{0%{opacity:0}19.997%{opacity:0}21.333%{opacity:1}100%{opacity:1}}

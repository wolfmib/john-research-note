<line class="grid" x1="0" y1="-252" x2="324" y2="-252"/>
<line class="grid" x1="0" y1="-288" x2="324" y2="-288"/>
<line class="grid" x1="0" y1="-324" x2="324" y2="-324"/>
<line class="grid" x1="0" y1="-360" x2="324" y2="-360"/>
<line class="grid" x1="0" y1="-396" x2="324" y2="-396"/>
<line class="grid" x1="0" y1="-432" x2="324" y2="-432"/>
<line class="grid" x1="0" y1="-468" x2="324" y2="-468"/>
<line class="axis" x1="0" y1="0" x2="324" y2="0"/><line class="axis" x1="0" y1="-468" x2="0" y2="0"/>
<text class="ts" x="144" y="16" font-size="11" font-family="system-ui,sans-serif" text-anchor="middle">4</text>
<text class="ts" x="288" y="16" font-size="11" font-family="system-ui,sans-serif" text-anchor="middle">8</text>
<text class="ts" x="-8" y="-212" font-size="11" font-family="system-ui,sans-serif" text-anchor="end">6</text>
<text class="ts" x="-8" y="-428" font-size="11" font-family="system-ui,sans-serif" text-anchor="end">12</text>
<text class="ts" x="-8" y="16" font-size="11" font-family="system-ui,sans-serif" text-anchor="end">0</text>
<text class="ts" x="320" y="-8" font-size="14" text-anchor="end"><tspan font-style="italic">x</tspan></text>
<text class="ts" x="10" y="-456" font-size="14"><tspan font-style="italic">y</tspan></text>
</g>
<g class="curve" clip-path="url(#plot)">
<polyline points="0.0,-54.0 2.8,-55.4 5.7,-56.9 8.5,-58.5 11.3,-60.1 14.2,-61.8 17.0,-63.5 19.9,-65.3 22.7,-67.1 25.5,-69.0 28.4,-71.0 31.2,-73.0 34.0,-75.0 36.9,-77.2 39.7,-79.3 42.5,-81.6 45.4,-83.8 48.2,-86.2 51.1,-88.6 53.9,-91.0 56.7,-93.5 59.6,-96.1 62.4,-98.7 65.2,-101.4 68.1,-104.1 70.9,-106.9 73.7,-109.8 76.6,-112.7 79.4,-115.6 82.3,-118.6 85.1,-121.7 87.9,-124.8 90.8,-128.0 93.6,-131.2 96.4,-134.5 99.3,-137.9 102.1,-141.3 104.9,-144.7 107.8,-148.2 110.6,-151.8 113.5,-155.4 116.3,-159.1 119.1,-162.8 122.0,-166.6 124.8,-170.5 127.6,-174.4 130.5,-178.3 133.3,-182.4 136.1,-186.4 139.0,-190.6 141.8,-194.7 144.7,-199.0 147.5,-203.3 150.3,-207.6 153.2,-212.0 156.0,-216.5 158.8,-221.0 161.7,-225.6 164.5,-230.2 167.3,-234.9 170.2,-239.7 173.0,-244.5 175.9,-249.3 178.7,-254.2 181.5,-259.2 184.4,-264.2 187.2,-269.3 190.0,-274.4 192.9,-279.6 195.7,-284.8 198.5,-290.1 201.4,-295.5 204.2,-300.9 207.1,-306.4 209.9,-311.9 212.7,-317.5 215.6,-323.1 218.4,-328.8 221.2,-334.6 224.1,-340.4 226.9,-346.2 229.7,-352.1 232.6,-358.1 235.4,-364.1 238.3,-370.2 241.1,-376.4 243.9,-382.6 246.8,-388.8 249.6,-395.1 252.4,-401.5 255.3,-407.9 258.1,-414.4 260.9,-420.9 263.8,-427.5 266.6,-434.1 269.5,-440.8 272.3,-447.6 275.1,-454.4 278.0,-461.3 280.8,-468.2" fill="none" stroke="#8a99ad" stroke-width="1.5" opacity="0.8"/>
</g>
<text class="ts curve" x="12" y="-38" font-size="14"><tspan font-style="italic">y</tspan> = <tspan font-style="italic">f</tspan>(<tspan font-style="italic">x</tspan>)</text>
<g class="pts">
<line class="guide" x1="72" y1="-108" x2="72" y2="0"/><line class="guide" x1="72" y1="-108" x2="0" y2="-108"/>
<text x="72" y="16" font-size="13" font-family="system-ui,sans-serif" text-anchor="middle" fill="#f59e0b">a = 2</text>
<text x="-8" y="-104" font-size="13" font-family="system-ui,sans-serif" text-anchor="end" fill="#f59e0b">f(a) = 3</text>
<line class="guide" x1="216" y1="-324" x2="216" y2="0"/><line class="guide" x1="216" y1="-324" x2="0" y2="-324"/>
<text x="216" y="16" font-size="13" font-family="system-ui,sans-serif" text-anchor="middle" fill="#4cf26d">b = 6</text>
<text x="-8" y="-320" font-size="13" font-family="system-ui,sans-serif" text-anchor="end" fill="#4cf26d">f(b) = 9</text>
<text x="64" y="-116" font-size="15" text-anchor="end" fill="#f59e0b">(2, 3)</text>
<text x="208" y="-334" font-size="15" text-anchor="end" fill="#4cf26d">(6, 9)</text>
</g>
<polyline class="legx draw" points="72.0,-108.0 216.0,-108.0" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="146" stroke-dashoffset="146"/>
<polyline class="legy draw" points="216.0,-108.0 216.0,-324.0" fill="none" stroke="#4cf26d" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="218" stroke-dashoffset="218"/>
<text class="legl" x="144.0" y="-88" font-size="15" text-anchor="middle" fill="#f59e0b">Δ<tspan font-style="italic">x</tspan> = <tspan font-style="italic">b</tspan> − <tspan font-style="italic">a</tspan></text>
<text class="legl" x="226" y="-211.0" font-size="15" fill="#4cf26d">Δ<tspan font-style="italic">y</tspan> = <tspan font-style="italic">f</tspan>(<tspan font-style="italic">b</tspan>) − <tspan font-style="italic">f</tspan>(<tspan font-style="italic">a</tspan>)</text>
<text class="legn" x="144.0" y="-68" font-size="15" text-anchor="middle" fill="#f59e0b">Δ<tspan font-style="italic">x</tspan> = 4</text>
<text class="legn" x="226" y="-191.0" font-size="15" fill="#4cf26d">Δ<tspan font-style="italic">y</tspan> = 6</text>
<polyline class="sec draw" points="36.0,-54.0 270.0,-405.0" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="424" stroke-dashoffset="424"/>
<text class="cy secl" x="236" y="-372" font-size="15" text-anchor="end"><tspan font-style="italic">secant</tspan> <tspan font-style="italic">line</tspan>, <tspan font-style="italic">slope</tspan> 1.5</text>
<g class="pts">
<circle cx="72" cy="-108" r="5" fill="#f59e0b"/><circle cx="216" cy="-324" r="5" fill="#4cf26d"/>
</g>
</g>
</svg>

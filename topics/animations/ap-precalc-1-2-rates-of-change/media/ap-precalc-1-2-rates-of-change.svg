.s3b{opacity:0;animation:k_s3b 30s linear forwards}@keyframes k_s3b{0%{opacity:0}40.330%{opacity:0}41.667%{opacity:1}100%{opacity:1}}
.s4{opacity:0;animation:k_s4 30s linear forwards}@keyframes k_s4{0%{opacity:0}53.330%{opacity:0}54.667%{opacity:1}100%{opacity:1}}
.s4b{opacity:0;animation:k_s4b 30s linear forwards}@keyframes k_s4b{0%{opacity:0}56.663%{opacity:0}58.000%{opacity:1}100%{opacity:1}}
.s5{opacity:0;animation:k_s5 30s linear forwards}@keyframes k_s5{0%{opacity:0}83.330%{opacity:0}84.667%{opacity:1}100%{opacity:1}}
.axes{opacity:0;animation:k_axes 30s linear forwards}@keyframes k_axes{0%{opacity:0}5.997%{opacity:0}7.333%{opacity:1}100%{opacity:1}}
.curve{opacity:0;animation:k_curve 30s linear forwards}@keyframes k_curve{0%{opacity:0}16.663%{opacity:0}18.000%{opacity:1}100%{opacity:1}}
.pts{opacity:0;animation:k_pts 30s linear forwards}@keyframes k_pts{0%{opacity:0}19.997%{opacity:0}21.333%{opacity:1}100%{opacity:1}}
.legl{opacity:0;animation:k_legl 30s linear forwards}@keyframes k_legl{0%{opacity:0}40.330%{opacity:0}41.667%{opacity:1}100%{opacity:1}}
.legn{opacity:0;animation:k_legn 30s linear forwards}@keyframes k_legn{0%{opacity:0}56.663%{opacity:0}58.000%{opacity:1}100%{opacity:1}}
.secl{opacity:0;animation:k_secl 30s linear forwards}@keyframes k_secl{0%{opacity:0}78.330%{opacity:0}79.667%{opacity:1}100%{opacity:1}}
.legx.draw{animation:k_legx_draw 30s linear forwards}@keyframes k_legx_draw{0%,35.000%{stroke-dashoffset:146}37.667%,100%{stroke-dashoffset:0}}
.legy.draw{animation:k_legy_draw 30s linear forwards}@keyframes k_legy_draw{0%,37.667%{stroke-dashoffset:218}40.333%,100%{stroke-dashoffset:0}}
.sec.draw{animation:k_sec_draw 30s linear forwards}@keyframes k_sec_draw{0%,73.333%{stroke-dashoffset:424}78.333%,100%{stroke-dashoffset:0}}
</style>
<rect width="1000" height="640" class="bg"/>
<text class="tm title" x="50" y="44" font-size="24" font-weight="bold">1.2 <tspan font-style="italic">Rates</tspan> <tspan font-style="italic">of</tspan> <tspan font-style="italic">Change</tspan></text>
<text class="ts title" x="950" y="44" font-size="14" font-family="system-ui,sans-serif" text-anchor="end">AP Precalculus · Unit 1</text>
<line class="title axis" x1="50" y1="58" x2="950" y2="58"/>
<text class="ts defn" x="50" y="92" font-size="16" font-family="system-ui,sans-serif" fill="#f0f4f8">The average rate of change of f over [a, b] is the change in output</text>
<text class="ts defn" x="50" y="114" font-size="16" font-family="system-ui,sans-serif" fill="#f0f4f8">divided by the change in input.</text>
<text class="ts s1" x="50" y="152" font-size="14" font-family="system-ui,sans-serif">1. The formula:</text>
<text class="tm s1" x="60" y="199" font-size="20">average rate of change  =</text>
<text class="tm s1" x="369.359375" y="184" font-size="22" text-anchor="middle"><tspan fill="#4cf26d"><tspan font-style="italic">f</tspan>(<tspan font-style="italic">b</tspan>)</tspan> − <tspan fill="#f59e0b"><tspan font-style="italic">f</tspan>(<tspan font-style="italic">a</tspan>)</tspan></text>
<text class="tm s1" x="369.359375" y="214" font-size="22" text-anchor="middle"><tspan fill="#4cf26d"><tspan font-style="italic">b</tspan></tspan> − <tspan fill="#f59e0b"><tspan font-style="italic">a</tspan></tspan></text>
<line class="tm s1" x1="310" y1="192" x2="429" y2="192" stroke="#f0f4f8" stroke-width="1.6"/>
<text class="ts s2" x="50" y="252" font-size="14" font-family="system-ui,sans-serif">2. Two points on the graph of f:</text>
<text class="tm s2b" x="60" y="282" font-size="20" fill="#f59e0b"><tspan font-style="italic">a</tspan> = 2,   <tspan font-style="italic">f</tspan>(<tspan font-style="italic">a</tspan>) = 3   →   (2, 3)</text>
<text class="tm s2b" x="60" y="308" font-size="20" fill="#4cf26d"><tspan font-style="italic">b</tspan> = 6,   <tspan font-style="italic">f</tspan>(<tspan font-style="italic">b</tspan>) = 9   →   (6, 9)</text>
<text class="ts s3" x="50" y="348" font-size="14" font-family="system-ui,sans-serif">3. Rise over run — the change in y over the change in x:</text>
<text class="tm s3" x="60" y="393" font-size="20">average rate of change  =</text>
<text class="tm s3" x="332.96875" y="378" font-size="22" text-anchor="middle"><tspan fill="#4cf26d">Δ<tspan font-style="italic">y</tspan></tspan></text>
<text class="tm s3" x="332.96875" y="408" font-size="22" text-anchor="middle"><tspan fill="#f59e0b">Δ<tspan font-style="italic">x</tspan></tspan></text>
<line class="tm s3" x1="310" y1="386" x2="356" y2="386" stroke="#f0f4f8" stroke-width="1.6"/>
<text class="ts s3b" x="50" y="438" font-size="14" font-family="system-ui,sans-serif">rise Δy = f(b) − f(a) (green leg),  run Δx = b − a (orange leg)</text>
<text class="ts s4" x="50" y="474" font-size="14" font-family="system-ui,sans-serif">4. Put in the real numbers of the two points:</text>
<text class="tm s4" x="60" y="519" font-size="20">rate  =</text>
<text class="tm s4" x="164.8828125" y="504" font-size="22" text-anchor="middle"><tspan fill="#4cf26d">9</tspan> − <tspan fill="#f59e0b">3</tspan></text>
<text class="tm s4" x="164.8828125" y="534" font-size="22" text-anchor="middle"><tspan fill="#4cf26d">6</tspan> − <tspan fill="#f59e0b">2</tspan></text>
<line class="tm s4" x1="130" y1="512" x2="200" y2="512" stroke="#f0f4f8" stroke-width="1.6"/>
<text class="tm s4" x="209.765625" y="519" font-size="20">=</text>
<text class="tm s4" x="245.265625" y="504" font-size="22" text-anchor="middle"><tspan fill="#4cf26d">6</tspan></text>
<text class="tm s4" x="245.265625" y="534" font-size="22" text-anchor="middle"><tspan fill="#f59e0b">4</tspan></text>
<line class="tm s4" x1="232" y1="512" x2="259" y2="512" stroke="#f0f4f8" stroke-width="1.6"/>
<text class="cy s4b" x="270.765625" y="519" font-size="24">=  1.5</text>
<rect class="s5" x="50" y="552" width="470" height="62" rx="8" fill="none" stroke="#38bdf8" stroke-width="2"/>
<text class="cy s5" x="66" y="576" font-size="17" font-family="system-ui,sans-serif">Average rate of change of f over [2, 6]  =  1.5</text>
<text class="ts s5" x="66" y="600" font-size="13" font-family="system-ui,sans-serif">the slope of the secant line: y rises 1.5 units for each unit of x</text>
<defs><clipPath id="plot"><rect x="0" y="-468" width="324" height="468"/></clipPath></defs>
<g transform="translate(600,568)">
<g class="axes">
<line class="grid" x1="36" y1="-468" x2="36" y2="0"/>
<line class="grid" x1="72" y1="-468" x2="72" y2="0"/>
<line class="grid" x1="108" y1="-468" x2="108" y2="0"/>
<line class="grid" x1="144" y1="-468" x2="144" y2="0"/>
<line class="grid" x1="180" y1="-468" x2="180" y2="0"/>
<line class="grid" x1="216" y1="-468" x2="216" y2="0"/>
<line class="grid" x1="252" y1="-468" x2="252" y2="0"/>
<line class="grid" x1="288" y1="-468" x2="288" y2="0"/>
<line class="grid" x1="324" y1="-468" x2="324" y2="0"/>
<line class="grid" x1="0" y1="-36" x2="324" y2="-36"/>
<line class="grid" x1="0" y1="-72" x2="324" y2="-72"/>
<line class="grid" x1="0" y1="-108" x2="324" y2="-108"/>
<line class="grid" x1="0" y1="-144" x2="324" y2="-144"/>
<line class="grid" x1="0" y1="-180" x2="324" y2="-180"/>

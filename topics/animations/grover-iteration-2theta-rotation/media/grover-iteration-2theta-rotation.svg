<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" style="background-color: #121212; font-family: sans-serif;">
  <!-- Styles for the animation and elements -->
  <style>
    .axis { stroke: #ffffff; stroke-width: 2; }
    .dashed { stroke: #888888; stroke-width: 2; stroke-dasharray: 6,6; }
    .vector { stroke: #ff4d4d; stroke-width: 5; stroke-linecap: round; }
    .text { fill: #dddddd; font-size: 16px; }
    .title { fill: #ffffff; font-size: 22px; font-weight: bold; }
    .highlight { fill: #4da6ff; font-weight: bold; }
    .arc { fill: none; stroke: #4da6ff; stroke-width: 2; }
  </style>

  <!-- Definitions for arrowheads -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ff4d4d"/>
    </marker>
    <marker id="axis-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ffffff"/>
    </marker>
  </defs>

  <!-- Explanatory Text with Opacity Animations (Syncs with vector movement) -->
  <g transform="translate(30, 40)">
    <text class="title">Grover's Iteration: The 2θ Rotation</text>
    
    <!-- Text 1: Initial State -->
    <text y="40" class="text" opacity="1">
      <tspan class="highlight">1. Initial State:</tspan> The vector starts at angle θ.
      <animate attributeName="opacity" values="1; 1; 0; 0; 0; 0; 1" keyTimes="0; 0.2; 0.3; 0.5; 0.6; 0.9; 1" dur="10s" repeatCount="indefinite"/>
    </text>

    <!-- Text 2: Oracle Reflection -->
    <text y="40" class="text" opacity="0">
      <tspan class="highlight" fill="#ff9933">2. Oracle:</tspan> Reflects the state across the |bad⟩ axis to -θ.
      <animate attributeName="opacity" values="0; 0; 1; 1; 0; 0; 0" keyTimes="0; 0.2; 0.3; 0.5; 0.6; 0.9; 1" dur="10s" repeatCount="indefinite"/>
    </text>

    <!-- Text 3: Diffusion Reflection -->
    <text y="40" class="text" opacity="0">
      <tspan class="highlight" fill="#4cf26d">3. Diffusion:</tspan> Reflects state across the dashed initial line. Net rotation = 2θ!
      <animate attributeName="opacity" values="0; 0; 0; 0; 1; 1; 0" keyTimes="0; 0.2; 0.3; 0.5; 0.6; 0.9; 1" dur="10s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- Coordinate System (Moved further down to Y=450) -->
  <g transform="translate(150, 450)">
    
    <!-- X and Y Axes -->
    <line x1="0" y1="0" x2="400" y2="0" class="axis" marker-end="url(#axis-arrow)"/>
    <line x1="0" y1="0" x2="0" y2="-250" class="axis" marker-end="url(#axis-arrow)"/>
    
    <!-- Labels (Relative to the new group origin) -->
    <text x="410" y="5" class="text">|bad⟩ (x-axis)</text>
    <text x="-50" y="-265" class="text">|good⟩ (y-axis)</text>

    <!-- Initial State Line (Dashed, serves as reflection axis for Diffusion) -->
    <!-- Angle is -15 degrees. cos(-15)=0.965, sin(-15)=-0.258 -->
    <line x1="0" y1="0" x2="386" y2="-103" class="dashed"/>
    <text x="400" y="-110" class="text" fill="#888888">Initial State |ψ⟩ (θ)</text>

    <!-- Arc showing θ -->
    <path d="M 120 0 A 120 120 0 0 0 115.9 -31" class="arc" />
    <text x="130" y="-12" class="highlight">θ</text>

    <!-- The State Vector (Animated) -->
    <g>
      <line x1="0" y1="0" x2="250" y2="0" class="vector" marker-end="url(#arrow)">
        <!-- 
          Animation Timeline (10s total):
          0-2s: Initial State (-15 deg)
          2-3s: Rotate to Oracle Reflection (+15 deg)
          3-5s: Hold at Oracle Reflection
          5-6s: Rotate to Diffusion Reflection (-45 deg)
          6-9s: Hold at Diffusion Reflection
          9-10s: Return to Initial State
        -->
        <animateTransform 
          attributeName="transform" 
          type="rotate" 
          values="-15; -15; 15; 15; -45; -45; -15" 
          keyTimes="0; 0.2; 0.3; 0.5; 0.6; 0.9; 1" 
          dur="10s" 
          repeatCount="indefinite"
        />
      </line>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" style="background-color:#0b0c10;font-family:'Latin Modern Roman','CMU Serif','Times New Roman',Times,serif">
<title>Removable Discontinuity — The Hole in a Rational Function</title>
<style>
.bg{fill:#0b0c10}.tm{fill:#f0f4f8}.ts{fill:#8a99ad;font-family:system-ui,sans-serif}.cy{fill:#38bdf8}.ye{fill:#facc15}.rd{fill:#ff4d4d}.as{fill:#64748b;font-family:system-ui,sans-serif}
.axis{stroke:#475569;stroke-width:1.5}.grid{stroke:#1e293b;stroke-width:1;stroke-dasharray:4 4}.asy{stroke:#64748b;stroke-width:2;stroke-dasharray:8 6}.guide{stroke:#facc15;stroke-width:1;stroke-dasharray:4 4}
/* timeline: 24 s, plays ONCE (forwards) and holds on the final graph; opacity-only keyframes */

<title>Derivation of the Harmonic Sum Identity</title>
<style>
.bg{fill:#0b0c10}.tm{fill:#f0f4f8}.ts{fill:#8a99ad;font-family:system-ui,sans-serif}.cy{fill:#38bdf8}.gr{fill:#4cf26d}line.gr{stroke:#4cf26d}.ye{fill:#facc15;stroke:none}.rd{fill:#ff4d4d}
.axis{stroke:#475569;stroke-width:1.5}.callout{stroke-width:1.5;fill:none}line.ye{stroke:#facc15}
/* timeline: 26 s cycle, three pages (0-9 s, 9-17 s, 17-26 s); opacity-only keyframes */
.page1{opacity:0;animation:k_page1 26s linear infinite}@keyframes k_page1{1.538%{opacity:1}33.077%{opacity:1}34.615%{opacity:0}100%{opacity:0}}

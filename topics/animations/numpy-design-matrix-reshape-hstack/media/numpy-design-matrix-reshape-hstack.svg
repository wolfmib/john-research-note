<g class="s0_5"><text x="50" y="50" font-family="'Latin Modern Roman','CMU Serif','Times New Roman',Times,serif" font-size="24" fill="#f0f4f8" font-weight="bold">Design matrix rows [x, y, 1] with reshape and hstack</text></g>
<g class="s0_5"><rect x="50" y="80" width="480" height="120" rx="8" fill="#131924" stroke="#1e293b" stroke-width="2"/></g>
<g class="s4_0"><rect x="60" y="123" width="460" height="24" rx="4" fill="#1e3a5f" opacity="0.7"/></g>
<g class="s8_0"><rect x="273" y="151" width="208" height="24" rx="4" fill="#5a4a10" opacity="0.7"/></g>
<g class="s12_0"><rect x="155" y="151" width="90" height="24" rx="4" fill="#1e4d2b" opacity="0.7"/></g>
<g class="s0_5"><text x="65" y="112" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" xml:space="preserve"><tspan fill="#c678dd">def </tspan><tspan fill="#61afef">design_matrix</tspan><tspan fill="#abb2bf">(pts_xy):</tspan></text></g>
<g class="s0_5"><text x="65" y="140" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" xml:space="preserve"><tspan fill="#f0f4f8">    P = np.</tspan><tspan fill="#61afef">asarray</tspan><tspan fill="#abb2bf">(pts_xy).</tspan><tspan fill="#61afef">reshape</tspan><tspan fill="#abb2bf">(</tspan><tspan fill="#d19a66">-1</tspan><tspan fill="#abb2bf">, </tspan><tspan fill="#d19a66">2</tspan><tspan fill="#abb2bf">)</tspan></text></g>
<g class="s0_5"><text x="65" y="168" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" xml:space="preserve"><tspan fill="#f0f4f8">    </tspan><tspan fill="#c678dd">return</tspan><tspan fill="#f0f4f8"> np.</tspan><tspan fill="#61afef">hstack</tspan><tspan fill="#abb2bf">([P, np.</tspan><tspan fill="#61afef">ones</tspan><tspan fill="#abb2bf">((P.shape[</tspan><tspan fill="#d19a66">0</tspan><tspan fill="#abb2bf">], </tspan><tspan fill="#d19a66">1</tspan><tspan fill="#abb2bf">))])</tspan></text></g>
<g class="s4_0"><rect x="50" y="230" width="480" height="80" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
<text x="66" y="254" font-family="system-ui,sans-serif" font-size="16" font-weight="bold" fill="#38bdf8">1.  reshape(-1, 2)</text>
<text x="66" y="278" font-family="system-ui,sans-serif" font-size="14" fill="#f0f4f8">Force exactly 2 columns: one row per point, [x, y].</text>
<text x="66" y="298" font-family="system-ui,sans-serif" font-size="14" fill="#f0f4f8">-1 lets NumPy infer the row count: 8 numbers / 2 = 4 rows.</text>
</g>
<g class="s8_0"><rect x="50" y="330" width="480" height="80" rx="6" fill="#0f172a" stroke="#facc15" stroke-width="1.5"/>
<text x="66" y="354" font-family="system-ui,sans-serif" font-size="16" font-weight="bold" fill="#facc15">2.  The constant column</text>
<text x="66" y="378" font-family="system-ui,sans-serif" font-size="14" fill="#f0f4f8">P.shape[0] = 4 points, so np.ones((4, 1)) is a 4 × 1</text>
<text x="66" y="398" font-family="system-ui,sans-serif" font-size="14" fill="#f0f4f8">column of ones: the intercept term of the linear model.</text>
</g>
<g class="s12_0"><rect x="50" y="430" width="480" height="116" rx="6" fill="#0f172a" stroke="#4cf26d" stroke-width="1.5"/>
<text x="66" y="454" font-family="system-ui,sans-serif" font-size="16" font-weight="bold" fill="#4cf26d">3.  Horizontal stack</text>
<text x="66" y="478" font-family="system-ui,sans-serif" font-size="14" fill="#f0f4f8">np.hstack glues the blocks side by side (column-wise):</text>
<text x="66" y="498" font-family="system-ui,sans-serif" font-size="14" fill="#f0f4f8">(4, 2)  ⊕  (4, 1)  →  (4, 3)</text>
</g>
<g class="s16_0"><rect x="66" y="510" width="260" height="26" rx="4" fill="#131924" stroke="#4cf26d" stroke-width="1"/><text x="76" y="528" font-family="system-ui,sans-serif" font-size="14" font-weight="bold" fill="#f0f4f8">Result: <tspan fill="#38bdf8">[x, y]</tspan>  →  <tspan fill="#4cf26d">[x, y, 1]</tspan></text></g>
<g class="s18_0"><text x="50" y="574" font-family="system-ui,sans-serif" font-size="14" fill="#8a99ad">Convention: textbooks often write the row as [1, x, y].</text></g>
<g class="s18_0"><text x="50" y="594" font-family="system-ui,sans-serif" font-size="14" fill="#8a99ad">Same design matrix, the constant column just moves; fits are unchanged.</text></g>
<g transform="translate(600, 100)">

<g class="s17_0"><rect x="40" y="410" width="450" height="205" rx="6" fill="#131924" stroke="#c084fc" stroke-width="1.5"/>
<text x="56" y="432" font-family="system-ui,sans-serif" font-size="14" fill="#8a99ad">Centroid = mean over the marker rows (axis = 0):</text>
<text font-family="'Latin Modern Roman','CMU Serif','Times New Roman',Times,serif" font-size="22" fill="#f0f4f8"><tspan x="70" y="475"><tspan font-style="italic">c</tspan><tspan baseline-shift="sub" font-size="14">M</tspan> =</tspan></text>
<text x="142" y="462" font-family="'Latin Modern Roman','CMU Serif','Times New Roman',Times,serif" font-size="20" fill="#f0f4f8" text-anchor="middle">1</text>
<text x="142" y="488" font-family="'Latin Modern Roman','CMU Serif','Times New Roman',Times,serif" font-size="20" fill="#f0f4f8" text-anchor="middle">4</text>
<line x1="130" y1="468" x2="154" y2="468" stroke="#f0f4f8" stroke-width="1.6"/>
<text x="182" y="478" font-family="'Latin Modern Roman','CMU Serif','Times New Roman',Times,serif" font-size="30" fill="#f0f4f8" text-anchor="middle">Σ</text>
<text x="182" y="452" font-family="'Latin Modern Roman','CMU Serif','Times New Roman',Times,serif" font-size="12" fill="#f0f4f8" text-anchor="middle">4</text>
<text x="182" y="496" font-family="'Latin Modern Roman','CMU Serif','Times New Roman',Times,serif" font-size="12" fill="#f0f4f8" text-anchor="middle"><tspan font-style="italic">i</tspan> = 1</text>
<text x="204" y="475" font-family="'Latin Modern Roman','CMU Serif','Times New Roman',Times,serif" font-size="22" fill="#f0f4f8"><tspan font-style="italic">m</tspan><tspan baseline-shift="sub" font-size="14" font-style="italic">i</tspan></text>
<text x="56" y="514" font-family="system-ui,sans-serif" font-size="14" fill="#8a99ad">axis = 0 collapses the 4 rows, one column at a time:</text>
<text x="70" y="538" font-family="system-ui,sans-serif" font-size="16" fill="#f0f4f8">x :  (120 + 510 + 300 + 150) / 4  =  <tspan fill="#d19a66" font-weight="bold">270</tspan></text>
<text x="70" y="561" font-family="system-ui,sans-serif" font-size="16" fill="#f0f4f8">y :  (110 + 130 + 400 + 380) / 4  =  <tspan fill="#d19a66" font-weight="bold">255</tspan></text>
</g>

<g class="s0_5"><text x="55" y="110" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" xml:space="preserve"><tspan fill="#f0f4f8">DEVICE_W, DEVICE_H = </tspan><tspan fill="#d19a66">640</tspan><tspan fill="#f0f4f8">, </tspan><tspan fill="#d19a66">480</tspan></text></g>
<g class="s3_0"><text x="55" y="145" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" xml:space="preserve"><tspan fill="#f0f4f8">markers = </tspan><tspan fill="#61afef">np.array</tspan><tspan fill="#abb2bf">([</tspan></text></g>

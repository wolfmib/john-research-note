<g class="s0_5"><text x="40" y="50" font-family="'Latin Modern Roman','CMU Serif','Times New Roman',Times,serif" font-size="24" font-weight="bold" fill="#f0f4f8">NumPy to geometry: a (4, 2) marker array and its centroid</text></g>

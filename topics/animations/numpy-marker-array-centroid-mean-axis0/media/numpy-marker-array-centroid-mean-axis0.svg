<g class="s7_0"><text x="55" y="220" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" xml:space="preserve"><tspan fill="#abb2bf">    [</tspan><tspan fill="#d19a66">300.0</tspan><tspan fill="#f0f4f8">, </tspan><tspan fill="#d19a66">400.0</tspan><tspan fill="#abb2bf">],   </tspan><tspan fill="#5c6370"># M3  bottom-centre</tspan></text></g>
<g class="s9_0"><text x="55" y="245" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" xml:space="preserve"><tspan fill="#abb2bf">    [</tspan><tspan fill="#d19a66">150.0</tspan><tspan fill="#f0f4f8">, </tspan><tspan fill="#d19a66">380.0</tspan><tspan fill="#abb2bf">],   </tspan><tspan fill="#5c6370"># M4  bottom-left</tspan></text></g>
<g class="s9_0"><text x="55" y="270" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" xml:space="preserve"><tspan fill="#abb2bf">], dtype=</tspan><tspan fill="#61afef">np.float64</tspan><tspan fill="#abb2bf">)</tspan></text></g>
<g class="s15_0"><text x="55" y="310" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" xml:space="preserve"><tspan fill="#f0f4f8">c_M = markers.</tspan><tspan fill="#61afef">mean</tspan><tspan fill="#abb2bf">(axis=</tspan><tspan fill="#d19a66">0</tspan><tspan fill="#abb2bf">)</tspan><tspan fill="#5c6370">   # (4, 2) → (2,)</tspan></text></g>

<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" font-family="Helvetica, Arial, sans-serif">
<rect width="100%" height="100%" fill="white"/>
<text x="450" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#111">PCA — w&#8321; follows y = a&#183;x, w&#8322; stands perpendicular</text>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#333"/></marker>
<marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#dc2626"/></marker>
<marker id="arrGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#059669"/></marker>
</defs>
<!-- axes -->
<line x1="50" y1="350" x2="380" y2="350" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="70" y1="370" x2="70" y2="45" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="382" y="368" font-size="14" fill="#333">x</text>
<text x="52" y="42" font-size="14" fill="#333">y</text>
<!-- y = ax dashed -->
<line x1="84" y1="336" x2="350" y2="70" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="318" y="66" font-size="13" fill="#6b7280" font-style="italic">y = a&#183;x</text>
<!-- faint cloud -->
<g fill="#93c5fd">
<circle cx="126" cy="301" r="3.5"/><circle cx="168" cy="245" r="3.5"/><circle cx="196" cy="238" r="3.5"/>
<circle cx="245" cy="161" r="3.5"/><circle cx="273" cy="133" r="3.5"/><circle cx="315" cy="112" r="3.5"/>
<circle cx="329" cy="77" r="3.5"/><circle cx="147" cy="259" r="3.5"/><circle cx="231" cy="210" r="3.5"/>
<circle cx="287" cy="105" r="3.5"/>
</g>
<!-- John's four sample points -->
<g fill="#2563eb">
<circle cx="140" cy="217" r="5"/><circle cx="217" cy="196" r="5"/><circle cx="213" cy="119" r="5"/><circle cx="301" cy="140" r="5"/>
</g>
<g font-size="12" fill="#1e40af">
<text x="118" y="212">x&#8321;</text><text x="224" y="212">x&#8322;</text><text x="192" y="114">x&#8323;</text><text x="308" y="136">x&#8324;</text>
</g>
<!-- principal directions from the mean -->
<line x1="218" y1="168" x2="282" y2="104" stroke="#dc2626" stroke-width="3" marker-end="url(#arrRed)"/>
<line x1="218" y1="168" x2="181" y2="131" stroke="#059669" stroke-width="3" marker-end="url(#arrGreen)"/>
<text x="288" y="98" font-size="15" font-weight="bold" fill="#dc2626">w&#8321;</text>
<text x="160" y="124" font-size="15" font-weight="bold" fill="#059669">w&#8322;</text>
<circle cx="218" cy="168" r="3" fill="#111"/>
<text x="60" y="400" font-size="13" fill="#374151">w&#8321; = direction of maximum variance &#183; w&#8322; &#8869; w&#8321; catches what is left</text>
<!-- right panel: variance bars -->
<text x="650" y="70" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">variance seen along each direction</text>
<line x1="480" y1="330" x2="820" y2="330" stroke="#333" stroke-width="1.5"/>
<rect x="530" y="143" width="80" height="187" fill="#dc2626" opacity="0.85"/>
<rect x="680" y="297" width="80" height="33" fill="#059669" opacity="0.85"/>
<text x="570" y="133" text-anchor="middle" font-size="14" fill="#111">Var(w&#8321;&#7488;X) &#8776; 85%</text>
<text x="720" y="287" text-anchor="middle" font-size="14" fill="#111">Var(w&#8322;&#7488;X) &#8776; 15%</text>
<text x="570" y="352" text-anchor="middle" font-size="13" fill="#374151">PC1</text>
<text x="720" y="352" text-anchor="middle" font-size="13" fill="#374151">PC2</text>
<text x="650" y="390" text-anchor="middle" font-size="13" fill="#374151">w&#8322; carries almost nothing &#8594; the 2D cloud compresses to 1D</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="860" height="470" viewBox="0 0 860 470" font-family="Helvetica, Arial, sans-serif">
<rect width="100%" height="100%" fill="white"/>
<text x="430" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#111">SVM — one plane, the widest possible corridor</text>
<defs>
<marker id="arr6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#374151"/></marker>
</defs>
<!-- margin planes (dashed) -->
<polygon points="200,245 620,245 740,165 320,165" fill="none" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="7 6"/>
<polygon points="200,355 620,355 740,275 320,275" fill="none" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="7 6"/>
<!-- separating plane -->
<polygon points="200,300 620,300 740,220 320,220" fill="#3b82f6" opacity="0.16" stroke="#2563eb" stroke-width="2"/>
<line x1="305" y1="280" x2="725" y2="280" stroke="#60a5fa" stroke-width="0.8" opacity="0.6" transform="translate(-45,0)"/>
<line x1="240" y1="273" x2="660" y2="273" stroke="#60a5fa" stroke-width="0.8" opacity="0.5"/>
<line x1="280" y1="247" x2="700" y2="247" stroke="#60a5fa" stroke-width="0.8" opacity="0.5"/>
<text x="415" y="268" font-size="14.5" font-weight="bold" fill="#1d4ed8">w&#7488;x + b = 0</text>
<!-- malignant above -->
<g stroke="#dc2626" stroke-width="2.6">
<path d="M344 114 l13 13 m0 -13 l-13 13"/><path d="M424 89 l13 13 m0 -13 l-13 13"/>
<path d="M494 129 l13 13 m0 -13 l-13 13"/><path d="M554 99 l13 13 m0 -13 l-13 13"/>
<path d="M294 144 l13 13 m0 -13 l-13 13"/>
</g>
<!-- support vectors on upper margin -->
<path d="M424 198 l13 13 m0 -13 l-13 13" stroke="#dc2626" stroke-width="2.6"/>
<circle cx="430.5" cy="204.5" r="14" fill="none" stroke="#f59e0b" stroke-width="2.2"/>
<path d="M604 183 l13 13 m0 -13 l-13 13" stroke="#dc2626" stroke-width="2.6"/>
<circle cx="610.5" cy="189.5" r="14" fill="none" stroke="#f59e0b" stroke-width="2.2"/>
<!-- benign below -->
<g fill="#2563eb">
<circle cx="330" cy="400" r="7"/><circle cx="420" cy="428" r="7"/><circle cx="520" cy="410" r="7"/>
<circle cx="606" cy="384" r="7"/><circle cx="282" cy="372" r="7"/>
</g>
<!-- support vector on lower margin -->
<circle cx="468" cy="322" r="7" fill="#2563eb"/>
<circle cx="468" cy="322" r="14" fill="none" stroke="#f59e0b" stroke-width="2.2"/>
<!-- margin double arrow -->
<line x1="745" y1="212" x2="745" y2="322" stroke="#374151" stroke-width="1.6" marker-start="url(#arr6)" marker-end="url(#arr6)"/>
<text x="757" y="262" font-size="14" fill="#111">margin</text>
<text x="757" y="282" font-size="14" fill="#111">= 2 / &#8214;w&#8214;</text>
<!-- axis triad -->
<g stroke="#6b7280" stroke-width="1.4">
<line x1="95" y1="440" x2="155" y2="440" marker-end="url(#arr6)"/>
<line x1="95" y1="440" x2="95" y2="385" marker-end="url(#arr6)"/>
<line x1="95" y1="440" x2="135" y2="410" marker-end="url(#arr6)"/>
</g>
<text x="160" y="445" font-size="12" fill="#6b7280">x&#8321;</text>
<text x="88" y="377" font-size="12" fill="#6b7280">x&#8323;</text>
<text x="140" y="405" font-size="12" fill="#6b7280">x&#8322;</text>
<text x="430" y="463" text-anchor="middle" font-size="13" fill="#374151">only the &#9678;-circled points (support vectors) hold the corridor &#8212; every other point could vanish and the plane would not move</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" font-family="Helvetica, Arial, sans-serif">
<rect width="100%" height="100%" fill="white"/>
<text x="480" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#111">RBF-SVM — lift the data until a flat plane is enough</text>
<defs>
<marker id="arr7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4f46e5"/></marker>
</defs>
<!-- left: input space -->
<text x="190" y="66" text-anchor="middle" font-size="14" font-weight="bold" fill="#374151">input space (2D)</text>
<g stroke="#dc2626" stroke-width="2.4">
<path d="M279 234 l12 12 m0 -12 l-12 12"/><path d="M251 301 l12 12 m0 -12 l-12 12"/>
<path d="M184 329 l12 12 m0 -12 l-12 12"/><path d="M117 301 l12 12 m0 -12 l-12 12"/>
<path d="M89 234 l12 12 m0 -12 l-12 12"/><path d="M117 167 l12 12 m0 -12 l-12 12"/>
<path d="M184 139 l12 12 m0 -12 l-12 12"/><path d="M251 167 l12 12 m0 -12 l-12 12"/>
</g>
<g fill="#2563eb">
<circle cx="180" cy="230" r="6"/><circle cx="205" cy="250" r="6"/><circle cx="170" cy="255" r="6"/>
<circle cx="195" cy="215" r="6"/><circle cx="215" cy="232" r="6"/><circle cx="185" cy="265" r="6"/>
</g>
<circle cx="190" cy="240" r="72" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="7 6"/>
<text x="190" y="392" text-anchor="middle" font-size="13" fill="#374151">no straight line works &#8212;</text>
<text x="190" y="411" text-anchor="middle" font-size="13" fill="#374151">but a <tspan fill="#059669" font-weight="bold">circle</tspan> does</text>
<!-- middle: kernel arrow -->
<line x1="345" y1="240" x2="440" y2="240" stroke="#4f46e5" stroke-width="2.2" marker-end="url(#arr7)"/>
<text x="393" y="222" text-anchor="middle" font-size="14" font-weight="bold" fill="#4f46e5">&#966;(x) lift</text>
<text x="393" y="270" text-anchor="middle" font-size="13" fill="#4f46e5">K(x&#7522;,x&#11388;) = e</text>
<text x="393" y="288" text-anchor="middle" font-size="11.5" fill="#4f46e5">&#8722;&#947;&#8214;x&#7522;&#8722;x&#11388;&#8214;&#178;</text>
<!-- right: feature space -->
<text x="710" y="66" text-anchor="middle" font-size="14" font-weight="bold" fill="#374151">feature space (lifted)</text>
<!-- base plane -->
<polygon points="500,380 840,380 920,300 580,300" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/>
<!-- separating plane -->
<polygon points="500,235 840,235 920,155 580,155" fill="#3b82f6" opacity="0.16" stroke="#2563eb" stroke-width="2"/>
<text x="530" y="192" font-size="13" font-weight="bold" fill="#1d4ed8">flat plane separates</text>
<!-- lift guides -->
<g stroke="#c7d2fe" stroke-width="1.2" stroke-dasharray="4 4">
<line x1="682" y1="128" x2="682" y2="342"/><line x1="722" y1="108" x2="722" y2="330"/><line x1="752" y1="132" x2="752" y2="348"/>
</g>
<!-- lifted centre points (blue, above plane) -->
<g fill="#2563eb">
<circle cx="682" cy="122" r="7"/><circle cx="722" cy="102" r="7"/><circle cx="752" cy="126" r="7"/><circle cx="705" cy="142" r="7"/>
</g>
<!-- ring points stay low (red, below plane) -->
<g stroke="#dc2626" stroke-width="2.4">
<path d="M540 330 l12 12 m0 -12 l-12 12"/><path d="M634 346 l12 12 m0 -12 l-12 12"/>
<path d="M794 334 l12 12 m0 -12 l-12 12"/><path d="M868 288 l12 12 m0 -12 l-12 12"/>
<path d="M590 292 l12 12 m0 -12 l-12 12"/><path d="M716 352 l12 12 m0 -12 l-12 12"/>
</g>
<text x="710" y="430" text-anchor="middle" font-size="13" fill="#374151">a flat cut up here = the curved circle back in 2D</text>
<text x="480" y="460" text-anchor="middle" font-size="12.5" fill="#6b7280">&#947; sets locality (how fast similarity dies with distance) &#183; C sets the penalty for margin violations</text>
</svg>

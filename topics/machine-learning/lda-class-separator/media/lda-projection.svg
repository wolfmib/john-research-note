<text x="700" y="97" text-anchor="middle" font-size="14" fill="#111">J(w) = w&#7488;S<tspan dy="4" font-size="10">B</tspan><tspan dy="-4">w</tspan> / w&#7488;S<tspan dy="4" font-size="10">W</tspan><tspan dy="-4">w</tspan></text>
<text x="700" y="120" text-anchor="middle" font-size="12" fill="#6b7280">push classes apart, squeeze each class</text>

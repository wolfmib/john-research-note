<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" font-family="Helvetica, Arial, sans-serif">
<rect width="100%" height="100%" fill="white"/>
<text x="450" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#111">Random Forest — the tree army votes</text>
<defs>
<marker id="arr4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b7280"/></marker>
</defs>
<!-- three mini trees -->
<g>
<rect x="105" y="70" width="110" height="34" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.8"/>
<text x="160" y="92" text-anchor="middle" font-size="13" fill="#4f46e5" font-weight="bold">&#916;T &gt; 1.2 ?</text>
<line x1="135" y1="104" x2="112" y2="140" stroke="#6b7280" stroke-width="1.3"/>
<line x1="185" y1="104" x2="208" y2="140" stroke="#6b7280" stroke-width="1.3"/>
<rect x="80" y="142" width="64" height="28" rx="7" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="112" y="161" text-anchor="middle" font-size="12" fill="#b91c1c">M</text>
<rect x="176" y="142" width="64" height="28" rx="7" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<text x="208" y="161" text-anchor="middle" font-size="12" fill="#047857">B</text>
<text x="160" y="200" text-anchor="middle" font-size="13" fill="#111">T&#8321;(x) &#8594; <tspan font-weight="bold" fill="#b91c1c">M</tspan></text>
<text x="160" y="220" text-anchor="middle" font-size="11.5" fill="#6b7280">bootstrap sample 1</text>
</g>
<g>
<rect x="395" y="70" width="110" height="34" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.8"/>
<text x="450" y="92" text-anchor="middle" font-size="13" fill="#4f46e5" font-weight="bold">RT &gt; 5 ?</text>
<line x1="425" y1="104" x2="402" y2="140" stroke="#6b7280" stroke-width="1.3"/>
<line x1="475" y1="104" x2="498" y2="140" stroke="#6b7280" stroke-width="1.3"/>
<rect x="370" y="142" width="64" height="28" rx="7" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<text x="402" y="161" text-anchor="middle" font-size="12" fill="#047857">B</text>
<rect x="466" y="142" width="64" height="28" rx="7" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="498" y="161" text-anchor="middle" font-size="12" fill="#b91c1c">M</text>
<text x="450" y="200" text-anchor="middle" font-size="13" fill="#111">T&#8322;(x) &#8594; <tspan font-weight="bold" fill="#047857">B</tspan></text>
<text x="450" y="220" text-anchor="middle" font-size="11.5" fill="#6b7280">bootstrap sample 2</text>
</g>
<g>
<rect x="685" y="70" width="110" height="34" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.8"/>
<text x="740" y="92" text-anchor="middle" font-size="13" fill="#4f46e5" font-weight="bold">texture ?</text>
<line x1="715" y1="104" x2="692" y2="140" stroke="#6b7280" stroke-width="1.3"/>
<line x1="765" y1="104" x2="788" y2="140" stroke="#6b7280" stroke-width="1.3"/>
<rect x="660" y="142" width="64" height="28" rx="7" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="692" y="161" text-anchor="middle" font-size="12" fill="#b91c1c">M</text>
<rect x="756" y="142" width="64" height="28" rx="7" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<text x="788" y="161" text-anchor="middle" font-size="12" fill="#047857">B</text>
<text x="740" y="200" text-anchor="middle" font-size="13" fill="#111">T&#8323;(x) &#8594; <tspan font-weight="bold" fill="#b91c1c">M</tspan></text>
<text x="740" y="220" text-anchor="middle" font-size="11.5" fill="#6b7280">bootstrap sample 3</text>
</g>
<text x="450" y="250" text-anchor="middle" font-size="12.5" fill="#6b7280">each tree: different bootstrap sample + random feature subset &#8212; deliberately imperfect, deliberately different</text>
<!-- votes to ballot box -->
<line x1="160" y1="258" x2="400" y2="310" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arr4)"/>
<line x1="450" y1="258" x2="450" y2="305" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arr4)"/>
<line x1="740" y1="258" x2="500" y2="310" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arr4)"/>
<rect x="355" y="312" width="190" height="48" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
<text x="450" y="333" text-anchor="middle" font-size="13.5" fill="#92400e">ballot box: M &#183; B &#183; M</text>
<text x="450" y="352" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#92400e">&#375; = mode{T&#8321;,T&#8322;,T&#8323;} = M (2 of 3)</text>
<text x="450" y="405" text-anchor="middle" font-size="14" font-style="italic" fill="#374151">&#8220;One tree may be stupid; the forest is harder to fool.&#8221;</text>
</svg>

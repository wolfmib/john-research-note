<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460" font-family="Helvetica, Arial, sans-serif">
<rect width="100%" height="100%" fill="white"/>
<text x="380" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#111">Decision Tree — reality split by yes/no questions</text>
<defs>
<marker id="arr3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b7280"/></marker>
</defs>
<!-- root -->
<rect x="280" y="60" width="200" height="46" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
<text x="380" y="88" text-anchor="middle" font-size="15" font-weight="bold" fill="#4f46e5">&#916;T &gt; 1.2 &#176;C ?</text>
<!-- branches from root -->
<line x1="330" y1="106" x2="235" y2="170" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arr3)"/>
<line x1="430" y1="106" x2="525" y2="170" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arr3)"/>
<text x="258" y="134" font-size="13" fill="#059669" font-weight="bold">yes</text>
<text x="490" y="134" font-size="13" fill="#dc2626" font-weight="bold">no</text>
<!-- second question -->
<rect x="130" y="175" width="190" height="46" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
<text x="225" y="203" text-anchor="middle" font-size="15" font-weight="bold" fill="#4f46e5">RT &gt; 5 s ?</text>
<!-- benign leaf right -->
<rect x="460" y="175" width="150" height="46" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
<text x="535" y="203" text-anchor="middle" font-size="15" font-weight="bold" fill="#047857">benign</text>
<!-- branches from second -->
<line x1="180" y1="221" x2="130" y2="285" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arr3)"/>
<line x1="270" y1="221" x2="320" y2="285" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arr3)"/>
<text x="130" y="250" font-size="13" fill="#059669" font-weight="bold">yes</text>
<text x="305" y="250" font-size="13" fill="#dc2626" font-weight="bold">no</text>
<!-- leaves -->
<rect x="45" y="290" width="170" height="46" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<text x="130" y="318" text-anchor="middle" font-size="15" font-weight="bold" fill="#b91c1c">suspicious &#8594; refer</text>
<rect x="255" y="290" width="130" height="46" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
<text x="320" y="318" text-anchor="middle" font-size="15" font-weight="bold" fill="#047857">benign</text>
<!-- feature glossary -->
<text x="620" y="300" text-anchor="middle" font-size="12.5" fill="#374151">&#916;T = lesion vs surround temperature</text>
<text x="620" y="318" text-anchor="middle" font-size="12.5" fill="#374151">RT = thermal recovery time</text>
<!-- entropy note -->
<line x1="60" y1="365" x2="700" y2="365" stroke="#e5e7eb"/>
<text x="380" y="392" text-anchor="middle" font-size="13.5" fill="#374151">Each question is chosen to maximise information gain:</text>
<text x="380" y="416" text-anchor="middle" font-size="14" fill="#111" font-weight="bold">IG = H(parent) &#8722; H(children),&#160;&#160; H = &#8722;&#931;&#8342; p&#8342; log&#8322; p&#8342;</text>
<text x="380" y="440" text-anchor="middle" font-size="12.5" fill="#6b7280">the split that leaves the purest child groups wins</text>
</svg>

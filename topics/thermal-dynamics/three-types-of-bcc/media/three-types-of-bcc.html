<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Three Types of BCC</title>
<style>
    html, body { margin: 0; padding: 0; background: #07090d; overflow: hidden; height: 100%;
        font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    #stage { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; transform-origin: 0 0; overflow: hidden; color: #ECECEC;
        background: radial-gradient(ellipse at 50% 45%, #1c2230 0%, #11151d 55%, #07090d 100%); }
    svg text { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
</style>
</head>
<body>
<div id="stage">
<svg id="svg" width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="9"/></filter>
        <marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#5AA9DA"/></marker>
    </defs>
    <text x="48" y="30" font-size="14" fill="#9AA0A6" letter-spacing=".3">Therma thermal dynamics · Three types of BCC</text>
    <text x="48" y="74" font-size="30" font-weight="600" fill="#ECECEC">Three types of BCC</text>
    <g id="subs" font-size="19" fill="#9AA0A6"></g>
    <g id="pills"></g>
    <g id="central"></g>
    <g id="compare" opacity="0">
        <line x1="20" y1="358" x2="1260" y2="358" stroke="#ECECEC" stroke-width="2" stroke-dasharray="7 7" stroke-opacity=".35"/>
        <g id="panels"></g>
    </g>
</svg>
</div>

<script>
    const NS = 'http://www.w3.org/2000/svg';
    const TOTAL = 33.5, FADE = 0.6, SURF = 114, BOT = 505;
    const clamp01 = v => Math.max(0, Math.min(1, v));
    const ease = p => p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
    const seg = (t, a, d) => ease(clamp01((t - a) / d));
    const win = (t, a, b, f = FADE) => Math.min(seg(t, a, f), 1 - seg(t, b - f, f));
    const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag);
        for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
    const $ = id => document.getElementById(id);
    const O = (e, v) => (typeof e === 'string' ? $(e) : e).setAttribute('opacity', v);
    const poly = pts => pts.map((p, i) => (i ? 'L ' : 'M ') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');

    // ---- shapes, in the coordinates of the three concept images (skin surface at y = 114, depth goes down) ----
    // superficial: flat ribbon below the surface; nodular: round mass, the largest part above the surface;
    // infiltrative: branching strands below + a low raised top (Siskou 2023: depth with and without the exophytic part).
    const TYPES = {
        sup: { name: 'Superficial', col: '#5AA9DA', fill: '#22415a', bottom: 253, bx: 572 },
        nod: { name: 'Nodular', col: '#45C2A9', fill: '#1d4a45', bottom: 463, bx: 500 },
        inf: { name: 'Infiltrative', col: '#E08A4A', fill: '#4b3324', bottom: 435, bx: 528 } };
    const ORDER = ['sup', 'nod', 'inf'];
    const SUP_PATH = 'M 197 114 C 200 106 215 105 240 105 L 745 105 C 772 105 788 106 788 114 C 792 150 775 200 745 207 C 720 215 700 205 650 208 C 610 213 600 255 572 253 C 540 251 520 222 480 220 C 440 218 430 240 400 236 C 370 232 360 205 330 205 C 300 205 290 215 262 212 C 220 209 200 160 197 114 Z';
    const INF_PATHS = ['M 262 114 L 378 114 C 380 150 395 175 415 200 C 440 230 460 270 458 300 C 457 330 440 345 430 338 C 420 330 420 300 415 290 C 400 250 385 230 365 217 C 340 245 310 265 275 285 C 255 298 230 305 226 290 C 225 270 255 245 275 222 C 295 195 292 180 285 165 C 275 150 265 135 262 114 Z',
        'M 482 114 L 593 114 C 588 140 585 190 625 225 C 660 255 720 265 730 300 C 738 330 735 355 722 358 C 710 360 705 340 700 330 C 680 295 640 285 605 280 C 600 300 600 320 607 345 C 612 375 598 390 580 410 C 560 430 540 440 528 435 C 515 425 535 395 548 378 C 560 360 555 345 548 320 C 540 295 545 270 543 245 C 540 220 520 210 505 190 C 485 165 480 140 482 114 Z'];
    const INF_ISLAND = 'M 352 390 C 350 375 380 358 397 362 C 410 366 405 395 385 401 C 365 406 352 398 352 390 Z';
    // nodular: ellipse, bottom at 463, top 222 above the surface
    // widest at the skin line: a dome above (height 222) and a rounder body below (depth 349)
    const NOD = { cx: 500, a: 215, up: 222, dn: 463 - SURF };
    const nodPts = r => { const P = []; for (let i = 0; i < 120; i++) { const th = i / 120 * 2 * Math.PI, sn = Math.sin(th);
        const x = NOD.cx + NOD.a * Math.cos(th) * (sn > 0 ? 1 + .24 * sn * (1 - sn) : 1), y = SURF + (sn > 0 ? NOD.dn * Math.pow(sn, .8) : NOD.up * sn);
        P.push([NOD.cx + (x - NOD.cx) * r, SURF + (y - SURF) * r]); } return P; };
    const nodRise = (x, r) => { if (r <= 0) return 0; const u = (x - NOD.cx) / (NOD.a * r); if (Math.abs(u) >= 1) return 0;
        return r * NOD.up * Math.sqrt(1 - u * u); };
    // infiltrative: low raised top over the strand roots
    // superficial: a very slight rise over the plaque
    const supRise = (x, r) => r * 9 * clamp01((x - 197) / 30) * clamp01((788 - x) / 30);
    const CAP = { x0: 236, x1: 620, H: 80 };
    const infRise = (x, r) => { if (r <= 0 || x <= CAP.x0 || x >= CAP.x1) return 0; const u = (x - CAP.x0) / (CAP.x1 - CAP.x0);
        return r * CAP.H * Math.pow(Math.sin(Math.PI * u), .7) * (1 + .12 * Math.sin(u * Math.PI * 5)); };

    // ---- one drawing context: a tissue block with the three lesions (used in the centre and in each panel) ----
    let uid = 0;
    function makeContext(parent, x0, x1, sw, withLabels) {
        const id = 'k' + (uid++), defs = $('svg').querySelector('defs');
        const cp = el('clipPath', { id: id + 'c' }, defs); el('rect', { x: x0, y: SURF - 260, width: x1 - x0, height: BOT - SURF + 260 }, cp);
        const g = el('g', { 'clip-path': `url(#${id}c)` }, parent);
        const dermis = el('rect', { x: x0, y: SURF, width: x1 - x0, height: BOT - SURF, fill: '#161c27' }, g);
        const epi = el('path', { fill: '#232b3a' }, g);
        const fib = el('g', { fill: 'none', stroke: '#2c3648', 'stroke-width': 2 }, g);
        const F = []; for (let r = 0; r < 10; r++) F.push({ e: el('path', {}, fib), y0: 172 + r * 36, r });
        const BMP = []; for (let x = x0; x <= x1; x += 20) BMP.push([x, 140 + 3.5 * Math.sin((x - 58) * .03) + 1.5 * Math.cos((x - 58) * .08)]);
        const bm = poly(BMP), bmBack = BMP.slice().reverse().map(q => `L ${q[0]} ${q[1].toFixed(1)}`).join(' ');
        const bmE = el('path', { d: bm, fill: 'none', stroke: '#4a5262', 'stroke-width': 2.4, pathLength: 1, 'stroke-dasharray': 1 }, g);
        const les = el('g', {}, g);
        const frame = el('path', { d: `M ${x0} ${SURF} L ${x0} ${BOT} L ${x1} ${BOT} L ${x1} ${SURF}`, fill: 'none', stroke: '#3a4150', 'stroke-width': 2 }, parent);
        const surf = el('path', { fill: 'none', stroke: '#ECECEC', 'stroke-width': 4 * sw, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', pathLength: 1, 'stroke-dasharray': 1 }, parent);
        const bars = el('g', {}, parent);
        const W = 5 * sw;
        // superficial
        const sup = { g: el('g', { opacity: 0 }, les) };
        sup.cp = el('rect', { x: 0, y: 95, width: 1100, height: 0 }, el('clipPath', { id: id + 's' }, defs));
        el('path', { d: SUP_PATH, fill: TYPES.sup.fill, stroke: TYPES.sup.col, 'stroke-width': W, 'stroke-linejoin': 'round', 'clip-path': `url(#${id}s)` }, sup.g);
        sup.buds = [250, 340, 430, 520, 610, 700].map((x, i) => el('ellipse', { cx: x, cy: 150, rx: i % 2 ? 36 : 42, ry: i % 2 ? 24 : 30,
            fill: TYPES.sup.fill, stroke: TYPES.sup.col, 'stroke-width': W * .6, opacity: 0 }, les));
        // nodular
        const nod = { e: el('path', { fill: TYPES.nod.fill, stroke: TYPES.nod.col, 'stroke-width': W, 'stroke-linejoin': 'round', opacity: 0 }, les) };
        // infiltrative
        const inf = { g: el('g', { opacity: 0 }, les) };
        inf.halo = el('g', { opacity: 0, filter: 'url(#soft)' }, inf.g);
        INF_PATHS.concat([INF_ISLAND]).forEach(d => el('path', { d, fill: 'none', stroke: TYPES.inf.col, 'stroke-width': 14, 'stroke-opacity': .55 }, inf.halo));
        inf.cp = el('rect', { x: 0, y: 100, width: 1100, height: 0 }, el('clipPath', { id: id + 'i' }, defs));
        const ib = el('g', { 'clip-path': `url(#${id}i)` }, inf.g);
        INF_PATHS.forEach(d => el('path', { d, fill: TYPES.inf.fill, stroke: TYPES.inf.col, 'stroke-width': W, 'stroke-linejoin': 'round' }, ib));
        inf.island = el('path', { d: INF_ISLAND, fill: TYPES.inf.fill, stroke: TYPES.inf.col, 'stroke-width': W, opacity: 0 }, inf.g);
        inf.capFill = el('path', { fill: TYPES.inf.fill }, inf.g);
        inf.capEdge = el('path', { fill: 'none', stroke: TYPES.inf.col, 'stroke-width': W, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }, inf.g);
        // depth bars (below-surface part, no label)
        const bar = {}; ORDER.forEach(k => { const T = TYPES[k], b = el('g', { opacity: 0, stroke: T.col, 'stroke-width': W * .8 }, bars);
            el('line', { x1: T.bx, x2: 936, y1: T.bottom, y2: T.bottom, 'stroke-width': W * .5, 'stroke-dasharray': '5 7' }, b);
            el('line', { x1: 920, x2: 920, y1: SURF, y2: T.bottom }, b); el('line', { x1: 905, x2: 936, y1: SURF, y2: SURF }, b);
            el('line', { x1: 905, x2: 936, y1: T.bottom, y2: T.bottom }, b); bar[k] = b; });

        return { span: null, render(s) {
            // s = { draw, tissue, fib, sup:{r,v,buds,bar}, nod:{r,v,bar}, inf:{r,v,cap,island,halo,bar} }
            const rise = x => s.sup.v * supRise(x, s.sup.r) + s.nod.v * nodRise(x, s.nod.r) + s.inf.v * infRise(x, s.inf.cap);
            // skin surface and epidermis follow the raised parts (epidermis kept as a thin cap)
            const S = []; for (let x = x0; x <= x1; x += 4) { const h = rise(x); S.push([x, SURF - h - (h > 0 ? 7 * Math.min(1, h / 7) : 0)]); }
            surf.setAttribute('d', poly(S)); surf.setAttribute('stroke-dashoffset', 1 - s.draw);
            epi.setAttribute('d', poly(S) + ' ' + bmBack + ' Z');
            [dermis, epi, frame].forEach(e => O(e, s.tissue)); O(fib, s.fib); bmE.setAttribute('stroke-dashoffset', 1 - s.bm);
            F.forEach(f => { let d = ''; for (let x = x0; x <= x1; x += 20) {
                const bell = Math.exp(-((x - NOD.cx) ** 2) / (2 * 170 * 170)), w = clamp01(1 - Math.abs(f.y0 - 380) / 260);
                d += (d ? ' L ' : 'M ') + x + ' ' + (f.y0 + 3 * Math.sin((x - 58) * .028 + f.r) + s.push * w * 34 * bell).toFixed(1); }
                f.e.setAttribute('d', d); });
            // superficial
            O(sup.g, s.sup.v); sup.cp.setAttribute('height', 10 + (TYPES.sup.bottom + 20 - 95) * s.sup.r);
            sup.buds.forEach((b, i) => O(b, s.sup.buds[i]));
            // nodular
            O(nod.e, s.nod.v); nod.e.setAttribute('d', s.nod.r > 0 ? poly(nodPts(s.nod.r)) + ' Z' : '');
            // infiltrative
            O(inf.g, s.inf.v); inf.cp.setAttribute('height', 14 + (TYPES.inf.bottom + 20 - 100) * s.inf.r);
            O(inf.island, s.inf.island); O(inf.halo, s.inf.halo);
            const C = []; for (let x = CAP.x0; x <= CAP.x1; x += 4) C.push([x, SURF - infRise(x, s.inf.cap)]);
            const showCap = s.inf.cap > 0.01;
            // underside: strand roots at the surface, rounded arches between and beside them
            const arch = (xa, xb, k) => { const P = []; for (let j = 0; j <= 12; j++) { const x = xa + (xb - xa) * j / 12;
                P.push([x, SURF + 3 - k * Math.sin(Math.PI * j / 12) * Math.min(infRise((xa + xb) / 2, s.inf.cap) * .55, 40)]); } return P; };
            const A1 = arch(CAP.x1, 591, .5), A2 = arch(484, 376, .45), A3 = arch(264, CAP.x0, .5);
            const under = A1.concat([[591, SURF + 6], [484, SURF + 6]], A2, [[376, SURF + 6], [264, SURF + 6]], A3);
            inf.capFill.setAttribute('d', showCap ? poly(C) + ' ' + under.map(q => `L ${q[0].toFixed(1)} ${q[1].toFixed(1)}`).join(' ') + ' Z' : '');
            inf.capEdge.setAttribute('d', showCap ? poly(C) + ' ' + poly(A1) + ' ' + poly(A2) + ' ' + poly(A3) : '');
            ORDER.forEach(k => O(bar[k], s[k].bar));
        } };
    }

    // ---- centre: block from the surface down to y = 505, headroom above for the raised parts ----
    const CG = el('g', { transform: 'translate(287,292) scale(0.75) translate(-58,-114)' }, $('central'));
    const CTX = makeContext(CG, 58, 998, 1, true);
    const span = el('line', { x1: 205, y1: 88, x2: 780, y2: 88, stroke: '#5AA9DA', 'stroke-width': 2.4, 'marker-start': 'url(#arw)', 'marker-end': 'url(#arw)', opacity: 0 }, CG);
    const LBL = el('g', { 'font-size': 15, fill: '#9AA0A6', opacity: 0 }, $('central'));
    [['Skin surface', 286], ['Epidermis', 310], ['Dermis', 372]].forEach(([s, y]) => { const e = el('text', { x: 1004, y }, LBL); e.textContent = s; });

    // ---- subtitles, captions, pills ----
    const SUBS = [[0, 5, 'Basal cell carcinoma in a cut through the skin'],
        [5, 11.5, 'It grows along the base of the epidermis'],
        [11.5, 18, 'It rises above the skin and grows down as one round mass'],
        [18, 25, 'It grows down as thin branching strands'],
        [25, 99, 'Side by side, on the same skin surface']];
    const subEls = SUBS.map(s => { const e = el('text', { x: 48, y: 104, opacity: 0 }, $('subs')); e.textContent = s[2]; return e; });
    const CAPS = [[5, 11.5, 'sup', 'A wide, shallow ribbon, almost flat at the surface. It spreads sideways.'],
        [11.5, 18, 'nod', 'A raised round mass. It also grows down and pushes the dermis aside.'],
        [18, 25, 'inf', 'Thin strands, small islands and a low raised top. The edge is not clear.']];
    const capEls = CAPS.map(c => { const g = el('g', { opacity: 0, 'text-anchor': 'middle' }, $('central'));
        const a = el('text', { x: 640, y: 628, 'font-size': 30, 'font-weight': 600, fill: TYPES[c[2]].col }, g); a.textContent = TYPES[c[2]].name;
        const b = el('text', { x: 640, y: 662, 'font-size': 19, fill: '#9AA0A6' }, g); b.textContent = c[3]; return g; });
    const PILL = ORDER.map((k, i) => { const g = el('g', { transform: `translate(${838 + i * 140},56)` }, $('pills'));
        const r = el('rect', { x: 0, y: -18, width: 128, height: 36, rx: 18, fill: 'rgba(28,34,48,.6)', stroke: '#3a4150', 'stroke-width': 2 }, g);
        el('circle', { cx: 20, cy: 0, r: 5.5, fill: TYPES[k].col }, g);
        const tx = el('text', { x: 72, y: 6, 'text-anchor': 'middle', 'font-size': 15, fill: '#9AA0A6' }, g); tx.textContent = TYPES[k].name;
        return { r, tx, k }; });

    // ---- comparison panels ----
    const PANELS = ORDER.map((k, i) => { const px = 30 + i * 420;
        const g = el('g', {}, $('panels'));
        const hd = el('text', { x: px + 190, y: 226, 'text-anchor': 'middle', 'font-size': 26, 'font-weight': 600, fill: TYPES[k].col }, g); hd.textContent = TYPES[k].name;
        const inner = el('g', { transform: `translate(${px},358) scale(0.487) translate(-170,-114)` }, g);
        const ctx = makeContext(inner, 170, 950, 1.4, false);
        const lab = el('text', { x: px + 190, y: 584, 'text-anchor': 'middle', 'font-size': 20, fill: '#ECECEC', opacity: 0 }, g);
        lab.textContent = ['Almost flat, wide and shallow', 'Raised, round and deep', 'A little raised, branching strands'][i];
        return { ctx, lab, k }; });

    const OFF = { r: 0, v: 0, bar: 0, buds: [0, 0, 0, 0, 0, 0], cap: 0, island: 0, halo: 0 };

    function renderAt(t) {
        SUBS.forEach((s, i) => O(subEls[i], i === SUBS.length - 1 ? seg(t, s[0], FADE) : (i === 0 ? 1 - seg(t, s[1] - FADE, FADE) : win(t, s[0], s[1]))));
        CAPS.forEach((c, i) => O(capEls[i], win(t, c[0] + .2, c[1])));
        O(LBL, seg(t, 1.6, .8)); O('pills', seg(t, 1.6, .8));
        const act = t >= 5 && t < 11.5 ? 'sup' : t >= 11.5 && t < 18 ? 'nod' : t >= 18 && t < 25 ? 'inf' : null;
        PILL.forEach(p => { const on = p.k === act;
            p.r.setAttribute('stroke', on ? TYPES[p.k].col : '#3a4150'); p.tx.setAttribute('fill', on ? TYPES[p.k].col : '#9AA0A6'); });

        // centre, scenes 1-4
        const nodGrow = seg(t, 12.2, 2.6);
        CTX.render({ draw: seg(t, .2, 1.2), bm: seg(t, .6, 1.3), tissue: seg(t, .8, .9), fib: seg(t, 1.2, .9),
            push: nodGrow * (1 - seg(t, 18, 1.2)),
            sup: { r: seg(t, 6.2, 1.8), v: Math.min(seg(t, 6.2, .3), 1 - seg(t, 11.5, .7)), bar: Math.min(seg(t, 8.6, .6), 1 - seg(t, 11.5, .7)),
                   buds: [0, 1, 2, 3, 4, 5].map(i => Math.min(seg(t, 5.3 + i * .12, .5), 1 - seg(t, 7.2, .8))) },
            nod: { r: nodGrow, v: Math.min(seg(t, 12.2, .3), 1 - seg(t, 18, .7)), bar: Math.min(seg(t, 15.0, .6), 1 - seg(t, 18, .7)) },
            inf: { r: seg(t, 18.8, 2.8), v: Math.min(seg(t, 18.8, .3), 1 - seg(t, 25, .7)), cap: seg(t, 19.4, 1.6),
                   island: Math.min(seg(t, 21.6, .8), 1 - seg(t, 25, .7)), halo: Math.min(seg(t, 22.6, 1.0), 1 - seg(t, 25, .7)),
                   bar: Math.min(seg(t, 22.0, .6), 1 - seg(t, 25, .7)) } });
        O(span, Math.min(seg(t, 8.2, .6), 1 - seg(t, 11.5, .7)));
        O('central', 1 - seg(t, 25, .7));

        // scenes 5-6
        O('compare', seg(t, 25.4, .8));
        PANELS.forEach((p, i) => { const t0 = 26.2 + i * .35, r = seg(t, t0, 1.6), b = seg(t, 28.6 + i * .2, .6);
            const s = { draw: 1, bm: 1, tissue: 1, fib: 1, push: p.k === 'nod' ? r : 0, sup: OFF, nod: OFF, inf: OFF };
            if (p.k === 'sup') s.sup = { r, v: seg(t, t0, .3), bar: b, buds: OFF.buds };
            if (p.k === 'nod') s.nod = { r, v: seg(t, t0, .3), bar: b };
            if (p.k === 'inf') s.inf = { r, v: seg(t, t0, .3), cap: seg(t, t0 + .4, 1.2), island: seg(t, t0 + 1.4, .6), halo: seg(t, t0 + 1.8, .8), bar: b };
            p.ctx.render(s); O(p.lab, seg(t, 29.2 + i * .25, .6)); });
    }
    window.renderAt = renderAt; window.TOTAL = TOTAL;

    const stage = $('stage');
    function fit() { const s = Math.min(innerWidth / 1280, innerHeight / 720);
        stage.style.transform = `scale(${s})`; stage.style.left = (innerWidth - 1280 * s) / 2 + 'px'; stage.style.top = (innerHeight - 720 * s) / 2 + 'px'; }
    addEventListener('resize', fit); fit();

    document.fonts.ready.then(() => {
        renderAt(0); window.__ready = true;
        if (location.hash === '#manual') return;
        let t0 = performance.now();
        const tick = now => { renderAt(Math.min(TOTAL, (now - t0) / 1000)); requestAnimationFrame(tick); };
        requestAnimationFrame(tick);
        addEventListener('click', () => { t0 = performance.now(); });
    });
</script>
</body>
</html>

<title>Homework · AX</title><link rel="stylesheet" href="../assets/katex/katex.min.css"><style>/* quiz.css — inlined by build_quiz.js into every quiz.html and the hub index.html. Mobile-first (iPhone Safari). */
:root {
  --bg: #f4f6fb;
  --card: #ffffff;
  --ink: #161a23;
  --muted: #5b6375;
  --line: #dde2ec;
  --soft: #eef1f7;
  --accent: #2f5bea;
  --accent-ink: #ffffff;
  --accent-soft: #e7edfd;
  --ok: #1d7f47;
  --ok-soft: #e4f4eb;
  --bad: #c3303b;
  --bad-soft: #fcebed;
  --shadow: 0 1px 2px rgba(20, 28, 45, .05), 0 6px 18px rgba(20, 28, 45, .06);
  --radius: 16px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0e1117;
    --card: #171b23;
    --ink: #e7eaf1;
    --muted: #9ba3b4;
    --line: #2a303b;
    --soft: #1f242e;
    --accent: #7c98ff;
    --accent-ink: #0b0e14;
    --accent-soft: #1c2542;
    --ok: #52c98f;
    --ok-soft: #12291f;
    --bad: #ff7d87;
    --bad-soft: #341a1f;
    --shadow: none;
    color-scheme: dark;
  }
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 17px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); }
button { font: inherit; }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.wrap {
  max-width: 640px;
  margin: 0 auto;
  padding: calc(12px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right))
           calc(112px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
}

/* ---------- cards & type ---------- */
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 20px 18px;
  margin-top: 12px;
}
.card > :last-child { margin-bottom: 0; }
.eyebrow {
  margin: 0;
  font-size: 13px;
  font-weight: 650;
  letter-spacing: .05em;
  text-transform: uppercase;
  color: var(--accent);
}
h1 { font-size: 26px; line-height: 1.2; letter-spacing: -.01em; margin: 6px 0 8px; }
.meta { color: var(--muted); margin: 0 0 18px; }
.foot { text-align: center; margin: 22px 0 0; font-size: 15px; color: var(--muted); }

/* ---------- start screen ---------- */
.field label { display: block; font-size: 14px; font-weight: 650; color: var(--muted); margin-bottom: 6px; }
.field input, .numeric input {
  width: 100%;
  padding: 12px 14px;
  border: 1.5px solid var(--line);
  border-radius: 12px;
  background: var(--card);
  color: var(--ink);
  font: 500 18px/1.3 inherit;
  -webkit-appearance: none;
  appearance: none;
}
.numeric input { font-size: 22px; font-weight: 650; }
.field input:focus, .numeric input:focus { outline: none; border-color: var(--accent); }
.modes { display: grid; gap: 10px; margin-top: 16px; }
.btn.mode { display: block; width: 100%; min-height: 64px; padding: 12px 16px; text-align: left; }
.btn.mode strong { display: block; font-size: 18px; }
.btn.mode span { display: block; font-size: 14px; font-weight: 500; opacity: .85; margin-top: 2px; }
.last { margin: 16px 0 0; font-size: 15px; color: var(--muted); }

/* ---------- top bar ---------- */
.topbar {
  position: sticky;
  top: 0;
  z-index: 5;
  margin: calc(-12px - env(safe-area-inset-top)) -16px 0;
  padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
  background: var(--bg);
  background: color-mix(in srgb, var(--bg) 90%, transparent);
  -webkit-backdrop-filter: blur(10px);
  backdrop-filter: blur(10px);
}
.topbar .row { display: flex; align-items: center; gap: 10px; font-size: 15px; color: var(--muted); }
.quit {
  flex: none;
  width: 36px; height: 36px;
  margin-left: -6px;
  border: 0; border-radius: 10px;
  background: transparent;
  color: var(--muted);
  font-size: 20px; line-height: 1;
  cursor: pointer;
}
.count { font-weight: 650; color: var(--ink); font-variant-numeric: tabular-nums; }
.pill {
  padding: 3px 8px;
  border-radius: 999px;
  background: var(--accent-soft);
  color: var(--accent);
  font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
}
.timer { margin-left: auto; font-variant-numeric: tabular-nums; }
.bar { height: 6px; margin-top: 8px; border-radius: 999px; background: var(--line); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: inherit; background: var(--accent); transition: width .25s ease; }
.dots { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.dot {
  min-width: 36px; height: 36px;
  border: 1px solid var(--line); border-radius: 10px;
  background: var(--card); color: var(--muted);
  font-size: 15px; font-weight: 650; font-variant-numeric: tabular-nums;
  cursor: pointer;
}
.dot.answered { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
.dot.current { outline: 2px solid var(--accent); outline-offset: 1px; }

/* ---------- question ---------- */
.qtitle { display: flex; align-items: flex-start; gap: 10px; margin: 0 0 14px; font-size: 19px; line-height: 1.3; }
.qnum {
  flex: none;
  display: inline-grid; place-items: center;
  min-width: 28px; height: 28px; padding: 0 5px; box-sizing: border-box;
  border-radius: 8px;
  background: var(--accent); color: var(--accent-ink);
  font-size: 15px;
}
.prose p { margin: 0 0 12px; }
.prose p:last-child { margin-bottom: 0; }
.prose li:has(.mfrac) + li, .prose li + li:has(.mfrac) { margin-top: 10px; }   /* full-size fractions need room between list lines */
.prose strong { font-weight: 700; }
.tablewrap { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 4px 0 14px; }
.prose table { border-collapse: collapse; font-variant-numeric: tabular-nums; }
.prose th, .prose td { border: 1px solid var(--line); padding: 8px 16px; }
.prose th { background: var(--soft); font-weight: 650; }
.katex { font-size: 1.08em; }
.katex-display, .katex-block { margin: 10px 0; padding: 2px 0; overflow-x: auto; overflow-y: hidden; }
.katex-block .katex-display { margin: 0; }
/* Grid children default to min-width:auto and would stretch to fit a wide formula; keep them at screen width. */
.choices > *, .review > li, .modes > *, .quizlist > *, .stack > * { min-width: 0; }
.prose { min-width: 0; }
.m-stack { display: none; }
.mw.stacked .m-wide { display: none; }
.mw.stacked .m-stack { display: block; }

.choices { display: grid; gap: 10px; margin-top: 18px; }
.choice {
  display: flex; align-items: flex-start; gap: 12px;
  width: 100%; min-height: 54px;
  padding: 12px 14px;
  border: 1.5px solid var(--line); border-radius: 14px;
  background: var(--card); color: var(--ink);
  text-align: left; line-height: 1.45;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: border-color .15s ease, background-color .15s ease;
}
.choice:disabled { cursor: default; opacity: 1; color: var(--ink); }
.choice:focus-visible, .btn:focus-visible, .dot:focus-visible, .quit:focus-visible, summary:focus-visible {
  outline: 3px solid var(--accent); outline-offset: 2px;
}
.letter {
  flex: none;
  display: grid; place-items: center;
  width: 30px; height: 30px;
  border-radius: 50%;
  background: var(--soft); color: var(--muted);
  font-size: 15px; font-weight: 750;
}
.ctext { padding-top: 3px; min-width: 0; }
.choice[aria-checked="true"] { border-color: var(--accent); background: var(--accent-soft); }
.choice[aria-checked="true"] .letter { background: var(--accent); color: var(--accent-ink); }
.choice.correct { border-color: var(--ok); background: var(--ok-soft); }
.choice.correct .letter { background: var(--ok); color: var(--card); }
.choice.wrong { border-color: var(--bad); background: var(--bad-soft); }
.choice.wrong .letter { background: var(--bad); color: var(--card); }
.crow { display: block; }
.crow + .crow { margin-top: 2px; }
.ck { color: var(--muted); font-size: 14px; font-weight: 600; margin-right: 4px; }
.intro { margin: 0 0 18px; padding: 14px; border-radius: 14px; background: var(--soft); font-size: 16px; }
.stitle { font-weight: 700; }
.numeric { margin-top: 18px; }
.numeric.correct input { border-color: var(--ok); background: var(--ok-soft); }
.numeric.wrong input { border-color: var(--bad); background: var(--bad-soft); }
.numeric input:disabled { opacity: 1; color: var(--ink); -webkit-text-fill-color: var(--ink); }
.numrow { display: flex; gap: 8px; }
.numrow input { flex: 1; min-width: 0; }
.sign { flex: none; width: 56px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--soft); color: var(--ink); font: 650 24px/1 inherit; }
.sign:disabled { opacity: .5; }
.fracbox { flex: none; width: 140px; display: flex; flex-direction: column; }
.fracbox input { text-align: center; padding: 8px 10px; }
.fracbar { display: block; height: 3px; margin: 7px 4px; border-radius: 2px; background: var(--ink); }
.frachint { margin: 8px 0 0; font-size: 14px; color: var(--muted); }

#fb { scroll-margin-top: 110px; scroll-margin-bottom: 110px; }
.feedback { margin-top: 18px; padding: 14px; border-radius: 14px; }
.feedback.ok { background: var(--ok-soft); }
.feedback.bad { background: var(--bad-soft); }
.verdict { margin: 0; font-weight: 750; }
.feedback.ok .verdict { color: var(--ok); }
.feedback.bad .verdict { color: var(--bad); }
.solution { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
.notice { margin-top: 16px; padding: 12px 14px; border-radius: 12px; background: var(--bad-soft); font-size: 15px; }

/* ---------- speed test ---------- */
.speed-badge { display: flex; align-items: center; justify-content: center; gap: 12px; margin: 12px 0 4px; padding: 10px 14px; border-radius: 12px; background: var(--soft); font-weight: 700; }
.speed-badge .stime { font-size: 28px; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.speed-badge .srank { font-size: 16px; }
.sp-expert .srank { color: var(--ok); }
.sp-mhigh .srank { color: #0969da; }
.sp-mid .srank { color: #bf8700; }
.sp-mlow .srank { color: #cf5300; }
.sp-npract .srank { color: var(--bad); }
@media (prefers-color-scheme: dark) {
  .sp-mhigh .srank { color: #79b8ff; }
  .sp-mid .srank { color: #f0c239; }
  .sp-mlow .srank { color: #ff9b5e; }
}

/* ---------- bottom action bar ---------- */
.actions {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  z-index: 6;
  padding: 10px calc(16px + env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
  background: var(--bg);
  border-top: 1px solid var(--line);
}
.actions .inner { display: flex; gap: 10px; max-width: 640px; margin: 0 auto; }
.btn {
  flex: 1;
  min-height: 52px;
  padding: 0 18px;
  border: 1px solid transparent; border-radius: 14px;
  font-size: 17px; font-weight: 650;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.secondary { background: var(--soft); border-color: var(--line); color: var(--ink); }
.btn.ghost { background: transparent; color: var(--accent); }
.btn.narrow { flex: 0 0 auto; }
.btn:disabled { opacity: .4; cursor: default; }

/* ---------- result ---------- */
.score { margin: 8px 0 2px; font-size: 64px; font-weight: 800; line-height: 1; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.score small { font-size: 28px; font-weight: 700; color: var(--muted); }
.review { display: grid; gap: 8px; margin: 18px 0 0; padding: 0; list-style: none; }
.review details { border: 1px solid var(--line); border-radius: 14px; background: var(--card); }
.review summary {
  display: flex; align-items: center; gap: 10px;
  min-height: 50px; padding: 10px 14px;
  list-style: none; cursor: pointer;
}
.review summary::-webkit-details-marker { display: none; }
.rq { min-width: 0; }
.chev { flex: none; margin-left: auto; color: var(--muted); transition: transform .2s ease; }
.review details[open] .chev { transform: rotate(90deg); }
.review .body { padding: 0 14px 14px; }
.ya { margin: 0 0 10px; font-size: 15px; color: var(--muted); }
.mark {
  flex: none;
  display: grid; place-items: center;
  width: 26px; height: 26px;
  border-radius: 50%;
  color: var(--card); font-size: 14px; font-weight: 800;
}
.mark.ok { background: var(--ok); }
.mark.bad { background: var(--bad); }
.mark.skip { background: var(--muted); }
/* ---------- choose a question ---------- */
.picklist { list-style: none; margin: 16px 0 0; padding: 0; display: grid; gap: 8px; }
.picklist > li { min-width: 0; }
.picklist > li.phead { margin: 10px 0 -2px; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.picklist > li.phead:first-child { margin-top: 0; }
.pickq {
  display: flex; align-items: center; gap: 12px;
  width: 100%; min-height: 52px;
  padding: 10px 12px;
  border: 1.5px solid var(--line); border-radius: 14px;
  background: var(--card); color: var(--ink);
  font: inherit; font-size: 15px; line-height: 1.35; text-align: left;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.pickq .ptitle { flex: 1; min-width: 0; }
.pickq .pmeta { display: block; margin-top: 2px; font-size: 13px; color: var(--muted); }
.more { margin: 14px 0 0; }
.morelink {
  display: inline-block; padding: 10px 14px;
  border: 1.5px solid var(--accent); border-radius: 12px;
  color: var(--accent); font-weight: 700; text-decoration: none;
}
.pickq.ok { border-color: var(--ok); background: var(--ok-soft); }
.pickq.bad { border-color: var(--bad); background: var(--bad-soft); }
.pickq:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.takeaway { margin-top: 16px; padding: 14px; border-radius: 14px; background: var(--accent-soft); }
.takeaway h3 { margin: 0 0 6px; font-size: 13px; letter-spacing: .05em; text-transform: uppercase; color: var(--accent); }
.stack { display: grid; gap: 10px; margin-top: 16px; }

.toast {
  position: fixed;
  left: 50%; bottom: calc(86px + env(safe-area-inset-bottom));
  transform: translateX(-50%);
  z-index: 7;
  padding: 10px 16px;
  border-radius: 999px;
  background: var(--ink); color: var(--bg);
  font-size: 15px;
  opacity: 0; pointer-events: none;
  transition: opacity .2s ease;
}
.toast.show { opacity: 1; }

/* ---------- material pages ---------- */
.material .topbar .row { justify-content: space-between; }
.back { font-size: 16px; font-weight: 650; text-decoration: none; }
.btn.showall { min-height: 40px; padding: 0 12px; font-size: 15px; }
.figure { margin: 16px 0 0; text-align: center; }
.figure img { max-width: 100%; height: auto; border-radius: 12px; }
.steps { margin-top: 4px; }
.step { margin-top: 14px; padding: 2px 0 2px 14px; border-left: 3px solid var(--accent); }
.btn.reveal { width: 100%; margin-top: 16px; }
.mq h2.qtitle { margin-bottom: 12px; }
/* practice table on a material question: given columns + one typed answer per row */
.practice { margin-top: 16px; }
.practice table { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 18px; }
.practice th:nth-child(1) { width: 14%; } .practice th:nth-child(2) { width: 26%; } .practice th:nth-child(3) { width: 60%; }
.practice th { padding: 6px 4px; border-bottom: 1.5px solid var(--line); font-size: 14px; font-weight: 650; color: var(--muted); text-align: center; }
.practice td { padding: 7px 4px; border-bottom: 1px solid var(--line); text-align: center; vertical-align: middle; }
.pin { display: flex; gap: 6px; }
.pin .sign { width: 44px; height: 44px; border-radius: 10px; font-size: 20px; }
.pin input {
  flex: 1; width: 0; min-width: 0; height: 44px; padding: 0 8px;
  border: 1.5px solid var(--line); border-radius: 10px;
  background: var(--card); color: var(--ink);
  font-family: inherit; font-size: 20px; font-weight: 650; line-height: 1; text-align: center;
  -webkit-appearance: none; appearance: none;
}
.pin input:focus { outline: none; border-color: var(--accent); }
td.correct .pin input { border-color: var(--ok); background: var(--ok-soft); }
td.wrong .pin input { border-color: var(--bad); background: var(--bad-soft); }
.ptag { display: block; margin-top: 3px; font-size: 13px; font-weight: 650; color: var(--muted); }
.ptag:empty { display: none; }
.prow { display: flex; gap: 10px; margin-top: 14px; }
.pscore { min-height: 1.3em; margin: 10px 0 0; text-align: center; font-weight: 650; }

/* ---------- hub ---------- */
.tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-top: 16px; padding: 4px; border-radius: 13px; background: var(--soft); }
.tab {
  min-height: 44px;
  border: 0; border-radius: 10px;
  background: transparent; color: var(--muted);
  font-size: 16px; font-weight: 650;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.tab[aria-selected="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgba(20, 28, 45, .12); }
.tab:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.quizlist.first { margin-top: 14px; }
.course { margin: 26px 0 0; font-size: 14px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.quizlist { display: grid; gap: 10px; margin-top: 10px; }
a.quiz {
  display: block;
  padding: 16px;
  border: 1px solid var(--line); border-radius: var(--radius);
  background: var(--card); box-shadow: var(--shadow);
  color: inherit; text-decoration: none;
  -webkit-tap-highlight-color: transparent;
}
a.quiz .u { font-size: 13px; font-weight: 700; color: var(--accent); }
a.quiz .t { display: block; margin: 2px 0; font-size: 17px; font-weight: 650; line-height: 1.3; }
a.quiz .m { font-size: 14px; color: var(--muted); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
}

u003cspan class=\"pstrut\" style=\"height:3em;\">\u003c/span>\u003cspan class=\"frac-line\" style=\"border-bottom-width:0.04em;\">\u003c/span>\u003c/span>\u003cspan style=\"top:-3.394em;\">\u003cspan class=\"pstrut\" style=\"height:3em;\">\u003c/span>\u003cspan class=\"sizing reset-size6 size3 mtight\">\u003cspan class=\"mord mtight\">\u003cspan class=\"mord mtight\">5\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003cspan class=\"vlist-s\">​\u003c/span>\u003c/span>\u003cspan class=\"vlist-r\">\u003cspan class=\"vlist\" style=\"height:0.345em;\">\u003cspan>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003cspan class=\"mclose nulldelimiter\">\u003c/span>\u003c/span>\u003cspan class=\"mclose\">)\u003c/span>\u003c/span>\u003c/span>\u003c/span>","\u003cspan class=\"katex\">\u003cspan class=\"katex-mathml\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmn>4\u003c/mn>\u003cmo separator=\"true\">,\u003c/mo>\u003cmtext> \u003c/mtext>\u003cmo>−\u003c/mo>\u003cmn>2\u003c/mn>\u003cmo stretchy=\"false\">)\u003c/mo>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">(4,\\ -2)\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/span>\u003cspan class=\"katex-html\" aria-hidden=\"true\">\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:1em;vertical-align:-0.25em;\">\u003c/span>\u003cspan class=\"mopen\">(\u003c/span>\u003cspan class=\"mord\">4\u003c/span>\u003cspan class=\"mpunct\">,\u003c/span>\u003cspan class=\"mspace\"> \u003c/span>\u003cspan class=\"mspace\" style=\"margin-right:0.1667em;\">\u003c/span>\u003cspan class=\"mord\">−\u003c/span>\u003cspan class=\"mord\">2\u003c/span>\u003cspan class=\"mclose\">)\u003c/span>\u003c/span>\u003c/span>\u003c/span>"]}]}</script><script>(() => {
  'use strict';
  const CURRENT = JSON.parse(document.getElementById('homework-data').textContent);
  const app = document.getElementById('app');
  const activeKey = 'bmhomework:' + CURRENT.code + ':active';
  const keyFor = id => 'bmhomework:' + CURRENT.code + ':' + id;
  let D = CURRENT, S = null, storageOK = true, syncText = 'Connecting…', busy = false;
  let pendingTimer = null, saveTimer = null, revision = 0, queue = Promise.resolve();
  let confirmSubmit = false, retryDelay = 2000;
  const read = k => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } };
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fmt = s => Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  const count = () => Object.keys(S?.answers || {}).length;
  const elapsed = () => Math.max(0, Math.floor(((S?.finishedAt || Date.now()) - (S?.startedAt || Date.now())) / 1000));
  function persist() {
    try {
      localStorage.setItem(keyFor(D.id), JSON.stringify(S));
      localStorage.setItem(activeKey, JSON.stringify(D.id));
      storageOK = true;
    } catch { storageOK = false; }
  }
  function state() {
    const previousId = read(activeKey), previous = previousId && read(keyFor(previousId));
    if (previous && !previous.result && previous.assignment?.code === CURRENT.code) {
      D = previous.assignment; S = previous;
    } else S = read(keyFor(CURRENT.id));
    if (!S) {
      S = { id: crypto.randomUUID(), token: Array.from(crypto.getRandomValues(new Uint8Array(32)), v => v.toString(16).padStart(2, '0')).join(''),
        assignment: D, answers: {}, idx: 0, startedAt: null, finishedAt: null, result: null, registered: false };
    }
    persist();
  }
  async function api(action, answers = S.answers) {
    const response = await fetch(D.api, { method: 'POST', headers: {
      'Content-Type': 'application/json', Authorization: 'Bearer ' + S.token,
    }, body: JSON.stringify({ action, id: S.id, code: D.code, assignmentId: D.id, answers,
      completedAt: S.finishedAt || undefined }), signal: AbortSignal.timeout(15000) });
    const data = await response.json();
    if (!response.ok) throw Error(data.error || 'Please try again.');
    return data;
  }
  function connectionLabel() {
    return `<p id="sync" class="sync" role="status">${esc(syncText)}${storageOK ? '' : ' · Keep this page open: this browser cannot save your attempt.'}</p>`;
  }
  function syncLabel(text) {
    syncText = text;
    const el = document.getElementById('sync');
    if (el) el.textContent = text + (storageOK ? '' : ' · Keep this page open: this browser cannot save your attempt.');
  }
  function applyResult(data) {
    if (!data.result) return false;
    S.result = data.result; S.answers = data.answers; S.finishedAt = data.submittedAt;
    persist(); clearTimeout(pendingTimer); render(); return true;
  }
  async function connect() {
    try {
      const data = await api('start', {});
      if (applyResult(data)) return;
      S.registered = true;
      S.startedAt = data.startedAt;
      S.answers = { ...data.answers, ...S.answers };
      persist(); retryDelay = 2000;
      if (S.finishedAt) { render(); await submitPending(); }
      else { syncText = 'Answers saved on this device'; render(); scheduleSave(); }
    } catch {
      syncLabel(S.startedAt ? 'Offline · answers kept on this device' : 'Connection needed to start. Retrying…');
      clearTimeout(pendingTimer); pendingTimer = setTimeout(connect, retryDelay);
      retryDelay = Math.min(30000, retryDelay * 2);
    }
  }
  function scheduleSave() {
    if (!S.registered || S.finishedAt || S.result) return;
    clearTimeout(saveTimer);
    const version = ++revision;
    syncLabel('Saving answers…');
    saveTimer = setTimeout(() => {
      const answers = { ...S.answers };
      queue = queue.catch(() => {}).then(async () => {
        if (S.finishedAt || S.result) return;
        try {
          const data = await api('save', answers);
          if (applyResult(data)) return;
          if (version === revision) syncLabel('Answers saved');
        } catch { syncLabel('Offline · answers kept on this device'); }
      });
    }, 300);
  }
  async function submitPending() {
    if (busy || S.result || !S.finishedAt) return;
    busy = true;
    try {
      await queue.catch(() => {});
      const data = await api('submit');
      if (!applyResult(data)) throw Error('No receipt returned');
    } catch {
      syncLabel('Not recorded yet. Your answers are saved here; retrying automatically.');
      clearTimeout(pendingTimer); pendingTimer = setTimeout(submitPending, 4000);
    } finally { busy = false; }
  }
  function render() {
    if (S.result) return renderResult();
    if (S.finishedAt) {
      app.innerHTML = `<section class="card"><p class="eyebrow">HOMEWORK · ${esc(D.code.toUpperCase())}</p>
        <h1>Recording your result…</h1><p>Your answers are finished and locked.</p>
        <p class="meta">Time: ${fmt(elapsed())}</p>${connectionLabel()}
        <button class="btn primary" data-act="retry-send">Retry saving result</button></section>`;
      return;
    }
    if (!S.startedAt) {
      app.innerHTML = `<section class="card"><p class="eyebrow">HOMEWORK · ${esc(D.code.toUpperCase())}</p>
        <h1>${esc(D.title)}</h1><p>12 questions · Suggested time: ${D.suggestedMinutes} minutes</p>${connectionLabel()}</section>`;
      return;
    }
    const q = D.questions[S.idx], selected = S.answers[S.idx];
    app.innerHTML = `<section class="card">
      <div class="hw-top"><p class="eyebrow">HOMEWORK · ${esc(D.code.toUpperCase())}</p><span id="timer" class="hw-time">${fmt(elapsed())}</span></div>
      <h1>${esc(D.title)}</h1><p class="meta">${D.questions.length} questions · Suggested time: ${D.suggestedMinutes} minutes</p>
      <p class="hw-hint">Work on paper, then choose an answer. You can change it before submitting. The time is for your reference.</p>
      <nav class="hw-dots" aria-label="Questions">${D.questions.map((_, i) => `<button type="button" class="dot ${S.answers[i] ? 'answered' : ''} ${i === S.idx ? 'current' : ''}" data-act="goto" data-i="${i}" aria-label="Question ${i + 1}${S.answers[i] ? ', answered' : ''}" ${i === S.idx ? 'aria-current="step"' : ''}>${i + 1}</button>`).join('')}</nav>
      <p class="eyebrow hw-qnumber">QUESTION ${S.idx + 1} OF ${D.questions.length} · ${esc(q.group)}</p>
      <h2>${esc(q.title)}</h2><div class="prose prompt">${q.prompt}</div>
      <div class="hw-choices" role="group" aria-label="Answer choices">${q.choices.map((choice, i) => {
        const letter = 'ABCD'[i];
        return `<button type="button" class="hw-choice ${selected === letter ? 'selected' : ''}" aria-pressed="${selected === letter}" data-act="answer" data-value="${letter}"><span class="hw-letter">${letter}</span><span>${choice}</span><span class="hw-selected" aria-hidden="true">${selected === letter ? '✓' : ''}</span></button>`;
      }).join('')}</div>
      <div class="hw-nav"><button class="btn secondary" data-act="prev" ${S.idx === 0 ? 'disabled' : ''}>Previous</button>
      <span class="meta">${count()}/${D.questions.length} answered</span><button class="btn secondary" data-act="next" ${S.idx === D.questions.length - 1 ? 'disabled' : ''}>Next</button></div>
      ${connectionLabel()}
      <div class="hw-submit">${confirmSubmit ? `<p class="notice">Submit these ${D.questions.length} answers? They will be final.</p>` : ''}
        <button class="btn primary" data-act="submit" ${count() < D.questions.length ? 'disabled' : ''}>${confirmSubmit ? 'Confirm final submission' : 'Finish and submit'}</button>
        ${count() < D.questions.length ? '<p class="meta">Answer every question before submitting.</p>' : ''}
        ${confirmSubmit ? '<button class="btn ghost" data-act="review">Keep reviewing answers</button>' : ''}
      </div></section>`;
  }
  function renderResult() {
    const r = S.result;
    app.innerHTML = `<section class="card"><p class="eyebrow">HOMEWORK · ${esc(r.studentCode)}</p><h1>${esc(r.title)}</h1>
      <p class="hw-recorded">✓ Result recorded</p><div class="score">${r.score}<small>/${r.total}</small></div>
      <p class="meta">${Math.round(100 * r.score / r.total)}% · Time: ${fmt(r.elapsedSeconds)}</p>
      <p>Suggested time: ${r.suggestedMinutes} minutes. The time is for your reference.</p>
      <p>Your answers and score have been saved. You do not need to copy or send anything.</p>
      <ol class="hw-marks">${r.marks.map(m => `<li><span class="${m.correct ? 'hw-ok' : 'hw-wrong'}">${m.correct ? '✓' : '✗'}</span><span>Q${m.question} · ${esc(m.title)}</span><span>${esc(m.selected)}${m.correct ? '' : ' → ' + esc(m.correctAnswer)}</span></li>`).join('')}</ol>
      <p class="meta">Finished ${esc(new Date(r.submittedAt).toLocaleString())}</p>
      <p class="hw-receipt">Assignment ${esc(r.assignmentId)}<br>Receipt ${esc(r.receiptId)}</p></section>`;
  }
  document.addEventListener('click', e => {
    const button = e.target.closest('[data-act]');
    if (!button || button.disabled) return;
    const act = button.dataset.act;
    if (act === 'retry-send') { submitPending(); return; }
    if (S.result || S.finishedAt) return;
    if (act === 'submit') {
      if (count() !== D.questions.length) return;
      if (!confirmSubmit) { confirmSubmit = true; render(); return; }
      S.finishedAt = Date.now(); persist(); clearTimeout(saveTimer);
      syncText = 'Recording result…'; render(); submitPending(); return;
    }
    confirmSubmit = false;
    if (act === 'answer') { S.answers[S.idx] = button.dataset.value; persist(); scheduleSave(); }
    else if (act === 'goto') S.idx = +button.dataset.i;
    else if (act === 'next') S.idx = Math.min(D.questions.length - 1, S.idx + 1);
    else if (act === 'prev') S.idx = Math.max(0, S.idx - 1);
    persist(); render();
    if (act !== 'answer') window.scrollTo(0, 0);
  });
  window.addEventListener('online', () => { if (S.finishedAt) submitPending(); else connect(); });
  document.addEventListener('visibilitychange', () => { if (!document.hidden && S && !S.result) {
    if (S.finishedAt) submitPending(); else scheduleSave();
  }});
  // This interval only paints. Time comes from timestamps, so backgrounding does not pause it.
  setInterval(() => { const el = document.getElementById('timer'); if (el) el.textContent = fmt(elapsed()); }, 1000);
  state(); render();
  if (!S.result) connect();
})();
</script><noscript><p>JavaScript is needed to complete this homework.</p></noscript></body></html>

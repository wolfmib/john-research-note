<text x="390" y="210" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="500" fill="#bc5b16" text-anchor="start">Row 2</text>
<rect x="27" y="266" width="506" height="58" rx="10" fill="#e8f0ff"/>
<text x="48" y="305" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="500" fill="#285ac7" text-anchor="start">2 × 3 + 1 × 4 = 10</text>

<text x="48" y="377" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="500" fill="#bc5b16" text-anchor="start">1 × 3 + 3 × 4 = 15</text>
<text x="51" y="465" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="500" fill="#17263d" text-anchor="start">AB is 2 × 1</text>

-3.677em;\">\u003cspan class=\"pstrut\" style=\"height:3em;\">\u003c/span>\u003cspan class=\"mord\">\u003cspan class=\"mord\">90\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003cspan class=\"vlist-s\">​\u003c/span>\u003c/span>\u003cspan class=\"vlist-r\">\u003cspan class=\"vlist\" style=\"height:0.686em;\">\u003cspan>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003cspan class=\"mclose nulldelimiter\">\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003cspan class=\"vlist-s\">​\u003c/span>\u003c/span>\u003cspan class=\"vlist-r\">\u003cspan class=\"vlist\" style=\"height:1.9074em;\">\u003cspan>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003cspan class=\"col-align-l\">\u003cspan class=\"vlist-t vlist-t2\">\u003cspan class=\"vlist-r\">\u003cspan class=\"vlist\" style=\"height:2.4074em;\">\u003cspan style=\"top:-4.4074em;\">\u003cspan class=\"pstrut\" style=\"height:3.3214em;\">\u003c/span>\u003cspan class=\"mord\">\u003cspan class=\"mord\">\u003c/span>\u003cspan class=\"mspace\" style=\"margin-right:0.2778em;\">\u003c/span>\u003cspan class=\"mrel\">=\u003c/span>\u003cspan class=\"mspace\" style=\"margin-right:0.2778em;\">\u003c/span>\u003cspan class=\"mord\">20\u003c/span>\u003c/span>\u003c/span>\u003cspan style=\"top:-2.1em;\">\u003cspan class=\"pstrut\" style=\"height:3.3214em;\">\u003c/span>\u003cspan class=\"mord\">\u003cspan class=\"mord\">\u003c/span>\u003cspan class=\"mspace\" style=\"margin-right:0.2778em;\">\u003c/span>\u003cspan class=\"mrel\">=\u003c/span>\u003cspan class=\"mspace\" style=\"margin-right:0.2778em;\">\u003c/span>\u003cspan class=\"mord\">15\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003cspan class=\"vlist-s\">​\u003c/span>\u003c/span>\u003cspan class=\"vlist-r\">\u003cspan class=\"vlist\" style=\"height:1.9074em;\">\u003cspan>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/p>\n","\u003cp>Median before: the 4th value, 15.\u003c/p>\n\u003cp>Median after (6 values): the mean of the 3rd and 4th values, \u003cspan class=\"katex\">\u003cspan class=\"katex-mathml\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmstyle scriptlevel=\"0\" displaystyle=\"false\">\u003cmfrac>\u003cmrow>\u003cmn>15\u003c/mn>\u003cmo>+\u003c/mo>\u003cmn>15\u003c/mn>\u003c/mrow>\u003cmn>2\u003c/mn>\u003c/mfrac>\u003c/mstyle>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">\\tfrac{15 + 15}{2}\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/span>\u003cspan class=\"katex-html\" aria-hidden=\"true\">\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:1.1901em;vertical-align:-0.345em;\">\u003c/span>\u003cspan class=\"mord\">\u003cspan class=\"mopen nulldelimiter\">\u003c/span>\u003cspan class=\"mfrac\">\u003cspan class=\"vlist-t vlist-t2\">\u003cspan class=\"vlist-r\">\u003cspan class=\"vlist\" style=\"height:0.8451em;\">\u003cspan style=\"top:-2.655em;\">\u003cspan class=\"pstrut\" style=\"height:3em;\">\u003c/span>\u003cspan class=\"sizing reset-size6 size3 mtight\">\u003cspan class=\"mord mtight\">\u003cspan class=\"mord mtight\">2\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003cspan style=\"top:-3.23em;\">\u003cspan class=\"pstrut\" style=\"height:3em;\">\u003c/span>\u003cspan class=\"frac-line\" style=\"border-bottom-width:0.04em;\">\u003c/span>\u003c/span>\u003cspan style=\"top:-3.394em;\">\u003cspan class=\"pstrut\" style=\"height:3em;\">\u003c/span>\u003cspan class=\"sizing reset-size6 size3 mtight\">\u003cspan class=\"mord mtight\">\u003cspan class=\"mord mtight\">15\u003c/span>\u003cspan class=\"mbin mtight\">+\u003c/span>\u003cspan class=\"mord mtight\">15\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003cspan class=\"vlist-s\">​\u003c/span>\u003c/span>\u003cspan class=\"vlist-r\">\u003cspan class=\"vlist\" style=\"height:0.345em;\">\u003cspan>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003cspan class=\"mclose nulldelimiter\">\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>, which is 15.\u003c/p>\n","\u003cp>The mean falls by 5; the median stays 15.\u003c/p>\n\u003cp>\u003cstrong>Answer: A\u003c/strong>\u003c/p>\n"]}]}</script>
<script>
(() => {
  'use strict';
  const D = JSON.parse(document.getElementById('material-data').textContent);
  const app = document.getElementById('app');
  const shown = D.questions.map(() => 0);     // steps revealed per question
  const reduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const HUB = D.hubHref || '../index.html#material';   // this note's root, Material tab

  // Fit display math to the phone: use the stacked version of a wide line, then shrink what still overflows.
  function fitMath(root) {
    (root || app).querySelectorAll('.mw').forEach(w => {
      w.classList.remove('stacked');
      const d = w.querySelector('.m-wide .katex-display');
      if (d && d.offsetParent && d.scrollWidth > d.clientWidth * 1.12) w.classList.add('stacked');
    });
    (root || app).querySelectorAll('.katex-display').forEach(d => {
      d.style.fontSize = '';
      if (!d.offsetParent) return;
      let s = 1;
      for (let k = 0; k < 5 && d.scrollWidth > d.clientWidth + 1 && s > 0.7; k++) {
        s = Math.max(0.7, s * (d.clientWidth / d.scrollWidth) * 0.97);
        d.style.fontSize = s + 'em';
      }
    });
  }

  function label(i) {
    const n = D.questions[i].steps.length, k = shown[i];
    if (k === 0) return 'Show working';
    if (k < n) return `Next step (${k + 1}/${n})`;
    return 'Hide working';
  }

  function update(i) {
    const card = document.getElementById('q' + i);
    card.querySelectorAll('.step').forEach((s, k) => { s.hidden = k >= shown[i]; });
    const b = card.querySelector('[data-act="step"]');
    b.textContent = label(i);
    b.classList.toggle('primary', shown[i] < D.questions[i].steps.length);
    b.classList.toggle('secondary', shown[i] === D.questions[i].steps.length);
    b.setAttribute('aria-expanded', String(shown[i] > 0));
    fitMath(card);
  }

  function allOpen() { return D.questions.every((q, i) => shown[i] === q.steps.length); }
  function updateAll() {
    D.questions.forEach((_, i) => update(i));
    document.querySelector('[data-act="all"]').textContent = allOpen() ? 'Hide all' : 'Show all';
  }

  app.innerHTML = `
    <div class="topbar"><div class="row">
      <a class="back" href="${esc(HUB)}">‹ Material</a>
      <button class="btn ghost narrow showall" data-act="all">Show all</button>
    </div></div>
    <section class="card">
      <p class="eyebrow">${esc(D.course)}</p>
      <h1>${esc(D.heading)}</h1>
      ${D.intro ? `<div class="prose">${D.intro}</div>` : ''}
      ${D.figure ? `<figure class="figure"><img src="${esc(D.figure)}" alt="${esc(D.figureAlt)}"></figure>` : ''}
    </section>
    ${D.questions.map((q, i) => `${q.group && q.group !== (D.questions[i - 1] || {}).group ? `
    <h2 class="course">${esc(q.group)}</h2>` : ''}
    <section class="card mq" id="q${i}">
      <h2 class="qtitle"><span class="qnum" aria-hidden="true">${i + 1}</span><span>${esc(q.title)}</span></h2>
      <div class="prose">${q.prompt}</div>
      <div class="steps" id="steps${i}">${q.steps.map(s => `<div class="step prose" hidden>${s}</div>`).join('')}</div>
      <button class="btn primary reveal" data-act="step" data-i="${i}" aria-controls="steps${i}" aria-expanded="false">Show working</button>
    </section>`).join('')}
    <p class="foot"><a href="${esc(HUB)}">All material</a>${D.link ? ` · <a href="${esc(D.link[1])}">${esc(D.link[0])}</a>` : ''}</p>`;

  document.addEventListener('click', e => {
    const b = e.target.closest('[data-act]');
    if (!b) return;
    if (b.dataset.act === 'step') {
      const i = +b.dataset.i, n = D.questions[i].steps.length;
      shown[i] = shown[i] < n ? shown[i] + 1 : 0;
      update(i);
      document.querySelector('[data-act="all"]').textContent = allOpen() ? 'Hide all' : 'Show all';
      if (shown[i] > 0) {
        const s = document.querySelectorAll(`#q${i} .step`)[shown[i] - 1];
        s.scrollIntoView({ behavior: reduced ? 'auto' : 'smooth', block: 'nearest' });
      }
    } else if (b.dataset.act === 'all') {
      const open = !allOpen();
      D.questions.forEach((q, i) => { shown[i] = open ? q.steps.length : 0; });
      updateAll();
    }
  });
  window.addEventListener('resize', () => fitMath(app));
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => fitMath(app));
  updateAll();
})();
</script>

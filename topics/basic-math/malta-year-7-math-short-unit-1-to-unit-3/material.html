<script type="application/json" id="material-data">{"slug":"malta-year-7-math-short-unit-1-to-unit-3","title":"Malta Year 7 Math — Year 7 (Short) Unit 1 to Unit 3","heading":"Year 7 (Short) Unit 1 to Unit 3","course":"Malta Year 7 Math","intro":"\u003cp>A short pass through the first three Year 7 units — number system, numerical calculations and algebra — with one idea and one worked example per subtopic.\u003c/p>\n","figure":"","figureAlt":"Year 7 (Short) Unit 1 to Unit 3","hubHref":"../index.html#malta/material","link":["Recap quiz ›","../malta-year-7-math-short-unit-1-to-unit-3-recap/quiz.html"],"questions":[{"group":"Unit 1 — Number System","title":"Place value and ordering","prompt":"\u003cp>A digit's value depends on its column. To order numbers, compare the biggest place value first; the first column that differs decides.\u003c/p>\n\u003cp>\u003cstrong>Example:\u003c/strong> Order 40,312, 40,231 and 43,012 from smallest to largest.\u003c/p>\n","steps":["\u003cp>All three have 4 ten-thousands. In the thousands column, 43,012 has 3 and the others have 0, so it is the largest.\u003c/p>\n","\u003cp>Compare the hundreds of the other two: 2 &lt; 3.\u003c/p>\n\u003cp class=\"katex-block\">\u003cspan class=\"katex-display\">\u003cspan class=\"katex\">\u003cspan class=\"katex-mathml\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003csemantics>\u003cmrow>\u003cmenclose notation=\"box\">\u003cmstyle scriptlevel=\"0\" displaystyle=\"false\">\u003cmstyle scriptlevel=\"0\" displaystyle=\"false\">\u003cmstyle scriptlevel=\"0\" displaystyle=\"true\">\u003cmrow>\u003cmn>40,231\u003c/mn>\u003cmo>&lt;\u003c/mo>\u003cmn>40,312\u003c/mn>\u003cmo>&lt;\u003c/mo>\u003cmn>43,012\u003c/mn>\u003c/mrow>\u003c/mstyle>\u003c/mstyle>\u003c/mstyle>\u003c/menclose>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">\\boxed{40{,}231 &lt; 40{,}312 &lt; 43{,}012}\n\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/span>\u003cspan class=\"katex-html\" ar ue\">\u003cmrow>\u003cmn>40\u003c/mn>\u003cmi mathvariant=\"normal\">%\u003c/mi>\u003cmo>=\u003c/mo>\u003cmn>96\u003c/mn>\u003cmo separator=\"true\">,\u003c/mo>\u003c/mrow>\u003c/mstyle>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd>\u003cmstyle scriptlevel=\"0\" displaystyle=\"true\">\u003cmrow>\u003cmn>5\u003c/mn>\u003cmi mathvariant=\"normal\">%\u003c/mi>\u003cmo>=\u003c/mo>\u003cmn>12\u003c/mn>\u003c/mrow>\u003c/mstyle>\u003c/mtd>\u003c/mtr>\u003c/mtable>\u003cannotation encoding=\"application/x-tex\">\\begin{gathered}40\\% = 96, \\\\ 5\\% = 12\n\\end{gathered}\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/span>\u003cspan class=\"katex-html\" aria-hidden=\"true\">\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:2.7em;vertical-align:-1.1em;\">\u003c/span>\u003cspan class=\"mord\">\u003cspan class=\"mtable\">\u003cspan class=\"col-align-c\">\u003cspan class=\"vlist-t vlist-t2\">\u003cspan class=\"vlist-r\">\u003cspan class=\"vlist\" style=\"height:1.6em;\">\u003cspan style=\"top:-3.76em;\">\u003cspan class=\"pstrut\" style=\"height:3em;\">\u003c/span>\u003cspan class=\"mord\">\u003cspan class=\"mord\">40%\u003c/span>\u003cspan class=\"mspace\" style=\"margin-right:0.2778em;\">\u003c/span>\u003cspan class=\"mrel\">=\u003c/span>\u003cspan class=\"mspace\" style=\"margin-right:0.2778em;\">\u003c/span>\u003cspan class=\"mord\">96\u003c/span>\u003cspan class=\"mpunct\">,\u003c/span>\u003c/span>\u003c/span>\u003cspan style=\"top:-2.26em;\">\u003cspan class=\"pstrut\" style=\"height:3em;\">\u003c/span>\u003cspan class=\"mord\">\u003cspan class=\"mord\">5%\u003c/span>\u003cspan class=\"mspace\" style=\"margin-right:0.2778em;\">\u003c/span>\u003cspan class=\"mrel\">=\u003c/span>\u003cspan class=\"mspace\" style=\"margin-right:0.2778em;\">\u003c/span>\u003cspan class=\"mord\">12\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003cspan class=\"vlist-s\">​\u003c/span>\u003c/span>\u003cspan class=\"vlist-r\">\u003cspan class=\"vlist\" style=\"height:1.1em;\">\u003cspan>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/p>\n","\u003cp>Add, and check with the decimal:\u003c/p>\n\u003cp class=\"katex-block\">\u003cspan class=\"katex-display\">\u003cspan class=\"katex\">\u003cspan class=\"katex-mathml\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003csemantics>\u003cmrow>\u003cmn>45\u003c/mn>\u003cmi mathvariant=\"normal\">%\u003c/mi>\u003cmo>=\u003c/mo>\u003cmn>96\u003c/mn>\u003cmo>+\u003c/mo>\u003cmn>12\u003c/mn>\u003cmo>=\u003c/mo>\u003cmn>0.45\u003c/mn>\u003cmo>×\u003c/mo>\u003cmn>240\u003c/mn>\u003cmo>=\u003c/mo>\u003cmenclose notation=\"box\">\u003cmstyle scriptlevel=\"0\" displaystyle=\"false\">\u003cmstyle scriptlevel=\"0\" displaystyle=\"false\">\u003cmstyle scriptlevel=\"0\" displaystyle=\"true\">\u003cmn>108\u003c/mn>\u003c/mstyle>\u003c/mstyle>\u003c/mstyle>\u003c/menclose>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">45\\% = 96 + 12 = 0.45\\times240 = \\boxed{108}\n\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/span>\u003cspan class=\"katex-html\" aria-hidden=\"true\">\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:0.8056em;vertical-align:-0.0556em;\">\u003c/span>\u003cspan class=\"mord\">45%\u003c/span>\u003cspan class=\"mspace\" style=\"margin-right:0.2778em;\">\u003c/span>\u003cspan class=\"mrel\">=\u003c/span>\u003cspan class=\"mspace\" style=\"margin-right:0.2778em;\">\u003c/span>\u003c/span>\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:0.7278em;vertical-align:-0.0833em;\">\u003c/span>\u003cspan class=\"mord\">96\u003c/span>\u003cspan class=\"mspace\" style=\"margin-right:0.2222em;\">\u003c/span>\u003cspan class=\"mbin\">+\u003c/span>\u003cspan class=\"mspace\" style=\"margin-right:0.2222em;\">\u003c/span>\u003c/span>\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:0.6444em;\">\u0 cal Calculations","title":"Money and direct proportion","prompt":"\u003cp>When every item costs the same, find the cost of one item first, then scale up. Keep money to two decimal places.\u003c/p>\n\u003cp>\u003cstrong>Example:\u003c/strong> 6 ice creams cost €9.00. How much do 10 cost?\u003c/p>\n","steps":["\u003cp>One ice cream:\u003c/p>\n\u003cp class=\"katex-block\">\u003cspan class=\"katex-display\">\u003cspan class=\"katex\">\u003cspan class=\"katex-mathml\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003csemantics>\u003cmrow>\u003cmn>9.00\u003c/mn>\u003cmo>÷\u003c/mo>\u003cmn>6\u003c/mn>\u003cmo>=\u003c/mo>\u003cmn>1.50\u003c/mn>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">9.00\\div6 = 1.50\n\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/span>\u003cspan class=\"katex-html\" aria-hidden=\"true\">\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:0.7278em;vertical-align:-0.0833em;\">\u003c/span>\u003cspan class=\"mord\">9.00\u003c/span>\u003cspan class=\"mspace\" style=\"margin-right:0.2222em;\">\u003c/span>\u003cspan class=\"mbin\">÷\u003c/span>\u003cspan class=\"mspace\" style=\"margin-right:0.2222em;\">\u003c/span>\u003c/span>\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:0.6444em;\">\u003c/span>\u003cspan class=\"mord\">6\u003c/span>\u003cspan class=\"mspace\" style=\"margin-right:0.2778em;\">\u003c/span>\u003cspan class=\"mrel\">=\u003c/span>\u003cspan class=\"mspace\" style=\"margin-right:0.2778em;\">\u003c/span>\u003c/span>\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:0.6444em;\">\u003c/span>\u003cspan class=\"mord\">1.50\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/p>\n","\u003cp>Ten ice creams:\u003c/p>\n\u003cp class=\"katex-block\">\u003cspan class=\"katex-display\">\u003cspan class=\"katex\">\u003cspan class=\"katex-mathml\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003csemantics>\u003cmrow>\u003cmn>10\u003c/mn>\u003cmo>×\u003c/mo>\u003cmn>1.50\u003c/mn>\u003cmo>=\u003c/mo>\u003cmenclose notation=\"box\">\u003cmstyle scriptlevel=\"0\" displaystyle=\"false\">\u003cmstyle scriptlevel=\"0\" displaystyle=\"false\">\u003cmstyle scriptlevel=\"0\" displaystyle=\"true\">\u003cmn>15.00\u003c/mn>\u003c/mstyle>\u003c/mstyle>\u003c/mstyle>\u003c/menclose>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">10\\times1.50 = \\boxed{15.00}\n\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/span>\u003cspan class=\"katex-html\" aria-hidden=\"true\">\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:0.7278em;vertical-align:-0.0833em;\">\u003c/span>\u003cspan class=\"mord\">10\u003c/span>\u003cspan class=\"mspace\" style=\"margin-right:0.2222em;\">\u003c/span>\u003cspan class=\"mbin\">×\u003c/span>\u003cspan class=\"mspace\" style=\"margin-right:0.2222em;\">\u003c/span>\u003c/span>\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:0.6444em;\">\u003c/span>\u003cspan class=\"mord\">1.50\u003c/span>\u003cspan class=\"mspace\" style=\"margin-right:0.2778em;\">\u003c/span>\u003cspan class=\"mrel\">=\u003c/span>\u003cspan class=\"mspace\" style=\"margin-right:0.2778em;\">\u003c/span>\u003c/span>\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:1.3244em;vertical-align:-0.34em;\">\u003c/span>\u003cspan class=\"mord\">\u003cspan class=\"vlist-t vlist-t2\">\u003cspan class=\"vlist-r\">\u003cspan class=\"vlist\" style=\"height:0.9844em;\">\u003cspan style=\"top:-3.3244em;\">\u003cspan class=\"pstrut\" style=\"height:3.3244em;\">\u003c/span>\u003cspan class=\"boxpad\">\u003cspan class=\"mord\">\u003cspan class=\"mord\">\u003cspan class=\"mord\">15.00\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003cspan style=\"top:-2.9844em;\">\u003cspan class=\"pstrut\" style=\"height:3.3244em;\">\u003c/span>\u003cspan class=\"stretchy fbox\" style=\"height:1.3244em;border-style:solid;border-width:0.04em;\">\u00       d.style.fontSize = '';
      if (!d.offsetParent) return;
      let s = 1;
      for (let k = 0; k < 5 && d.scrollWidth > d.clientWidth + 1 && s > 0.7; k++) {
        s = Math.max(0.7, s * (d.clientWidth / d.scrollWidth) * 0.97);
        d.style.fontSize = s + 'em';
      }
    });
  }

  function label(i) {
    const n = D.questions[i].steps.length, k = shown[i];
    if (k === 0) return 'Show working';
    if (k < n) return `Next step (${k + 1}/${n})`;
    return 'Hide working';
  }

  function update(i) {
    const card = document.getElementById('q' + i);
    card.querySelectorAll('.step').forEach((s, k) => { s.hidden = k >= shown[i]; });
    const b = card.querySelector('[data-act="step"]');
    b.textContent = label(i);
    b.classList.toggle('primary', shown[i] < D.questions[i].steps.length);
    b.classList.toggle('secondary', shown[i] === D.questions[i].steps.length);
    b.setAttribute('aria-expanded', String(shown[i] > 0));
    fitMath(card);
  }

  function allOpen() { return D.questions.every((q, i) => shown[i] === q.steps.length); }
  function updateAll() {
    D.questions.forEach((_, i) => update(i));
    document.querySelector('[data-act="all"]').textContent = allOpen() ? 'Hide all' : 'Show all';
  }

  app.innerHTML = `
    <div class="topbar"><div class="row">
      <a class="back" href="${esc(HUB)}">‹ Material</a>
      <button class="btn ghost narrow showall" data-act="all">Show all</button>
    </div></div>
    <section class="card">
      <p class="eyebrow">${esc(D.course)}</p>
      <h1>${esc(D.heading)}</h1>
      ${D.intro ? `<div class="prose">${D.intro}</div>` : ''}
      ${D.figure ? `<figure class="figure"><img src="${esc(D.figure)}" alt="${esc(D.figureAlt)}"></figure>` : ''}
    </section>
    ${D.questions.map((q, i) => `${q.group && q.group !== (D.questions[i - 1] || {}).group ? `
    <h2 class="course">${esc(q.group)}</h2>` : ''}
    <section class="card mq" id="q${i}">
      <h2 class="qtitle"><span class="qnum" aria-hidden="true">${i + 1}</span><span>${esc(q.title)}</span></h2>
      <div class="prose">${q.prompt}</div>
      <div class="steps" id="steps${i}">${q.steps.map(s => `<div class="step prose" hidden>${s}</div>`).join('')}</div>
      <button class="btn primary reveal" data-act="step" data-i="${i}" aria-controls="steps${i}" aria-expanded="false">Show working</button>
    </section>`).join('')}
    <p class="foot"><a href="${esc(HUB)}">All material</a>${D.link ? ` · <a href="${esc(D.link[1])}">${esc(D.link[0])}</a>` : ''}</p>`;

  document.addEventListener('click', e => {
    const b = e.target.closest('[data-act]');
    if (!b) return;
    if (b.dataset.act === 'step') {
      const i = +b.dataset.i, n = D.questions[i].steps.length;
      shown[i] = shown[i] < n ? shown[i] + 1 : 0;
      update(i);
      document.querySelector('[data-act="all"]').textContent = allOpen() ? 'Hide all' : 'Show all';
      if (shown[i] > 0) {
        const s = document.querySelectorAll(`#q${i} .step`)[shown[i] - 1];
        s.scrollIntoView({ behavior: reduced ? 'auto' : 'smooth', block: 'nearest' });
      }
    } else if (b.dataset.act === 'all') {
      const open = !allOpen();
      D.questions.forEach((q, i) => { shown[i] = open ? q.steps.length : 0; });
      updateAll();
    }
  });
  window.addEventListener('resize', () => fitMath(app));
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => fitMath(app));
  updateAll();
})();
</script>
</body>
</html>

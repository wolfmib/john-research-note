\" style=\"height:0.6741em;\">\u003cspan style=\"top:-3.063em;margin-right:0.05em;\">\u003cspan class=\"pstrut\" style=\"height:2.7em;\">\u003c/span>\u003cspan class=\"sizing reset-size6 size3 mtight\">\u003cspan class=\"mbin mtight\">∘\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>, one full spin, so the toy car is back at the start, facing right.\u003c/p>\n\u003cp class=\"katex-block\">\u003cspan class=\"katex-display\">\u003cspan class=\"katex\">\u003cspan class=\"katex-mathml\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003csemantics>\u003cmrow>\u003cmenclose notation=\"box\">\u003cmstyle scriptlevel=\"0\" displaystyle=\"false\">\u003cmstyle scriptlevel=\"0\" displaystyle=\"false\">\u003cmstyle scriptlevel=\"0\" displaystyle=\"true\">\u003cmrow>\u003cmtext mathvariant=\"monospace\">REPEAT\u003c/mtext>\u003cmtext> \u003c/mtext>\u003cmtext mathvariant=\"monospace\">8\u003c/mtext>\u003cmtext> \u003c/mtext>\u003cmtext mathvariant=\"monospace\">[FD\u003c/mtext>\u003cmtext> \u003c/mtext>\u003cmtext mathvariant=\"monospace\">10\u003c/mtext>\u003cmtext> \u003c/mtext>\u003cmtext mathvariant=\"monospace\">RT\u003c/mtext>\u003cmtext> \u003c/mtext>\u003cmtext mathvariant=\"monospace\">45]\u003c/mtext>\u003c/mrow>\u003c/mstyle>\u003c/mstyle>\u003c/mstyle>\u003c/menclose>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">\\boxed{\\texttt{REPEAT 8 [FD 10 RT 45]}}\n\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/span>\u003cspan class=\"katex-html\" aria-hidden=\"true\">\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:1.4578em;vertical-align:-0.4233em;\">\u003c/span>\u003cspan class=\"mord\">\u003cspan class=\"vlist-t vlist-t2\">\u003cspan class=\"vlist-r\">\u003cspan class=\"vlist\" style=\"height:1.0344em;\">\u003cspan style=\"top:-3.4578em;\">\u003cspan class=\"pstrut\" style=\"height:3.4578em;\">\u003c/span>\u003cspan class=\"boxpad\">\u003cspan class=\"mord\">\u003cspan class=\"mord\">\u003cspan class=\"mord text\">\u003cspan class=\"mord texttt\">REPEAT 8 [FD 10 RT 45]\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003cspan style=\"top:-3.0344em;\">\u003cspan class=\"pstrut\" style=\"height:3.4578em;\">\u003c/span>\u003cspan class=\"stretchy fbox\" style=\"height:1.4578em;border-style:solid;border-width:0.04em;\">\u003c/span>\u003c/span>\u003c/span>\u003cspan class=\"vlist-s\">​\u003c/span>\u003c/span>\u003cspan class=\"vlist-r\">\u003cspan class=\"vlist\" style=\"height:0.4233em;\">\u003cspan>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/p>\n\u003cp>\u003ccode>REPEAT 8 [FD 10 RT 135]\u003c/code> uses the inside angle: the toy car turns the wrong amount, \u003cspan class=\"katex\">\u003cspan class=\"katex-mathml\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmn>8\u003c/mn>\u003cmo>×\u003c/mo>\u003cmsup>\u003cmn>135\u003c/mn>\u003cmo>∘\u003c/mo>\u003c/msup>\u003cmo>=\u003c/mo>\u003cmsup>\u003cmn>1080\u003c/mn>\u003cmo>∘\u003c/mo>\u003c/msup>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">8\\times135^\\circ = 1080^\\circ\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/span>\u003cspan class=\"katex-html\" aria-hidden=\"true\">\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:0.7278em;vertical-align:-0.0833em;\">\u003c/span>\u003cspan class=\"mord\">8\u003c/span>\u003cspan class=\"mspace\" style=\"margin-right:0.2222em;\">\u003c/span>\u003cspan class=\"mbin\">×\u003c/span>\u003cspan class=\"mspace\" style=\"margin-right:0.2222em;\">\u003c/span>\u003c/span>\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:0.6741em;\">\u003c/span>\u003cspan class=\"mord\">13\u003c/span>\u003cspan class=\"mord\">\u003cspan class=\"mord\">5\u003c/span>\u003cspan class=\"msupsub\">\u003cspan class=\"vlist-t\">\u003cspan class=\"vlist-r\">\u003cspan class=\"vlist\" style=\"height:0.6741em;\">\u003cspan style=\"top:-3.063em;margin-right:0.05em;\">\u003cspan class=\"pstrut\" style=\"height:2.7em;\">\u003c/span>\u003cspan class=\"sizing reset-size6 size3 mtight\">\u003cspan class=\"mbin mtight\">∘\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003cspan class=\"mspace\" style=\"margin-right:0.2778em;\">\u003c/span>\u003cspan class=\"mrel\">=\u003c/span>\u003cspan class=\"mspace\" style=\"margin-right:0.2778em;\">\u003c/span>\u003c/span>\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:0.6741em;\">\u003c/span>\u003cspan class=\"mord\">108\u003c/span>\u003cspan class=\"mord\">\u003cspan class=\"mord\">0\u003c/span>\u003cspan class=\"msupsub\">\u003cspan class=\"vlist-t\">\u003cspan class=\"vlist-r\">\u003cspan class=\"vlist\" style=\"height:0.6741em;\">\u003cspan style=\"top:-3.063em;margin-right:0.05em;\">\u003cspan class=\"pstrut\" style=\"height:2.7em;\">\u003c/span>\u003cspan class=\"sizing reset-size6 size3 mtight\">\u003cspan class=\"mbin mtight\">∘\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>, so it does not draw a regular octagon. \u003ccode>REPEAT 6 [FD 10 RT 45]\u003c/code> repeats only 6 times: \u003cspan class=\"katex\">\u003cspan class=\"katex-mathml\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmn>6\u003c/mn>\u003cmo>×\u003c/mo>\u003cmsup>\u003cmn>45\u003c/mn>\u003cmo>∘\u003c/mo>\u003c/msup>\u003cmo>=\u003c/mo>\u003cmsup>\u003cmn>270\u003c/mn>\u003cmo>∘\u003c/mo>\u003c/msup>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">6\\times45^\\circ = 270^\\circ\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/span>\u003cspan class=\"katex-html\" aria-hidden=\"true\">\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:0.7278em;vertical-align:-0.0833em;\">\u003c/span>\u003cspan class=\"mord\">6\u003c/span>\u003cspan class=\"mspace\" style=\"margin-right:0.2222em;\">\u003c/span>\u003cspan class=\"mbin\">×\u003c/span>\u003cspan class=\"mspace\" style=\"margin-right:0.2222em;\">\u003c/span>\u003c/span>\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:0.6741em;\">\u003c/span>\u003cspan class=\"mord\">4\u003c/span>\u003cspan class=\"mord\">\u003cspan class=\"mord\">5\u003c/span>\u003cspan class=\"msupsub\">\u003cspan class=\"vlist-t\">\u003cspan class=\"vlist-r\">\u003cspan class=\"vlist\" style=\"height:0.6741em;\">\u003cspan style=\"top:-3.063em;margin-right:0.05em;\">\u003cspan class=\"pstrut\" style=\"height:2.7em;\">\u003c/span>\u003cspan class=\"sizing reset-size6 size3 mtight\">\u003cspan class=\"mbin mtight\">∘\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003cspan class=\"mspace\" style=\"margin-right:0.2778em;\">\u003c/span>\u003cspan class=\"mrel\">=\u003c/span>\u003cspan class=\"mspace\" style=\"margin-right:0.2778em;\">\u003c/span>\u003c/span>\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:0.6741em;\">\u003c/span>\u003cspan class=\"mord\">27\u003c/span>\u003cspan class=\"mord\">\u003cspan class=\"mord\">0\u003c/span>\u003cspan class=\"msupsub\">\u003cspan class=\"vlist-t\">\u003cspan class=\"vlist-r\">\u003cspan class=\"vlist\" style=\"height:0.6741em;\">\u003cspan style=\"top:-3.063em;margin-right:0.05em;\">\u003cspan class=\"pstrut\" style=\"height:2.7em;\">\u003c/span>\u003cspan class=\"sizing reset-size6 size3 mtight\">\u003cspan class=\"mbin mtight\">∘\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>, less than a full spin, so the shape does not close. \u003ccode>REPEAT 8 [FD 10 RT 90]\u003c/code> uses the turn for a square: \u003cspan class=\"katex\">\u003cspan class=\"katex-mathml\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmn>8\u003c/mn>\u003cmo>×\u003c/mo>\u003cmsup>\u003cmn>90\u003c/mn>\u003cmo>∘\u003c/mo>\u003c/msup>\u003cmo>=\u003c/mo>\u003cmsup>\u003cmn>720\u003c/mn>\u003cmo>∘\u003c/mo>\u003c/msup>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">8\\times90^\\circ = 720^\\circ\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/span>\u003cspan class=\"katex-html\" aria-hidden=\"true\">\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:0.7278em;vertical-align:-0.0833em;\">\u003c/span>\u003cspan class=\"mord\">8\u003c/span>\u003cspan class=\"mspace\" style=\"margin-right:0.2222em;\">\u003c/span>\u003cspan class=\"mbin\">×\u003c/span>\u003cspan class=\"mspace\" style=\"margin-right:0.2222em;\">\u003c/span>\u003c/span>\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:0.6741em;\">\u003c/span>\u003cspan class=\"mord\">9\u003c/span>\u003cspan class=\"mord\">\u003cspan class=\"mord\">0\u003c/span>\u003cspan class=\"msupsub\">\u003cspan class=\"vlist-t\">\u003cspan class=\"vlist-r\">\u003cspan class=\"vlist\" style=\"height:0.6741em;\">\u003cspan style=\"top:-3.063em;margin-right:0.05em;\">\u003cspan class=\"pstrut\" style=\"height:2.7em;\">\u003c/span>\u003cspan class=\"sizing reset-size6 size3 mtight\">\u003cspan class=\"mbin mtight\">∘\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003cspan class=\"mspace\" style=\"margin-right:0.2778em;\">\u003c/span>\u003cspan class=\"mrel\">=\u003c/span>\u003cspan class=\"mspace\" style=\"margin-right:0.2778em;\">\u003c/span>\u003c/span>\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:0.6741em;\">\u003c/span>\u003cspan class=\"mord\">72\u003c/span>\u003cspan class=\"mord\">\u003cspan class=\"mord\">0\u003c/span>\u003cspan class=\"msupsub\">\u003cspan class=\"vlist-t\">\u003cspan class=\"vlist-r\">\u003cspan class=\"vlist\" style=\"height:0.6741em;\">\u003cspan style=\"top:-3.063em;margin-right:0.05em;\">\u003cspan class=\"pstrut\" style=\"height:2.7em;\">\u003c/span>\u003cspan class=\"sizing reset-size6 size3 mtight\">\u003cspan class=\"mbin mtight\">∘\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>, not one full spin of \u003cspan class=\"katex\">\u003cspan class=\"katex-mathml\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmsup>\u003cmn>360\u003c/mn>\u003cmo>∘\u003c/mo>\u003c/msup>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">360^\\circ\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/span>\u003cspan class=\"katex-html\" aria-hidden=\"true\">\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:0.6741em;\">\u003c/span>\u003cspan class=\"mord\">36\u003c/span>\u003cspan class=\"mord\">\u003cspan class=\"mord\">0\u003c/span>\u003cspan class=\"msupsub\">\u003cspan class=\"vlist-t\">\u003cspan class=\"vlist-r\">\u003cspan class=\"vlist\" style=\"height:0.6741em;\">\u003cspan style=\"top:-3.063em;margin-right:0.05em;\">\u003cspan class=\"pstrut\" style=\"height:2.7em;\">\u003c/span>\u003cspan class=\"sizing reset-size6 size3 mtight\">\u003cspan class=\"mbin mtight\">∘\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>.\u003c/p>\n"}]}</script>
<script>
(() => {
  'use strict';
  const D = JSON.parse(document.getElementById('quiz-data').textContent);
  const N = D.questions.length;
  const KEY = 'bmquiz:' + D.slug;
  const NAME_KEY = 'bmquiz:name';
  const LETTERS = 'ABCDEFGH';
  const app = document.getElementById('app');
  const actions = document.getElementById('actions');
  // Optional groups (e.g. 5 versions of one question): Choose a question then lists the groups.
  const GROUPS = [];
  D.questions.forEach((q, i) => {
    if (!q.group) return;
    const last = GROUPS[GROUPS.length - 1];
    if (last && last.name === q.group) last.idx.push(i); else GROUPS.push({ name: q.group, idx: [i] });
  });
  const groupOf = i => GROUPS.findIndex(g => g.idx.includes(i));
  // Question label: 4.2 = group 4, its 2nd question (grouped quiz); otherwise the plain number.
  const qlabel = i => { const k = groupOf(i); return k < 0 ? String(i + 1) : `${k + 1}.${GROUPS[k].idx.indexOf(i) + 1}`; };
  const reduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  // localStorage can be missing or throw (private mode, blocked storage) — the quiz still works without it.
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* ignore */ } },
    del(k) { try { localStorage.removeItem(k); } catch (e) { /* ignore */ } }
  };

  let S = null;              // current attempt: { n, mode, idx, answers, checked, elapsed, done, finishedAt }
  let timerId = null;
  let confirmSubmit = false;

  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  // Back to this note's root on the hub; optional "link" [label, href] adds a sibling page (e.g. the unit's concepts).
  const FOOT = `<p class="foot"><a href="${esc(D.hubHref || '../index.html')}">All quizzes</a>${D.link ? ` · <a href="${esc(D.link[1])}">${esc(D.link[0])}</a>` : ''}</p>`;
  const fmtTime = s => Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  const modeName = m => (m === 'test' ? 'Test' : m === 'pick' ? 'Choose' : 'Practice');
  const blank = a => a === undefined || a === null || String(a).trim() === '';
  const getName = () => store.get(NAME_KEY, '');

  function parseNum(s) {
    s = String(s).trim().replace(/\s+/g, '').replace(/−/g, '-').replace(',', '.');
    const f = s.match(/^(-?\d+(?:\.\d+)?)\/(-?\d+(?:\.\d+)?)$/);
    if (f) { const b = parseFloat(f[2]); return b ? parseFloat(f[1]) / b : null; }
    return /^-?(\d+\.?\d*|\.\d+)$/.test(s) ? parseFloat(s) : null;
  }
  function isCorrect(q, a) {
    if (blank(a)) return false;
    if (q.type === 'numeric') { const v = parseNum(a); return v !== null && Math.abs(v - q.answer) <= (q.tolerance || 1e-9); }
    return a === q.answer;
  }
  const score = () => D.questions.reduce((c, q, i) => c + (isCorrect(q, S.answers[i]) ? 1 : 0), 0);
  const answeredCount = () => D.questions.filter((_, i) => !blank(S.answers[i])).length;
  // "Choose a question" keeps its own marks, so it never replaces a Practice/Test attempt you can resume.
  const save = () => { if (S) store.set(S.mode === 'pick' ? KEY + ':pick' : KEY, S); };

  function startTimer() {
    stopTimer();
    timerId = setInterval(() => {
      if (!S || S.done || document.visibilityState !== 'visible') return;
      S.elapsed++; save();
      const t = document.getElementById('timer'); if (t) t.textContent = fmtTime(S.elapsed);
    }, 1000);
  }
  function stopTimer() { if (timerId) clearInterval(timerId); timerId = null; }

  // Fit display math to the phone: use the stacked version of a wide line, then shrink what still overflows.
  function fitMath(root) {
    (root || app).querySelectorAll('.mw').forEach(w => {
      w.classList.remove('stacked');
      const d = w.querySelector('.m-wide .katex-display');
      if (d && d.offsetParent && d.scrollWidth > d.clientWidth * 1.12) w.classList.add('stacked');
    });
    (root || app).querySelectorAll('.katex-display').forEach(d => {
      d.style.fontSize = '';
      if (!d.offsetParent) return;
      // KaTeX widths don't scale exactly with font-size, so step down until it fits (floor 70 %).
      let s = 1;
      for (let k = 0; k < 5 && d.scrollWidth > d.clientWidth + 1 && s > 0.7; k++) {
        s = Math.max(0.7, s * (d.clientWidth / d.scrollWidth) * 0.97);
        d.style.fontSize = s + 'em';
      }
    });
  }
  const fitAll = () => fitMath(app);
  window.addEventListener('resize', fitAll);
  document.addEventListener('toggle', e => fitMath(e.target), true);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitAll);

  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('show'), 2200);
  }

  // ---------- start ----------
  function renderStart() {
    stopTimer();
    const saved = store.get(KEY, null);
    const resumable = saved && saved.n === N && !saved.done;
    const reviewable = saved && saved.n === N && saved.done;
    const last = store.get(KEY + ':last', null);
    const kinds = new Set(D.questions.map(q => q.type));
    const kindText = kinds.size > 1 ? 'multiple choice and written answers' : kinds.has('numeric') ? 'written answers' : 'multiple choice';
    app.innerHTML = `
      <section class="card">
        <p class="eyebrow">${esc(D.course)} · ${esc(D.unit)}</p>
        <h1>${esc(D.heading)}</h1>
        <p class="meta">${N} question${N > 1 ? 's' : ''} · ${kindText}</p>
        ${D.intro ? `<div class="prose intro">${D.intro}</div>` : ''}
        <div class="field">
          <label for="name">Your name</label>
          <input id="name" type="text" autocomplete="given-name" autocapitalize="words" enterkeyhint="done" placeholder="Type your name" value="${esc(getName())}">
        </div>
        <div class="modes">
          ${resumable ? `<button class="btn primary mode" data-act="resume"><strong>Resume</strong><span>${modeName(saved.mode)} · question ${saved.idx + 1} of ${N} · ${fmtTime(saved.elapsed)}</span></button>` : ''}
          <button class="btn ${resumable ? 'secondary' : 'primary'} mode" data-act="practice"><strong>Practice</strong><span>Check each answer and see the solution</span></button>
          <button class="btn secondary mode" data-act="test"><strong>Test</strong><span>Answer everything, then see your score</span></button>
          <button class="btn secondary mode" data-act="choose"><strong>Choose a question</strong><span>Open any question, check it and see the solution</span></button>
        </div>
        ${last ? `<p class="last">Last result: <b>${last.score}/${last.total}</b> · ${modeName(last.mode)} · ${esc(last.date)}${reviewable ? ` · <a href="#" data-act="review">review</a>` : ''}</p>` : ''}
      </section>
      ${FOOT}`;
    actions.hidden = true;
    fitAll();
    window.scrollTo(0, 0);
  }

  function begin(mode) {
    S = { n: N, mode, idx: 0, answers: {}, checked: {}, elapsed: 0, done: false };
    confirmSubmit = false; save();
    renderQuestion(); window.scrollTo(0, 0); startTimer();
  }

  // ---------- choose a question ----------
  const freshPick = () => ({ n: N, mode: 'pick', idx: 0, answers: {}, checked: {}, elapsed: 0, done: false });
  function renderChooseList() {
    stopTimer();
    if (!S || S.mode !== 'pick') S = store.get(KEY + ':pick', null);
    if (!S || S.n !== N) S = freshPick();
    const done = Object.keys(S.checked).length;
    const right = D.questions.filter((q, i) => S.checked[i] && isCorrect(q, S.answers[i])).length;
    const items = GROUPS.length ? GROUPS.map((g, k) => {
      const c = g.idx.filter(i => S.checked[i]).length, ok = g.idx.filter(i => S.checked[i] && isCorrect(D.questions[i], S.answers[i])).length;
      const cls = c === g.idx.length ? (ok === c ? ' ok' : ' bad') : '';
      return `<li><button class="pickq${cls}" data-act="opengroup" data-g="${k}" aria-label="${k + 1}: ${esc(g.name)}, ${g.idx.length} questions${c ? `, ${ok} of ${c} correct` : ''}">
        <span class="qnum" aria-hidden="true">${k + 1}</span><span class="ptitle">${esc(g.name)}<small class="pmeta">${g.idx.length} questions${c ? ` · ${ok}/${c} correct` : ''}</small></span></button></li>`;
    }).join('') : D.questions.map((q, i) => {
      const c = !!S.checked[i], ok = c && isCorrect(q, S.answers[i]);
      return `<li><button class="pickq${c ? (ok ? ' ok' : ' bad') : ''}" data-act="open" data-i="${i}" aria-label="Question ${i + 1}: ${esc(q.title)}${c ? (ok ? ', correct' : ', wrong') : ''}">
        <span class="qnum" aria-hidden="true">${i + 1}</span><span class="ptitle">${esc(q.title)}</span>${c ? `<span class="mark ${ok ? 'ok' : 'bad'}" aria-hidden="true">${ok ? '✓' : '✗'}</span>` : ''}</button></li>`;
    }).join('');
    app.innerHTML = `
      <section class="card">
        <p class="eyebrow">${esc(D.course)} · ${esc(D.unit)}</p>
        <h1>${esc(D.heading)}</h1>
        <p class="meta">Choose a question · ${done} of ${N} checked${done ? ` · ${right} correct` : ''}</p>
        <ol class="picklist">${items}</ol>
      </section>
      ${FOOT}`;
    actions.innerHTML = `<div class="inner"><button class="btn secondary narrow" data-act="home">‹ Start</button>${done
      ? '<button class="btn ghost" data-act="choose-reset">Clear marks</button>' : ''}</div>`;
    actions.hidden = false;
    fitAll();
    const cur = app.querySelector(GROUPS.length ? `.pickq[data-g="${groupOf(S.idx)}"]` : `.pickq[data-i="${S.idx}"]`);
    if (cur && done) cur.scrollIntoView({ block: 'center' }); else window.scrollTo(0, 0);
  }

  // ---------- question ----------
  function progress() {
    const done = S.mode !== 'test' ? Object.keys(S.checked).length : answeredCount();
    return Math.round(100 * done / N);
  }

  function renderQuestion() {
    const i = S.idx, q = D.questions[i], a = S.answers[i];
    const locked = S.mode !== 'test' && !!S.checked[i];
    const dots = S.mode === 'test'
      ? `<div class="dots">${D.questions.map((_, j) =>
          `<button class="dot${blank(S.answers[j]) ? '' : ' answered'}${j === i ? ' current' : ''}" data-act="goto" data-i="${j}" aria-label="Question ${j + 1}${blank(S.answers[j]) ? '' : ', answered'}">${j + 1}</button>`).join('')}</div>`
      : '';
    let body;
    if (q.type === 'numeric') {
      const cls = locked ? (isCorrect(q, a) ? ' correct' : ' wrong') : '';
      body = `<div class="numeric${cls}"><label class="sr" for="num">Your answer</label>
        <div class="numrow"><button type="button" class="sign" data-act="sign" aria-label="Change sign"${locked ? ' disabled' : ''}>±</button>
        <input id="num" type="text" inputmode="decimal" autocomplete="off" enterkeyhint="done" placeholder="Your answer" value="${esc(blank(a) ? '' : a)}"${locked ? ' disabled' : ''}></div></div>`;
    } else {
      body = `<div class="choices" role="radiogroup" aria-label="Choices">${q.choices.map((c, k) => {
        const L = LETTERS[k];
        let cls = 'choice';
        if (locked) cls += L === q.answer ? ' correct' : L === a ? ' wrong' : '';
        return `<button class="${cls}" role="radio" aria-checked="${L === a}" data-act="pick" data-letter="${L}"${locked ? ' disabled' : ''}><span class="letter" aria-hidden="true">${L}</span><span class="ctext"><span class="sr">${L}. </span>${c}</span></button>`;
      }).join('')}</div>`;
    }
    app.innerHTML = `
      <div class="topbar">
        <div class="row">
          <button class="quit" data-act="${S.mode === 'pick' ? 'choose' : 'home'}" aria-label="${S.mode === 'pick' ? 'Back to the question list' : 'Leave quiz (progress is kept)'}">✕</button>
          <span class="count">${inGroup() ? `Question ${GROUPS[groupOf(i)].idx.indexOf(i) + 1} of ${GROUPS[groupOf(i)].idx.length}` : `Question ${i + 1} of ${N}`}</span>
          <span class="pill">${modeName(S.mode)}</span>
          ${S.mode === 'pick' ? '' : `<span class="timer" id="timer" aria-label="Time">${fmtTime(S.elapsed)}</span>`}
        </div>
        <div class="bar" aria-hidden="true"><i style="width:${progress()}%"></i></div>
        ${dots}
      </div>
      <section class="card">
        <h2 class="qtitle"><span class="qnum" aria-hidden="true">${qlabel(i)}</span><span>${esc(q.title)}</span></h2>
        <div class="prose">${q.prompt}</div>
        ${q.figure ? `<figure class="figure"><img src="${esc(q.figure)}" alt="${esc(q.figureAlt)}"></figure>` : ''}
        ${body}
        <div id="fb" aria-live="polite">${locked ? feedbackHtml(q, a) : ''}</div>
      </section>`;
    renderActions();
    fitAll();
  }

  const moreHtml = q => (q.more ? `<p class="more"><a class="morelink" href="${esc(q.more[1])}">${esc(q.more[0])}</a></p>` : '');

  function feedbackHtml(q, a) {
    const ok = isCorrect(q, a);
    const ans = q.type === 'numeric' ? q.answerHtml : `<b>${q.answer}</b>`;
    return `<div class="feedback ${ok ? 'ok' : 'bad'}">
      <p class="verdict">${ok ? '✓ Correct' : '✗ Not quite — the answer is ' + ans}</p>
      <div class="prose solution">${q.solutionTitle ? `<p class="stitle">${q.solutionTitle}</p>` : ''}${q.solution}</div>${moreHtml(q)}</div>`;
  }

  function renderActions() {
    const i = S.idx, last = i === N - 1, has = !blank(S.answers[i]);
    let h;
    if (S.mode === 'pick') {
      const end = inGroup() ? nextInGroup() === null : last;
      h = !S.checked[i]
        ? `<button class="btn secondary narrow" data-act="choose">‹ List</button><button class="btn primary" data-act="check"${has ? '' : ' disabled'}>Check</button>`
        : `<button class="btn secondary narrow" data-act="retry">Try again</button><button class="btn primary" data-act="${end ? 'choose' : 'next'}">${end ? '‹ List' : 'Next ›'}</button>`;
    } else if (S.mode === 'practice') {
      h = !S.checked[i]
        ? `<button class="btn primary" data-act="check"${has ? '' : ' disabled'}>Check</button>`
        : `<button class="btn primary" data-act="${last ? 'finish' : 'next'}">${last ? 'See result' : 'Next question'}</button>`;
    } else {
      h = `<button class="btn secondary narrow" data-act="prev"${i === 0 ? ' disabled' : ''}>‹ Back</button>` +
        (last ? `<button class="btn primary" data-act="submit">${confirmSubmit ? 'Submit anyway' : 'Submit'}</button>`
              : `<button class="btn primary" data-act="next">Next ›</button>`);
    }
    actions.innerHTML = `<div class="inner">${h}</div>`;
    actions.hidden = false;
  }

  const inGroup = () => S && S.mode === 'pick' && GROUPS.length > 0 && groupOf(S.idx) >= 0;
  function nextInGroup() {
    const g = GROUPS[groupOf(S.idx)], j = g.idx.indexOf(S.idx);
    return j < g.idx.length - 1 ? g.idx[j + 1] : null;
  }
  function openGroup(k) {
    if (!S || S.mode !== 'pick') S = store.get(KEY + ':pick', null);
    if (!S || S.n !== N) S = freshPick();
    S.idx = GROUPS[k].idx[0]; save(); stopTimer();
    renderQuestion(); window.scrollTo(0, 0);
  }

  function go(idx) {
    S.idx = idx; confirmSubmit = false; save();
    renderQuestion(); window.scrollTo(0, 0);
  }

  // ---------- result ----------
  function finish() {
    S.done = true; S.finishedAt = Date.now(); stopTimer(); save();
    store.set(KEY + ':last', {
      score: score(), total: N, mode: S.mode, elapsed: S.elapsed,
      date: new Date().toLocaleDateString(undefined, { day: 'numeric', month: 'short' })
    });
    renderResult();
  }

  function renderResult() {
    const sc = score(), name = getName();
    const items = D.questions.map((q, i) => {
      const a = S.answers[i], ok = isCorrect(q, a), skip = blank(a);
      const yours = skip ? 'no answer' : esc(a);
      const right = q.type === 'numeric' ? q.answerHtml : q.answer;
      return `<li><details>
        <summary><span class="mark ${ok ? 'ok' : skip ? 'skip' : 'bad'}" aria-label="${ok ? 'correct' : skip ? 'not answered' : 'wrong'}">${ok ? '✓' : skip ? '–' : '✗'}</span>
          <span class="rq"><b>Q${qlabel(i)}</b> ${esc(q.title)}</span><svg class="chev" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></summary>
        <div class="body"><p class="ya">Your answer: <b>${yours}</b> · Correct: <b>${right}</b></p><div class="prose">${q.solutionTitle ? `<p class="stitle">${q.solutionTitle}</p>` : ''}${q.solution}</div>${moreHtml(q)}</div>
      </details></li>`;
    }).join('');
    app.innerHTML = `
      <section class="card">
        <p class="eyebrow">${modeName(S.mode)} result${name ? ' · ' + esc(name) : ''}</p>
        <h1>${esc(D.heading)}</h1>
        <div class="score" aria-label="Score ${sc} out of ${N}">${sc}<small>/${N}</small></div>
        <p class="meta">${Math.round(100 * sc / N)}% · ${fmtTime(S.elapsed)}</p>
        ${name ? '' : `<div class="field"><label for="name">Your name (so ${esc(D.sendTo)} knows who sent it)</label>
          <input id="name" type="text" autocomplete="given-name" autocapitalize="words" enterkeyhint="done" placeholder="Type your name"></div>`}
        <ol class="review">${items}</ol>
        ${D.takeaway ? `<div class="takeaway prose"><h3>Key idea</h3>${D.takeaway}</div>` : ''}
        <div class="stack"><button class="btn ghost" data-act="copy">Copy result text</button></div>
      </section>
      ${FOOT}`;
    actions.innerHTML = `<div class="inner"><button class="btn secondary narrow" data-act="again">Try again</button>
      <button class="btn primary" data-act="share">Send result to ${esc(D.sendTo)}</button></div>`;
    actions.hidden = false;
    fitAll();
    window.scrollTo(0, 0);
  }

  function resultText() {
    const sc = score();
    const marks = D.questions.map((q, i) => {
      const a = S.answers[i];
      if (blank(a)) return `Q${qlabel(i)} –`;
      return isCorrect(q, a) ? `Q${qlabel(i)} ✓` : `Q${qlabel(i)} ✗ (${a}, answer ${q.answer})`;
    }).join('   ');
    return [
      `Quiz result — ${getName() || '(no name)'}`,
      D.title,
      `${modeName(S.mode)}: ${sc}/${N} (${Math.round(100 * sc / N)}%) in ${fmtTime(S.elapsed)}`,
      marks,
      new Date(S.finishedAt || Date.now()).toLocaleString(),
      /^https?:/.test(location.href) ? location.href.split('#')[0] : ''
    ].filter(Boolean).join('\n');
  }

  async function copyResult() {
    const text = resultText();
    try { await navigator.clipboard.writeText(text); toast('Result copied'); return; } catch (e) { /* fall back */ }
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast('Result copied'); } catch (e) { toast('Could not copy'); }
    ta.remove();
  }

  async function shareResult() {
    if (navigator.share) {
      try { await navigator.share({ title: 'Quiz result', text: resultText() }); return; }
      catch (e) { if (e && e.name === 'AbortError') return; }
    }
    await copyResult();
    toast(`Result copied — paste it to ${D.sendTo}`);
  }

  // ---------- events ----------
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-act]');
    if (!b || b.disabled) return;
    const act = b.dataset.act;
    if (b.tagName === 'A') e.preventDefault();
    switch (act) {
      case 'practice': case 'test': begin(act); break;
      case 'resume': S = store.get(KEY, null); confirmSubmit = false; renderQuestion(); window.scrollTo(0, 0); startTimer(); break;
      case 'review': S = store.get(KEY, null); renderResult(); break;
      case 'pick': {
        S.answers[S.idx] = b.dataset.letter; confirmSubmit = false; save();
        const y = window.scrollY; renderQuestion(); window.scrollTo(0, y);
        const again = app.querySelector(`.choice[data-letter="${b.dataset.letter}"]`);
        if (again) again.focus({ preventScroll: true });
        break;
      }
      case 'sign': { // the iPhone decimal keypad has no minus key
        const inp = document.getElementById('num');
        if (!inp) break;
        const v = inp.value.trim().replace(/^−/, '-');
        inp.value = v.startsWith('-') ? v.slice(1) : '-' + v;
        inp.dispatchEvent(new Event('input', { bubbles: true }));
        inp.focus({ preventScroll: true });
        break;
      }
      case 'check': {
        S.checked[S.idx] = true; save();
        const y = window.scrollY; renderQuestion(); window.scrollTo(0, y);
        document.getElementById('fb').scrollIntoView({ behavior: reduced ? 'auto' : 'smooth', block: 'nearest' });
        break;
      }
      case 'next': if (inGroup()) { const j = nextInGroup(); if (j !== null) go(j); } else if (S.idx < N - 1) go(S.idx + 1); break;
      case 'prev': if (S.idx > 0) go(S.idx - 1); break;
      case 'goto': go(+b.dataset.i); break;
      case 'submit': {
        const miss = N - answeredCount();
        if (miss && !confirmSubmit) {
          confirmSubmit = true;
          document.getElementById('fb').innerHTML =
            `<p class="notice">${miss} question${miss > 1 ? 's are' : ' is'} not answered yet. Tap <b>Submit anyway</b> to finish, or use the numbers above to go back.</p>`;
          renderActions();
        } else finish();
        break;
      }
      case 'finish': finish(); break;
      case 'choose': renderChooseList(); break;
      case 'open': S.idx = +b.dataset.i; save(); renderQuestion(); window.scrollTo(0, 0); break;
      case 'opengroup': openGroup(+b.dataset.g); break;
      case 'retry': delete S.checked[S.idx]; delete S.answers[S.idx]; save(); renderQuestion(); break;
      case 'choose-reset': S = freshPick(); save(); renderChooseList(); break;
      case 'home': renderStart(); break;
      case 'again': store.del(KEY); S = null; renderStart(); break;
      case 'share': shareResult(); break;
      case 'copy': copyResult(); break;
    }
  });

  document.addEventListener('input', e => {
    if (e.target.id === 'name') { store.set(NAME_KEY, e.target.value.trim()); return; }
    if (e.target.id === 'num' && S) {
      S.answers[S.idx] = e.target.value; confirmSubmit = false; save();
      renderActions();
      const dot = app.querySelector(`.dot[data-i="${S.idx}"]`);
      if (dot) dot.classList.toggle('answered', !blank(e.target.value));
    }
  });

  document.addEventListener('keydown', e => {
    if (e.key !== 'Enter' || !['num', 'name'].includes(e.target.id)) return;
    e.preventDefault(); e.target.blur();
    if (e.target.id === 'num') { const p = actions.querySelector('.btn.primary'); if (p && !p.disabled) p.click(); }
  });

  // Deep link: quiz.html#g4 opens group 4 (e.g. the 5 versions of question 4) straight away.
  function route() {
    const m = location.hash.match(/^#g(\d+)$/);
    if (m && GROUPS[+m[1] - 1]) openGroup(+m[1] - 1); else renderStart();
  }
  window.addEventListener('hashchange', route);
  route();
})();
</script>
</body>
</html>

03c/span>\u003cspan class=\"vlist-s\">​\u003c/span>\u003c/span>\u003cspan class=\"vlist-r\">\u003cspan class=\"vlist\" style=\"height:0.34em;\">\u003cspan>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/p>\n\u003cp>Check with \u003cspan class=\"katex\">\u003cspan class=\"katex-mathml\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmn>8\u003c/mn>\u003cmtext> km\u003c/mtext>\u003cmo>=\u003c/mo>\u003cmn>5\u003c/mn>\u003cmtext> miles\u003c/mtext>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">8 \\text{ km} = 5 \\text{ miles}\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/span>\u003cspan class=\"katex-html\" aria-hidden=\"true\">\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:0.6944em;\">\u003c/span>\u003cspan class=\"mord\">8\u003c/span>\u003cspan class=\"mord text\">\u003cspan class=\"mord\"> km\u003c/span>\u003c/span>\u003cspan class=\"mspace\" style=\"margin-right:0.2778em;\">\u003c/span>\u003cspan class=\"mrel\">=\u003c/span>\u003cspan class=\"mspace\" style=\"margin-right:0.2778em;\">\u003c/span>\u003c/span>\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:0.6944em;\">\u003c/span>\u003cspan class=\"mord\">5\u003c/span>\u003cspan class=\"mord text\">\u003cspan class=\"mord\"> miles\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>: 16 km is twice 8, so twice 5.\u003c/p>\n"]},{"group":"13.4 Real-Life Graphs","title":"Distance–time graph","prompt":"\u003cul>\n\u003cli>Time goes across, distance goes up.\u003c/li>\n\u003cli>A \u003cstrong>flat\u003c/strong> part means the bus is \u003cstrong>stopped\u003c/strong>: time passes, the distance stays.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Examples:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>\n\u003cp>\u003cstrong>a)\u003c/strong> how far after 20 minutes?\u003c/p>\n\u003c/li>\n\u003cli>\n\u003cp>\u003cstrong>b)\u003c/strong> how long is the stop?\u003c/p>\n\u003c/li>\n\u003cli>\n\u003cp>\u003cstrong>c)\u003c/strong> how far is the whole trip?\u003c/p>\n\u003c/li>\n\u003cli>\n\u003cp>\u003cstrong>d)\u003c/strong> how long does the whole trip take?\u003c/p>\n\u003c/li>\n\u003c/ul>\n","figure":"media/ch13-distance-time.svg","figureAlt":"A distance–time graph of a bus trip: 10 km in 20 minutes, flat from 20 to 30 minutes, then up to 18 km at 50 minutes.","steps":["\u003cp>\u003cstrong>a)\u003c/strong> up from 20, across:\u003c/p>\n\u003cp class=\"katex-block\">\u003cspan class=\"katex-display\">\u003cspan class=\"katex\">\u003cspan class=\"katex-mathml\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003csemantics>\u003cmrow>\u003cmenclose notation=\"box\">\u003cmstyle scriptlevel=\"0\" displaystyle=\"false\">\u003cmstyle scriptlevel=\"0\" displaystyle=\"false\">\u003cmstyle scriptlevel=\"0\" displaystyle=\"true\">\u003cmrow>\u003cmn>10\u003c/mn>\u003cmtext> km\u003c/mtext>\u003c/mrow>\u003c/mstyle>\u003c/mstyle>\u003c/mstyle>\u003c/menclose>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">\\boxed{10 \\text{ km}}\n\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/span>\u003cspan class=\"katex-html\" aria-hidden=\"true\">\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:1.3744em;vertical-align:-0.34em;\">\u003c/span>\u003cspan class=\"mord\">\u003cspan class=\"vlist-t vlist-t2\">\u003cspan class=\"vlist-r\">\u003cspan class=\"vlist\" style=\"height:1.0344em;\">\u003cspan style=\"top:-3.3744em;\">\u003cspan class=\"pstrut\" style=\"height:3.3744em;\">\u003c/span>\u003cspan class=\"boxpad\">\u003cspan class=\"mord\">\u003cspan class=\"mord\">\u003cspan class=\"mord\">10\u003c/span>\u003cspan class=\"mord text\">\u003cspan class=\"mord\"> km\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003cspan style=\"top:-3.0344em;\">\u003cspan class=\"pstrut\" style=\"height:3.3744em;\">\u003c/span>\u003cspan class=\"stretchy fbox\" style=\"height:1.3744em;border-style:solid;border-width:0.04em;\">\u003c/span>\u003c/span>\u003c/span>\u003cspan class=\"vlist-s\">​\u003c/span>\u003c/span>\u003cspan class=\"vlist-r\">\u003cspan class=\"vlist\" style=\"height:0.34em;\">\u003cspan>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/p>\n","\u003cp>\u003cstrong>b)\u003c/strong> flat from 20 to 30:\u003c/p>\n\u003cp class=\"katex-block\">\u003cspan class=\"katex-display\">\u003cspan class=\"katex\">\u003cspan class=\"katex-mathml\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003csemantics>\u003cmrow>\u003cmn>30\u003c/mn>\u003cmo>−\u003c/mo>\u003cmn>20\u003c/mn>\u003cmo>=\u003c/mo>\u003cmenclose notation=\"box\">\u003cmstyle scriptlevel=\"0\" displaystyle=\"false\">\u003cmstyle scriptlevel=\"0\" displaystyle=\"false\">\u003cmstyle scriptlevel=\"0\" displaystyle=\"true\">\u003cmrow>\u003cmn>10\u003c/mn>\u003cmtext> minutes\u003c/mtext>\u003c/mrow>\u003c/mstyle>\u003c/mstyle>\u003c/mstyle>\u003c/menclose>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">30 - 20 = \\boxed{10 \\text{ minutes}}\n\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/span>\u003cspan class=\"katex-html\" aria-hidden=\"true\">\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:0.7278em;vertical-align:-0.0833em;\">\u003c/span>\u003cspan class=\"mord\">30\u003c/span>\u003cspan class=\"mspace\" style=\"margin-right:0.2222em;\">\u003c/span>\u003cspan class=\"mbin\">−\u003c/span>\u003cspan class=\"mspace\" style=\"margin-right:0.2222em;\">\u003c/span>\u003c/span>\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:0.6444em;\">\u003c/span>\u003cspan class=\"mord\">20\u003c/span>\u003cspan class=\"mspace\" style=\"margin-right:0.2778em;\">\u003c/span>\u003cspan class=\"mrel\">=\u003c/span>\u003cspan class=\"mspace\" style=\"margin-right:0.2778em;\">\u003c/span>\u003c/span>\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:1.3479em;vertical-align:-0.34em;\">\u003c/span>\u003cspan class=\"mord\">\u003cspan class=\"vlist-t vlist-t2\">\u003cspan class=\"vlist-r\">\u003cspan class=\"vlist\" style=\"height:1.0079em;\">\u003cspan style=\"top:-3.3479em;\">\u003cspan class=\"pstrut\" style=\"height:3.3479em;\">\u003c/span>\u003cspan class=\"boxpad\">\u003cspan class=\"mord\">\u003cspan class=\"mord\">\u003cspan class=\"mord\">10\u003c/span>\u003cspan class=\"mord text\">\u003cspan class=\"mord\"> minutes\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003cspan style=\"top:-3.0079em;\">\u003cspan class=\"pstrut\" style=\"height:3.3479em;\">\u003c/span>\u003cspan class=\"stretchy fbox\" style=\"height:1.3479em;border-style:solid;border-width:0.04em;\">\u003c/span>\u003c/span>\u003c/span>\u003cspan class=\"vlist-s\">​\u003c/span>\u003c/span>\u003cspan class=\"vlist-r\">\u003cspan class=\"vlist\" style=\"height:0.34em;\">\u003cspan>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/p>\n","\u003cp>\u003cstrong>c)\u003c/strong> the top of the graph:\u003c/p>\n\u003cp class=\"katex-block\">\u003cspan class=\"katex-display\">\u003cspan class=\"katex\">\u003cspan class=\"katex-mathml\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003csemantics>\u003cmrow>\u003cmenclose notation=\"box\">\u003cmstyle scriptlevel=\"0\" displaystyle=\"false\">\u003cmstyle scriptlevel=\"0\" displaystyle=\"false\">\u003cmstyle scriptlevel=\"0\" displaystyle=\"true\">\u003cmrow>\u003cmn>18\u003c/mn>\u003cmtext> km\u003c/mtext>\u003c/mrow>\u003c/mstyle>\u003c/mstyle>\u003c/mstyle>\u003c/menclose>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">\\boxed{18 \\text{ km}}\n\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/span>\u003cspan class=\"katex-html\" aria-hidden=\"true\">\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:1.3744em;vertical-align:-0.34em;\">\u003c/span>\u003cspan class=\"mord\">\u003cspan class=\"vlist-t vlist-t2\">\u003cspan class=\"vlist-r\">\u003cspan class=\"vlist\" style=\"height:1.0344em;\">\u003cspan style=\"top:-3.3744em;\">\u003cspan class=\"pstrut\" style=\"height:3.3744em;\">\u003c/span>\u003cspan class=\"boxpad\">\u003cspan class=\"mord\">\u003cspan class=\"mord\">\u003cspan class=\"mord\">18\u003c/span>\u003cspan class=\"mord text\">\u003cspan class=\"mord\"> km\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003cspan style=\"top:-3.0344em;\">\u003cspan class=\"pstrut\" style=\"height:3.3744em;\">\u003c/span>\u003cspan class=\"stretchy fbox\" style=\"height:1.3744em;border-style:solid;border-width:0.04em;\">\u003c/span>\u003c/span>\u003c/span>\u003cspan class=\"vlist-s\">​\u003c/span>\u003c/span>\u003cspan class=\"vlist-r\">\u003cspan class=\"vlist\" style=\"height:0.34em;\">\u003cspan>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/p>\n","\u003cp>\u003cstrong>d)\u003c/strong> the end of the graph:\u003c/p>\n\u003cp class=\"katex-block\">\u003cspan class=\"katex-display\">\u003cspan class=\"katex\">\u003cspan class=\"katex-mathml\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003csemantics>\u003cmrow>\u003cmenclose notation=\"box\">\u003cmstyle scriptlevel=\"0\" displaystyle=\"false\">\u003cmstyle scriptlevel=\"0\" displaystyle=\"false\">\u003cmstyle scriptlevel=\"0\" displaystyle=\"true\">\u003cmrow>\u003cmn>50\u003c/mn>\u003cmtext> minutes\u003c/mtext>\u003c/mrow>\u003c/mstyle>\u003c/mstyle>\u003c/mstyle>\u003c/menclose>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">\\boxed{50 \\text{ minutes}}\n\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/span>\u003cspan class=\"katex-html\" aria-hidden=\"true\">\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:1.3479em;vertical-align:-0.34em;\">\u003c/span>\u003cspan class=\"mord\">\u003cspan class=\"vlist-t vlist-t2\">\u003cspan class=\"vlist-r\">\u003cspan class=\"vlist\" style=\"height:1.0079em;\">\u003cspan style=\"top:-3.3479em;\">\u003cspan class=\"pstrut\" style=\"height:3.3479em;\">\u003c/span>\u003cspan class=\"boxpad\">\u003cspan class=\"mord\">\u003cspan class=\"mord\">\u003cspan class=\"mord\">50\u003c/span>\u003cspan class=\"mord text\">\u003cspan class=\"mord\"> minutes\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003cspan style=\"top:-3.0079em;\">\u003cspan class=\"pstrut\" style=\"height:3.3479em;\">\u003c/span>\u003cspan class=\"stretchy fbox\" style=\"height:1.3479em;border-style:solid;border-width:0.04em;\">\u003c/span>\u003c/span>\u003c/span>\u003cspan class=\"vlist-s\">​\u003c/span>\u003c/span>\u003cspan class=\"vlist-r\">\u003cspan class=\"vlist\" style=\"height:0.34em;\">\u003cspan>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/p>\n\u003cp>Not 30 km for c): the flat part adds no distance.\u003c/p>\n"]}]}</script>
<script>
(() => {
  'use strict';
  const D = JSON.parse(document.getElementById('material-data').textContent);
  const app = document.getElementById('app');
  const shown = D.questions.map(() => 0);     // steps revealed per question
  const reduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const HUB = D.hubHref || '../index.html#material';   // this note's root, Material tab

  // Fit display math to the phone: use the stacked version of a wide line, then shrink what still overflows.
  function fitMath(root) {
    (root || app).querySelectorAll('.mw').forEach(w => {
      w.classList.remove('stacked');
      const d = w.querySelector('.m-wide .katex-display');
      if (d && d.offsetParent && d.scrollWidth > d.clientWidth * 1.12) w.classList.add('stacked');
    });
    (root || app).querySelectorAll('.katex-display').forEach(d => {
      d.style.fontSize = '';
      if (!d.offsetParent) return;
      let s = 1;
      for (let k = 0; k < 5 && d.scrollWidth > d.clientWidth + 1 && s > 0.7; k++) {
        s = Math.max(0.7, s * (d.clientWidth / d.scrollWidth) * 0.97);
        d.style.fontSize = s + 'em';
      }
    });
  }

  function label(i) {
    const n = D.questions[i].steps.length, k = shown[i];
    if (k === 0) return 'Show working';
    if (k < n) return `Next step (${k + 1}/${n})`;
    return 'Hide working';
  }

  function update(i) {
    const card = document.getElementById('q' + i);
    card.querySelectorAll('.step').forEach((s, k) => { s.hidden = k >= shown[i]; });
    const b = card.querySelector('[data-act="step"]');
    b.textContent = label(i);
    b.classList.toggle('primary', shown[i] < D.questions[i].steps.length);
    b.classList.toggle('secondary', shown[i] === D.questions[i].steps.length);
    b.setAttribute('aria-expanded', String(shown[i] > 0));
    fitMath(card);
  }

  // Practice table: given columns + one typed answer per row, checked on the page (same number rule as the quiz page).
  function parseNum(s) {
    s = String(s).trim().replace(/\s+/g, '').replace(/−/g, '-').replace(',', '.');
    const f = s.match(/^(-?\d+(?:\.\d+)?)\/(-?\d+(?:\.\d+)?)$/);
    if (f) { const b = parseFloat(f[2]); return b ? parseFloat(f[1]) / b : null; }
    return /^-?(\d+\.?\d*|\.\d+)$/.test(s) ? parseFloat(s) : null;
  }
  function practiceHtml(q, i) {
    const p = q.practice;
    return `<div class="practice" id="p${i}">
      <table><thead><tr>${p.head.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>
      ${p.rows.map((r, k) => `<tr><td>${r[0]}</td><td>${r[1]}</td><td>
        <div class="pin"><button type="button" class="sign" data-act="psign" data-i="${i}" data-k="${k}" aria-label="Change sign">±</button>
        <input id="p${i}-${k}" type="text" inputmode="decimal" autocomplete="off" enterkeyhint="${k < p.rows.length - 1 ? 'next' : 'done'}" aria-label="Answer, row ${k + 1}"></div>
        <span class="ptag" id="p${i}-${k}-tag"></span></td></tr>`).join('')}
      </tbody></table>
      <div class="prow"><button class="btn primary" data-act="pcheck" data-i="${i}">Check</button><button class="btn secondary" data-act="pclear" data-i="${i}">Clear</button></div>
      <p class="pscore" id="p${i}-score" aria-live="polite"></p>
    </div>`;
  }
  function checkPractice(i) {
    const p = D.questions[i].practice; let right = 0;
    p.answers.forEach((ans, k) => {
      const inp = document.getElementById(`p${i}-${k}`), td = inp.closest('td'), tag = document.getElementById(`p${i}-${k}-tag`);
      const v = parseNum(inp.value), typed = inp.value.trim() !== '', ok = v !== null && Math.abs(v - ans) <= p.tolerance + 1e-12;
      td.classList.toggle('correct', ok); td.classList.toggle('wrong', typed && !ok);
      tag.textContent = ok && p.tags ? p.tags[k] : '';
      if (ok) right++;
    });
    document.getElementById(`p${i}-score`).textContent = `${right}/${p.answers.length} correct`;
  }
  function clearPractice(i) {
    document.querySelectorAll(`#p${i} input`).forEach(x => { x.value = ''; });
    document.querySelectorAll(`#p${i} td`).forEach(td => td.classList.remove('correct', 'wrong'));
    document.querySelectorAll(`#p${i} .ptag`).forEach(t => { t.textContent = ''; });
    document.getElementById(`p${i}-score`).textContent = '';
  }

  function allOpen() { return D.questions.every((q, i) => shown[i] === q.steps.length); }
  function updateAll() {
    D.questions.forEach((_, i) => update(i));
    document.querySelector('[data-act="all"]').textContent = allOpen() ? 'Hide all' : 'Show all';
  }

  app.innerHTML = `
    <div class="topbar"><div class="row">
      <a class="back" href="${esc(HUB)}">‹ Material</a>
      <button class="btn ghost narrow showall" data-act="all">Show all</button>
    </div></div>
    <section class="card">
      <p class="eyebrow">${esc(D.course)}</p>
      <h1>${esc(D.heading)}</h1>
      ${D.intro ? `<div class="prose">${D.intro}</div>` : ''}
      ${D.figure ? `<figure class="figure"><img src="${esc(D.figure)}" alt="${esc(D.figureAlt)}"></figure>` : ''}
    </section>
    ${D.questions.map((q, i) => `${q.group && q.group !== (D.questions[i - 1] || {}).group ? `
    <h2 class="course">${esc(q.group)}</h2>` : ''}
    <section class="card mq" id="q${i}">
      <h2 class="qtitle"><span class="qnum" aria-hidden="true">${i + 1}</span><span>${esc(q.title)}</span></h2>
      <div class="prose">${q.prompt}</div>
      ${q.figure ? `<figure class="figure"><img src="${esc(q.figure)}" alt="${esc(q.figureAlt)}"></figure>` : ''}
      ${q.practice ? practiceHtml(q, i) : ''}
      <div class="steps" id="steps${i}">${q.steps.map(s => `<div class="step prose" hidden>${s}</div>`).join('')}</div>
      <button class="btn primary reveal" data-act="step" data-i="${i}" aria-controls="steps${i}" aria-expanded="false">Show working</button>
    </section>`).join('')}
    <p class="foot"><a href="${esc(HUB)}">All material</a>${D.link ? ` · <a href="${esc(D.link[1])}">${esc(D.link[0])}</a>` : ''}</p>`;

  document.addEventListener('click', e => {
    const b = e.target.closest('[data-act]');
    if (!b) return;
    if (b.dataset.act === 'step') {
      const i = +b.dataset.i, n = D.questions[i].steps.length;
      shown[i] = shown[i] < n ? shown[i] + 1 : 0;
      update(i);
      document.querySelector('[data-act="all"]').textContent = allOpen() ? 'Hide all' : 'Show all';
      if (shown[i] > 0) {
        const s = document.querySelectorAll(`#q${i} .step`)[shown[i] - 1];
        s.scrollIntoView({ behavior: reduced ? 'auto' : 'smooth', block: 'nearest' });
      }
    } else if (b.dataset.act === 'all') {
      const open = !allOpen();
      D.questions.forEach((q, i) => { shown[i] = open ? q.steps.length : 0; });
      updateAll();
    } else if (b.dataset.act === 'psign') {  // the iPhone decimal keypad has no minus key
      const inp = document.getElementById(`p${b.dataset.i}-${b.dataset.k}`);
      const v = inp.value.trim().replace(/^−/, '-');
      inp.value = v.startsWith('-') ? v.slice(1) : '-' + v;
      inp.focus({ preventScroll: true });
    } else if (b.dataset.act === 'pcheck') {
      checkPractice(+b.dataset.i);
    } else if (b.dataset.act === 'pclear') {
      clearPractice(+b.dataset.i);
    }
  });
  document.addEventListener('keydown', e => {   // Enter moves to the next field, and checks the table after the last one
    const m = e.key === 'Enter' && e.target.id && e.target.id.match(/^p(\d+)-(\d+)$/);
    if (!m) return;
    e.preventDefault();
    const next = document.getElementById(`p${m[1]}-${+m[2] + 1}`);
    if (next) next.focus(); else { e.target.blur(); checkPractice(+m[1]); }
  });
  window.addEventListener('resize', () => fitMath(app));
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => fitMath(app));
  updateAll();
})();
</script>
</body>
</html>
